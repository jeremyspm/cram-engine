/* ============================ two doors ============================
   ONE dataset, two ways in. "Get me ready" lets the engine choose the
   queue; "I'll pick" hands the topics back. Neither locks anything, and
   a reduced queue always says so out loud.                            */
function cardWeak(c){
  if(isRecall(c)) return srsGet(c.key).box<=1;
  const m=S.mcq[c.key];
  return (!m||!m.t) ? true : (m.g/m.t)<0.6;      // never drilled counts as weak
}
/* Rank 0 is "highest-value unknown". Two things qualify, not one:
   - a focus point the course lists that no practice test covers, and
   - a question the LECTURER has set before, which is the strongest available
     predictor of what gets asked again.
   Never-practised-only was right when the pack had no captured questions. Once 195
   of the lecturer's own questions were harvested, that alone meant the opening queue
   was 18 cards of unsourced textbook content served ahead of every question actually
   set in the past. */
function cardRank(c,cm){
  const cr=cm[c.crit];
  if(cardWeak(c)&&((cr&&cr.blind)||c.tier==='verbatim')) return 0;
  if(cardWeak(c)) return 1;
  if(isRecall(c)&&srsGet(c.key).due<=Date.now()) return 2;
  return 3;
}

/* ================= the deck =================================================
   Cards are DEALT FROM AN ORDERED DECK, not drawn at random.

   What this replaces, and why. The old queue ranked cards 0-3 and then rendered
   only the single lowest rank present. On this pack that meant a cold user's Learn
   view held 69 of 288 cards and three whole topics — gas exchange, cardiac output,
   terminology — were unreachable, because a card only leaves rank 0 after two
   correct recalls and the pool was sampled at random. 356 of 587 cards were gated.
   On top of that, random-with-replacement needs ~333 draws to show a 69-card pool
   once, and repeats the card you just saw 1 time in 69.

   A deck fixes all of it at once:
     - EVERY card is in the deck. Rank sets ORDER, never membership.
     - No card repeats until the deck is exhausted, so coverage is guaranteed.
     - Topics are interleaved by even stride inside each rank band, so a big topic
       cannot bunch and a small one cannot starve.
     - A card you get wrong is spliced back in a few cards ahead, which is what
       makes it a cram tool rather than a reading order.
   The deck rebuilds and re-ranks when it runs out, or when the door, topic or
   focus scope changes.

   BODY-SYSTEM BLOCKS. Even stride across every topic was right about topic
   starvation and wrong about everything else: on hs2-test1 it dealt a perfect
   round-robin through all twelve topics, so fourteen consecutive cards ran gas
   exchange → terminology → vessels → control of breathing → blood pressure →
   heart anatomy → respiratory anatomy → immunity → … You never stay inside one
   system long enough to build anything, and a cram tool that hops systems every
   card is asking for twelve cold starts instead of one warm run.

   So a pack may declare `systems` — an ordered list — and give each topic a `sys`.
   The deck is then dealt one system at a time in that order, and stride-merging
   happens only among the topics INSIDE a system, where interleaving is right:
   heart anatomy and the cardiac cycle genuinely explain each other. Rank still
   orders cards within a topic, so the lecturer's own questions still lead — they
   now lead within their system rather than globally, which is what the door note
   has to say, and does.

   A pack that declares no systems keeps the old whole-pack stride exactly.      */
/* Even stride: a topic holding n of N cards is dealt every N/n slots, so every
   topic is spread across the whole deck whatever its size, and the largest topic
   cannot bunch at the tail the way plain round-robin leaves it. */
function strideMerge(groups,N){
  const out=[];
  for(const g of groups) g.forEach((c,i)=>out.push({c,pos:(i+0.5)*N/g.length}));
  return out.sort((a,b)=>a.pos-b.pos).map(x=>x.c);
}
function deckSource(types){
  /* "Get me ready" ranks the whole pack; "I'll pick" honours the topic chip. A
     focus scope from the Brief overrides both, and falls back to the whole pack
     for that focus point if the current filter holds none of it. */
  const all=cardsOf(types,'all').filter(inPool);
  const base=S.door==='ready'?all:cardsOf(types,S.topic).filter(inPool);
  const scoped=!S.crit?base:(critScope(base).length?critScope(base):critScope(all));
  /* Two cards with the same key are the same card — same type, same question, same
     answer. hs2-test1 carries five such pairs from a double-import in the harvest.
     They share one progress record by definition, so dealing both just serves the
     reader the identical question twice in a pass. */
  const seen=new Set();
  return scoped.filter(c=>seen.has(c.key)?false:(seen.add(c.key),true));
}
/* The declared system order, as topic-id lists — plus a final block holding every
   topic no system claims, so a pack with a partial `systems` list still deals every
   card it has. Returns null when the pack declares no systems at all. */
function systemBlocks(){
  const sys=PACK.systems||[];
  if(!sys.length) return null;
  const ids=new Set(sys.map(s=>s.id));
  const blocks=sys.map(s=>({id:s.id,name:s.name||s.id,topics:PACK.topics.filter(t=>t.sys===s.id).map(t=>t.id)}));
  const orphan=PACK.topics.filter(t=>!ids.has(t.sys)).map(t=>t.id);
  if(orphan.length) blocks.push({id:'_rest',name:'Everything else',topics:orphan});
  return blocks;
}
function buildDeck(types){
  const cm={}; (PACK.criteria||[]).forEach(c=>cm[c.id]=c);
  const src=deckSource(types);
  /* Order INSIDE each topic by rank, THEN stride-merge the topics.
     Doing it the other way round — rank bands first, topics spread inside each
     band — looks equivalent and is not. Band 0 on this pack contains no gas
     exchange, cardiac output or terminology card at all, so those topics could
     not appear until card 70 of 288. Topic coverage has to be the outer loop:
     rank decides WHAT you see from a topic, never WHETHER you reach it. */
  const by={};
  src.forEach(c=>(by[c.topic]=by[c.topic]||[]).push(c));
  const ranked=q=>{
    const bands=[[],[],[],[]];
    q.forEach(c=>bands[cardRank(c,cm)].push(c));
    return [].concat(...bands.map(shuffle));
  };
  const blocks=systemBlocks();
  if(!blocks) return strideMerge(Object.values(by).map(ranked),src.length);
  /* One system at a time, stride-merging only the topics inside it. Every group in
     `by` belongs to exactly one block — systemBlocks sweeps unclaimed topics into a
     final block — so this deals each card exactly once. */
  const out=[];
  for(const b of blocks){
    const groups=b.topics.map(t=>by[t]).filter(g=>g&&g.length);
    if(!groups.length) continue;
    out.push(...strideMerge(groups.map(ranked),groups.reduce((n,g)=>n+g.length,0)));
  }
  return out;
}
/* In memory only — a deck is a sitting, not saved progress. */
const DECK={};
const deckKey=t=>Array.isArray(t)?t.join('+'):t;
const deckSig=()=>[S.door,S.topic,S.crit,bgOn()].join('|');   // toggling background rebuilds the deck
function nextCard(types){
  const k=deckKey(types), sig=deckSig();
  let d=DECK[k];
  if(!d||d.sig!==sig||d.i>=d.cards.length) d=DECK[k]={cards:buildDeck(types),i:0,sig};
  return d.cards.length?d.cards[d.i++]:null;
}
/* A missed card comes back inside the same sitting rather than waiting a whole
   pass. Again lands sooner than Hard. */
function requeue(types,card,gap){
  const d=DECK[deckKey(types)];
  if(!d||!card) return;
  d.cards.splice(Math.min(d.i+gap,d.cards.length),0,card);
}
/* Composition of the current deck, for the door note. Reports, never filters.

   `weak` counts only cards the reader has ACTUALLY ATTEMPTED and is scoring badly
   on. cardWeak() deliberately treats never-attempted as weak — that is right for
   ORDERING, since an untouched card is exactly as unproven as a failed one — but it
   is wrong for a sentence. Reported raw it told a reader who had answered nothing
   that 356 cards were ones "you have been getting wrong", which is both false and
   the single most discouraging thing the tool could open with. */
function cardSeen(c){
  if(isRecall(c)) return srsGet(c.key).seen>0;
  const m=S.mcq[c.key];
  return !!(m&&m.t);
}
function deckStats(types){
  const cm={}; (PACK.criteria||[]).forEach(c=>cm[c.id]=c);
  const src=deckSource(types);
  /* Which system blocks this deck ACTUALLY contains. The note names them, and
     `systemBlocks()` is derived from the pack, not the pool — so with background
     reading switched off it would happily announce an order containing a block that
     has no cards left in it. Name what will be dealt. */
  const tops=new Set(src.map(c=>c.topic));
  const blocks=(systemBlocks()||[]).filter(b=>b.id!=='_rest'&&b.topics.some(t=>tops.has(t)));
  return {total:src.length, hot:src.filter(c=>cardRank(c,cm)===0).length,
          weak:src.filter(c=>cardRank(c,cm)===1&&cardSeen(c)).length, blocks};
}
/* per-topic readiness, or null when there is genuinely no data to report */
function topicReady(tid){
  /* Against the pool actually being studied. Counting demoted background cards here
     would report a topic as barely started because of cards the queue never deals. */
  const cs=PACK.cards.map(c=>({...c,key:ckey(c)})).filter(c=>c.topic===tid&&inPool(c));
  const rec=cs.filter(isRecall), acc=autoAcc(cs);
  const seen=rec.filter(c=>srsGet(c.key).seen>0).length;
  if(!seen&&!acc) return null;
  const parts=[];
  if(seen) parts.push(rec.filter(c=>srsGet(c.key).box>=2).length/rec.length);   // same null-is-not-zero rule as critMastery
  if(acc) parts.push(acc.pct/100);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):null;
}
function chipRow(cb){
  const anyData=PACK.topics.some(t=>topicReady(t.id)!=null);
  const html=`<div class="chips"><button class="chip ${S.topic==='all'?'on':''}" data-t="all">✨ All topics</button>${
    PACK.topics.map(t=>{ const r=topicReady(t.id);
      return `<button class="chip ${S.topic===t.id?'on':''}" data-t="${t.id}">${t.icon} ${esc(t.name)}${r!=null?`<span class="pc">${r}%</span>`:''}</button>`;
    }).join('')}</div>${anyData?'':`<div class="doornote">No attempts yet — readiness percentages appear here once you have actually drilled something.</div>`}`;
  setTimeout(()=>$$('.chip').forEach(c=>c.onclick=()=>{S.topic=c.dataset.t;save();cb();}),0);
  return html;
}
/* The door note has to describe the deck the reader is actually about to be dealt.
   When the pack blocks by body system, "the most useful lead" is no longer true of
   the whole deck — they lead INSIDE each system — and a note that keeps saying it
   globally is telling a small lie about the one thing the reader is trusting. */
function deckNote(P){
  /* Built as a list, not a chain of ternaries, because either half can be zero: a
     cold reader has no wrong answers and a reader who has mastered every past-quiz
     card has no hot ones. Joining with "then" only when both are present keeps
     "the most useful come first: then the 12 you have been getting wrong" — which
     the ternary version produced — off the screen. */
  const parts=[];
  if(P.hot)  parts.push(`the <b>${P.hot}</b> that have either been asked on a past quiz or cover parts of the course no practice test touches`);
  if(P.weak) parts.push(`the <b>${P.weak}</b> you have been getting wrong`);
  const useful=parts.join(', then ');
  /* "Nothing is held back" is true of the DECK and, when a background pool is sitting
     out, false of the pack. Printed unqualified it contradicted the row directly
     beneath it, which exists to say that 346 cards are held back. So the claim narrows
     to the set it is actually about and `bgRow` keeps ownership of the rest. */
  const held=hasBG()&&!S.bg;
  const all=held?' in that set':'';
  const named=(P.blocks||[]).map(x=>`<b>${esc(x.name)}</b>`);
  if(named.length>1){
    return `<div class="doornote">All <b>${P.total}</b> cards are in the rotation, worked through in course order — ${
      named.join(', then ')}.${useful?` Inside each block the most useful come first: ${useful}.`:''} Nothing${all} is held back.</div>`;
  }
  return `<div class="doornote">All <b>${P.total}</b> cards are in the rotation — the order just puts the most useful first.${
    useful?` It leads with ${useful}.`:''} Nothing${all} is held back.</div>`;
}
/* The background-reading switch. Renders under BOTH doors, states both counts either
   way, and never hides what it is doing — the whole point is that a reader can see
   there is more and reach it in one tap. */
function bgRow(types){
  if(!hasBG()) return '';
  const all=cardsOf(types,'all');
  const bg=all.filter(c=>c.bg).length, core=all.length-bg;
  if(!bg) return '';
  return S.bg
    ? `<div class="bgrow"><span>Showing all <b>${all.length}</b> cards, including the <b>${bg}</b> filed as background reading.</span>
         <button class="btn ghost" id="bgTog">− Just the ${core} the course has asked about</button></div>`
    : `<div class="bgrow"><span>Showing the <b>${core}</b> cards the course has set questions on, or that cover ground no practice test touches. The other <b>${bg}</b> are <b>background reading</b> — standard physiology written to make those make sense. They are still in the Brief and in Search.</span>
         <button class="btn ghost" id="bgTog">+ Add the ${bg} background cards</button></div>`;
}
/* Delegated, not wired per render, for the same reason #scopeClr is: every other
   post-render binding in this file attaches on a setTimeout and is documented as racy,
   and a lost binding HERE leaves the reader inside the reduced pool with no way to
   reach the other cards — which is a lock, and the two-doors rule forbids one.
   Delegation cannot come unbound. */
document.addEventListener('click',e=>{
  if(!e.target.closest('#bgTog')) return;
  S.bg=!S.bg; save(); nav(VIEW);
});
/* `readyNote` lets a view describe its own "Get me ready" behaviour. The Brief
   orders the focus points rather than drawing a card queue, so the card-count note
   would be meaningless there. */
function gate(cb,types,readyNote){
  const P=(S.door==='ready'&&readyNote===undefined)?deckStats(types):null;
  const html=`<div class="doors">
      <button class="door ${S.door==='ready'?'on':''}" data-d="ready">🎯 Get me ready</button>
      <button class="door ${S.door==='pick'?'on':''}" data-d="pick">🗂 I'll pick</button>
      <button class="iconbtn" id="doorWhy" title="What the difference is">?</button>
    </div>
    <div id="doorHelp"></div>
    ${S.door!=='ready'?'':readyNote!==undefined?readyNote:P?deckNote(P):''}`;
  setTimeout(()=>{
    // Pre-existing race: this fires a tick after render, and switching tabs quickly
    // replaces the view before it runs, so the elements are gone. Guard rather than throw.
    if(!$('#doorWhy')) return;
    $$('.door').forEach(b=>b.onclick=()=>{ S.door=b.dataset.d; save(); cb(); });
    $('#doorWhy').onclick=()=>{
      const h=$('#doorHelp');
      h.innerHTML = h.innerHTML ? '' : `<div class="doorhelp">
        <p><b>Both doors hold exactly the same cards.</b> The only difference is who
        decides what you see next.</p>
        ${hasBG()?`<p>Both are also showing the same set — the <b>background reading</b>
        switch below sits outside this choice and applies to either door.</p>`:''}
        <p><b>🎯 Get me ready</b> decides for you. You still get through every card${
          systemBlocks()?`, working through the course in its own order — one system
        finished before the next one starts. Inside each block it leads`:` —
        it just leads`} with the ones that have come up on a past quiz, and the parts of
        the course no practice test covers. Then the ones you keep getting wrong.</p>
        <p><b>🗂 I'll pick</b> hands you the topics and gets out of the way.</p>
        <p>Either way you will not meet the same card twice until you have been through
        the whole set — except the ones you get wrong, which come back a few cards later
        on purpose.</p>
        ${PACK.doorNote?`<p>${PACK.doorNote}</p>`:''}
        ${PACK.sources?`<p style="border-top:1px solid var(--line);padding-top:9px;margin-top:9px"><b>Where this content comes from.</b> ${PACK.sources}</p>`:''}</div>`;
    };
  },0);   // chip wiring is chipRow's own job
  /* Only on a card-queue view. The Brief passes a `readyNote` and shows every focus
     point and every fact under both doors by design — offering to "add" there would
     imply something was missing from it, which is the opposite of true. */
  return html+(S.door==='pick'?chipRow(cb):'')+(readyNote===undefined?bgRow(types):'');
}

/* ============================== Brief ==============================
   The exposition layer. Every other view asks a question; this is the only
   one that explains anything, and without it Learn is asking a reader to
   retrieve facts they were never given a chance to encode.

   It is DERIVED, not authored. The teaching material is already in the pack:
   flash answers written in teaching order underneath named criteria. This
   view simply renders them as prose instead of as questions.            */
const HASBRIEF=()=>!!(PACK.criteria&&PACK.criteria.length);
S.read=S.read||{};                 // critId -> timestamp. Additive: no migration needed.
/* cardKey -> {g,t}: marking points you ticked, out of the total. The SRS box alone
   cannot carry this — it records how WELL you recalled something, not how many marks
   you took — and the mark projection needs the written half in marks, like the paper.
   Additive, so an existing save picks it up empty and fills as you go. */
S.saq=S.saq||{};

/* Cards never change at runtime, so the key/criterion joins are computed once.
   Without this the Brief recomputes ckey() ~67k times per render on a 587-card
   pack, which is visible on a phone. */
let _ALL=null;
const allCards=()=>_ALL||(_ALL=PACK.cards.map((c,i)=>({...c,key:ckey(c),idx:i})));
const _ccache={}, _tcache={};
function critCards(id){
  if(!_ccache[id]) _ccache[id]=allCards().filter(c=>c.crit===id||(c.alsoCrit||[]).includes(id));
  return _ccache[id];
}
/* A criterion's home topic is whichever topic most of its cards sit in. Criteria
   routinely straddle topics (19 of hs2-test1's 38 do), so this is a filter hint
   only — the Brief always renders in blueprint order and never regroups. */
function critTopic(id){
  if(_tcache[id]===undefined){
    const n={}; critCards(id).forEach(c=>n[c.topic]=(n[c.topic]||0)+1);
    const top=Object.entries(n).sort((a,b)=>b[1]-a[1])[0];
    _tcache[id]=top?top[0]:null;
  }
  return _tcache[id];
}
/* Prose comes from flash answers, in pack order. A criterion with no flash card
   at all — hs2-test1's case studies are 14 SAQs and nothing else — falls back to
   its SAQ marking points, which are the model answer and read fine as prose. */
function critProse(id){
  const cs=critCards(id), fl=cs.filter(c=>c.type==='flash');
  return fl.length?fl:cs.filter(c=>c.type==='saq');
}
/* Null means "no data", and that is a different thing from zero.
   The recall half only counts once there IS recall history. Without that guard any
   focus point holding a flash card reports 0% the moment the tool opens, so one
   nobody has touched is indistinguishable from one attempted and failed — the Brief's
   "not drilled yet" never appeared, and the readiness readout called untouched
   material "your weakest so far". */
/* Measured over the cards the reader is actually DEALT, not every card filed under the
   focus point. Nine of hs2-test1's focus points are more than 70% background reading —
   resp-10 is 13 of 14 — so counting the demoted cards would peg them near zero forever
   and park them permanently at the top of "where the next half hour goes", pointing the
   reader at work the queue was never going to give them. */
function critMastery(id){
  const cs=critCards(id).filter(inPool); if(!cs.length) return null;
  const rec=cs.filter(isRecall), a=autoAcc(cs), parts=[];
  if(rec.some(c=>srsGet(c.key).seen>0)) parts.push(rec.filter(c=>srsGet(c.key).box>=2).length/rec.length);
  if(a) parts.push(a.pct/100);
  return parts.length?parts.reduce((x,y)=>x+y,0)/parts.length:null;
}
/* Get me ready SORTS the blueprint; it never hides part of it. That is deliberate:
   the card queue's priority tiers are a hard filter, and on this pack that starves
   three topics to zero. Ranking here changes the order and nothing else. */
function critRank(cr){
  const read=!!S.read[cr.id], m=critMastery(cr.id);
  if(cr.blind&&!read) return 0;
  if(!read&&(m==null||m<0.6)) return 1;
  if(!read) return 2;
  return 3;
}
function factHTML(c){
  const body=c.type==='flash'
    ? `<div class="facta">${c.a}</div>`
    : `<ul class="factpts">${(c.points||[]).map(p=>`<li>${p}</li>`).join('')}</ul>`;
  return `<div class="fact"><div class="factq">${c.q}${provHTML(c)}</div>${body}${figHTML(c)}<div class="provslot"></div></div>`;
}

function renderBrief(){
  const all=PACK.criteria||[];
  const pos={}; all.forEach((c,i)=>pos[c.id]=i);
  const G=gate(renderBrief,RECALL,`<div class="doornote">Everything is here under either door — <b>Get me ready</b> only changes the <b>order</b>, putting the parts no practice test covers, and the parts you are weakest on, first. Nothing is hidden.</div>`);

  let list=all.slice();
  if(S.door==='ready') list.sort((a,b)=>critRank(a)-critRank(b)||pos[a.id]-pos[b.id]);
  else if(S.topic!=='all') list=list.filter(c=>critTopic(c.id)===S.topic);

  const nRead=all.filter(c=>S.read[c.id]).length;
  const tiers={};
  list.forEach(cr=>critProse(cr.id).forEach(c=>{ if(c.tier) tiers[c.tier]=(tiers[c.tier]||0)+1; }));
  const nProse=Object.values(tiers).reduce((a,b)=>a+b,0);

  view.innerHTML=G+`
    <div class="brfbar"><b id="brfProg">${nRead} of ${all.length} read</b>
      <span class="bar"><i id="brfProgBar" style="width:${all.length?nRead/all.length*100:0}%"></i></span></div>
    <div class="legend">
      <b>Read this before you drill.</b> One section per focus point, in the order the course
      publishes them. Read a section, mark it read, then hit <b>▸ Drill this</b> to be
      questioned on just that one.
      ${nProse?`<br/><br/>Each fact says where it came from. <b>📄 From a past quiz</b> is the one
      to watch for — that fact has already been asked${tiers.verbatim?` (${tiers.verbatim} of the ${nProse} below)`:''}.
      ${tiers.textbook?`Most of the rest is <b>background reading</b>: standard physiology put here so the
      examinable facts have something to sit on, cross-checked against the module hub. It is unlikely
      to come back at you word for word — it is what makes the examinable parts make sense. Tap any
      badge to see the source.`:'Tap any badge to see the source.'}`:''}
    </div>
    ${list.length?list.map(cr=>{
      const prose=critProse(cr.id), cs=critCards(cr.id), read=!!S.read[cr.id];
      const tp=critTopic(cr.id), m=critMastery(cr.id);
      return `<div class="brf${read?' read':''}" id="brf-${cr.id}" data-crit="${cr.id}">
        <div class="brfhead"><span class="cn">${pos[cr.id]+1}/${all.length}</span>
          <h3>${esc(cr.name||cr.id)}</h3>${cr.blind?`<span class="blindtag">never practised</span>`:''}</div>
        <div class="brfsub">${tp?esc(topicName(tp))+' · ':''}${cs.length} card${cs.length===1?'':'s'} · ${
          m!=null?`${Math.round(m*100)}% mastered`:'not drilled yet'}</div>
        ${prose.length?prose.map(factHTML).join('')
          :`<div class="hinttxt">No written summary for this one yet — go straight to drilling it.</div>`}
        <div class="brfact">
          <button class="btn ghost" data-read="${cr.id}">${read?'✓ Read':'Mark as read'}</button>
          <button class="btn primary" data-drill="${cr.id}">▸ Drill this</button>
        </div></div>`;
    }).join('')
    :`<div class="empty">No focus points in this topic.</div>`}`;

  /* Ticking "read" repaints in place — re-rendering 38 sections would throw away
     the reader's scroll position, which on a long page is the whole experience. */
  $$('[data-read]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.read, on=!S.read[id];
    if(on) S.read[id]=Date.now(); else delete S.read[id];
    save();
    b.textContent=on?'✓ Read':'Mark as read';
    const blk=view.querySelector(`.brf[data-crit="${id}"]`); if(blk) blk.classList.toggle('read',on);
    const n=all.filter(c=>S.read[c.id]).length;
    const pr=$('#brfProg'), pb=$('#brfProgBar');
    if(pr) pr.textContent=`${n} of ${all.length} read`;
    if(pb) pb.style.width=(all.length?n/all.length*100:0)+'%';
  });
  $$('[data-drill]').forEach(b=>b.onclick=()=>{ S.crit=b.dataset.drill; save(); nav('study'); window.scrollTo({top:0}); });
}

/* ---- criterion scope, set by the Brief's ▸ Drill this ----
   Always announced with a one-tap clear. A filter the reader cannot see is a
   lock, and the house rule is that we never lock. */
function scopeBanner(){
  if(!S.crit) return '';
  const cr=(PACK.criteria||[]).find(c=>c.id===S.crit);
  return `<div class="scopebar">Focused on <b>${esc(cr?(cr.name||cr.id):S.crit)}</b><button id="scopeClr">Clear ✕</button></div>`;
}
/* Delegated rather than wired per render. The other post-render wiring in this file
   binds on a setTimeout and is documented as racy; here that race would leave the
   reader inside a scope with no way out — a lock, which the two-doors rule forbids.
   Delegation cannot come unbound. */
document.addEventListener('click',e=>{
  if(!e.target.closest('#scopeClr')) return;
  S.crit=null; save(); nav(VIEW);
});
/* "→ Read the full explanation" — the return leg of ▸ Drill this. Delegated for the
   same reason: this is the one route out of a wrong answer and into the prose, and a
   racy per-render binding would silently drop it.

   The topic filter is cleared FIRST when it would hide the section being asked for.
   Landing in a Brief that does not contain the thing the reader just clicked is worse
   than the extra reset, and the topic chips sit right there showing what changed, so
   it is visible rather than silent. The focus scope is left alone — they are likely
   to go back to drilling it. */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-brief]'); if(!b) return;
  const id=b.dataset.brief;
  if(S.door==='pick'&&S.topic!=='all'&&critTopic(id)!==S.topic){ S.topic='all'; save(); }
  nav('brief');
  const el=document.getElementById('brf-'+id);
  if(el){ el.scrollIntoView({block:'start',behavior:'smooth'}); el.classList.add('lit'); setTimeout(()=>el.classList.remove('lit'),1800); }
  else window.scrollTo({top:0});
});
const critScope=cs=>S.crit?cs.filter(c=>c.crit===S.crit||(c.alsoCrit||[]).includes(S.crit)):cs;

/* ============================== Study ==============================
   ONE queue holding every card the pack has, dealt from one deck.

   This replaces Learn, Drill and Written. Those three split the pack by how a card
   is MARKED — you grade yourself, the machine grades you, or you grade against
   marking points — which is a fact about the code, not about studying. What the
   reader got for it:

     · no screen could state an honest card count. Drill holds only the
       machine-marked types, so on hs2-test1 it announced "all 300 cards" of a
       586-card pack while the Sources view said 586. Both were true. Neither
       was reconcilable from the screen.
     · every written question was in TWO tabs, because Learn's card set is
       flash + saq and Written's is saq. 44 cards, listed twice, silently.
     · three separate decks meant three separate passes through three separate
       slices, and no single place that could say "you have been through it".

   One deck fixes all three. A card still renders in its own form — a flashcard
   flips, a written answer reveals its marking points, a machine-marked card gets
   answered and marked — but that is now an INTERACTION the card chooses, not a
   destination the reader has to choose first.                                  */
function renderStudy(){
  const G=gate(renderStudy,ALLTYPES)+scopeBanner();
  CUR=nextCard(ALLTYPES);
  if(!CUR){ view.innerHTML=G+`<div class="empty">No cards in this topic yet.</div>`; return; }
  const c=CUR, tot=cardMarks(c);
  /* A flashcard's "1 mark" is an artefact of cardMarks defaulting, not something the
     paper awards. Showing it would put a number on the one card type that has none. */
  const head=`
      <div class="cmeta"><span class="tag acc">${topicName(c.topic)}</span>${
        c.type==='flash'?'':`<span class="tag">${tot} mark${tot>1?'s':''}</span>`}${
        provHTML(c)}<span class="tag right">${TYPELABEL[c.type]}</span></div>
      <div class="q">${c.q}</div><div class="provslot"></div>
      ${figHTML(c)}`;
  if(c.type==='flash')    studyFlash(G,head,c);
  else if(c.type==='saq') studyWritten(G,head,c);
  else                    studyAuto(G,head,c,tot);
}

/* Self-graded recall, shared by flashcards and (after scoring) written answers. */
const RATEROW=`<div class="rate">
      <button class="r1" data-r="0">✗ Again</button>
      <button class="r2" data-r="1">Hard</button>
      <button class="r3" data-r="2">Good</button>
      <button class="r4" data-r="3">Easy</button>
    </div>`;
function wireRate(c){
  $$('.rate button').forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    srsRate(c.key,r);
    if(r<=1) requeue(ALLTYPES,c,r===0?4:10);   // Again comes back sooner than Hard
    renderStudy();
  });
}

/* ---- flashcard: recall it, flip it, grade yourself ---- */
function studyFlash(G,head,c){
  view.innerHTML=G+`<div class="card">${head}
      <div id="ansZone"><div class="btnrow"><button class="btn primary" id="flip">Show answer ↵</button></div></div>
    </div>`;
  const flip=()=>{
    $('#ansZone').innerHTML=`<div class="answer"><div class="lab">Answer</div><div class="txt">${c.a}</div>${srcHTML(c)}</div>`+RATEROW;
    wireRate(c);
  };
  $('#flip').onclick=flip;
  document.onkeydown=e=>{ if(VIEW==='study'&&e.key==='Enter'&&$('#flip')) flip(); };
}

/* ---- written answer: say it, reveal the marking points, tick honestly ---- */
function studyWritten(G,head,c){
  view.innerHTML=G+`<div class="card">${head}
      <!-- The one place "SAQ" is glossed. A student does meet the abbreviation in the
           course, so hiding it entirely would be its own confusion — but they should
           meet it here, next to the plain words, rather than as a tab name. -->
      <div class="hinttxt">A <b>written</b> question — what the course calls an <b>SAQ</b>. Say or write your full answer first, then reveal the marking points and mark yourself honestly.</div>
      <div id="ansZone"><div class="btnrow"><button class="btn primary" id="flip">Reveal marking points ↵</button></div></div>
    </div>`;
  const reveal=()=>{
    $('#ansZone').innerHTML=`
      <div class="answer"><div class="lab">Tick every point you got</div>
      <ul class="points" id="pts">${c.points.map((p,i)=>`<li data-i="${i}"><span class="n">${i+1}</span><span>${p}</span></li>`).join('')}</ul>
      ${c.model?`<div class="why">💡 ${c.model}</div>`:''}${srcHTML(c)}
      <div class="btnrow"><button class="btn primary" id="done">Score it</button></div></div>`;
    $$('#pts li').forEach(li=>li.onclick=()=>li.classList.toggle('got'));
    $('#done').onclick=()=>{
      const got=$$('#pts li.got').length, tot=c.points.length;
      const pct=got/tot;
      const sm=S.saq[c.key]||{g:0,t:0}; sm.g+=got; sm.t+=tot; S.saq[c.key]=sm;
      srsRate(c.key, pct>=1?3 : pct>=0.8?2 : pct>=0.5?1 : 0);   // srsRate saves
      if(pct<0.8) requeue(ALLTYPES,c,pct>=0.5?10:4);
      $('#done').outerHTML=`<div class="why" style="flex:1">Scored <b>${got}/${tot}</b> — ${pct>=0.8?'strong ✅':pct>=0.5?'getting there — this one comes back soon':'this one goes back to the front of the queue 🔁'}</div><button class="btn primary" id="next">Next ↵</button>`;
      $('#next').onclick=renderStudy;
      document.onkeydown=e=>{ if(VIEW==='study'&&e.key==='Enter'&&$('#next')) renderStudy(); };
    };
  };
  $('#flip').onclick=reveal;
  document.onkeydown=e=>{ if(VIEW==='study'&&e.key==='Enter'&&$('#flip')) reveal(); };
}

/* ---- machine-marked: mcq / order / cloze / tfset / match ---- */
function studyAuto(G,head,c,tot){
  const r=makeRunner(c);
  view.innerHTML=G+`<div class="card">${head}
      <div id="body">${runnerHTML(r)}</div>
      <div id="fb">${c.type==='mcq'?'':`<div class="btnrow"><button class="btn primary" id="submit" disabled>Check answer ↵</button></div>`}</div>
    </div>`;
  const refresh=()=>{
    if(c.type==='order'){ $('#body').innerHTML=runnerHTML(r); wireRunner($('#body'),r,refresh); }
    const sb=$('#submit'); if(sb) sb.disabled=!runnerDone(r);
    if(c.type==='mcq'&&runnerDone(r)) grade();
  };
  const grade=()=>{
    r.rev=true;
    const {got}=markAuto(c,r.resp), ok=got===tot;
    $('#body').innerHTML=runnerHTML(r);
    const m=S.mcq[c.key]||{a:0,c:0}; m.a++; if(ok)m.c++;
    m.g=(m.g||0)+got; m.t=(m.t||0)+tot; S.mcq[c.key]=m; save();
    if(!ok) requeue(ALLTYPES,c,got?10:4);      // partly right waits longer than fully wrong
    $('#fb').innerHTML=feedbackHTML(c,r.resp,`${ok?'✅':got?'➖':'❌'} <b>${got} / ${tot} mark${tot>1?'s':''}.</b> `)+srcHTML(c)+
      `<div class="btnrow"><button class="btn primary" id="next">Next ↵</button></div>`;
    $('#next').onclick=renderStudy;
    document.onkeydown=e=>{ if(VIEW==='study'&&e.key==='Enter'&&$('#next')) renderStudy(); };
  };
  wireRunner($('#body'),r,refresh);
  if($('#submit')) $('#submit').onclick=grade;
  document.onkeydown=e=>{ if(VIEW==='study'&&e.key==='Enter'&&$('#submit')&&!$('#submit').disabled) grade(); };
}

/* ---- Mock test ---- */
const examEligible=c=>c.lean!=='exam';          // cards flagged as final-exam-only sit out
const blindCrits=()=>new Set((PACK.criteria||[]).filter(c=>c.blind).map(c=>c.id));
function drawPool(cards){                        // never-practised focus points get 2× weight until nailed
  const bc=blindCrits(), out=[];
  cards.forEach(c=>{ out.push(c);
    const m=S.mcq[c.key], mastered=m&&m.t&&m.g/m.t>=1;
    if(bc.has(c.crit)&&!mastered) out.push(c);
  });
  return out;
}
function takeUnique(pool,n){ const seen=new Set(),out=[];
  for(const c of shuffle(pool)){ if(seen.has(c.key))continue; seen.add(c.key); out.push(c); if(out.length>=n)break; }
  return out; }
/* The mock test sits the pool you are STUDYING, not the whole pack. Drawing questions
   from cards the queue never deals would test a reader on material the tool had
   decided not to show them — the one thing a practice paper must not do. Turn the
   background reading on and the mock test widens with it. */
function drawAuto(n,mix){
  const elig=cardsOf(AUTO,'all').filter(examEligible).filter(inPool);
  let out=[];
  if(mix) for(const t in mix){
    const sub=elig.filter(c=>c.type===t);
    out=out.concat(takeUnique(drawPool(sub),Math.min(Math.round(n*mix[t]),sub.length)));
  }
  if(out.length<n){ const have=new Set(out.map(c=>c.key));
    // When a pack DECLARES a mix, the top-up must stay inside it. Filling from every
    // eligible type let card types the pack had deliberately left out of the mix back
    // into the exam — hs2-test1 excludes `order` because no ordering question exists on
    // the real paper, and the fallback would have quietly reintroduced it.
    const pool=mix?elig.filter(c=>mix[c.type]!=null):elig;
    out=out.concat(takeUnique(drawPool(pool.filter(c=>!have.has(c.key))),n-out.length)); }

}
function renderExamSetup(){
  const cfg=Object.assign({auto:10,saq:2,minutes:0,pass:80},PACK.exam||{});
  if(PACK.exam&&PACK.exam.mcq!=null&&PACK.exam.auto==null) cfg.auto=PACK.exam.mcq;   // legacy packs

    <div class="card setup">

      ${PASSTARGET()?`<p style="font-size:12.5px;color:var(--tx3);margin:-8px 0 14px">${passCaveat()}</p>`:''}

      ${last?`<p style="margin:12px 0 0;text-align:center">Last attempt: <b>${last.score}%</b> ${last.pass?'✅':'❌'}</p>`:''}

  if(nA+nS===0) return;
  $('#start').onclick=()=>{

function renderExamQ(){

function nextExam(){ EX.i++; EX.i>=EX.qs.length?examMark():renderExamQ(); }
function examMark(){
  clearInterval(EX.timer);
  EX.marks=EX.qs.map((q,i)=> q.type==='saq'
    ? {got:0, tot:cardMarks(q), ticks:q.points.map(()=>false)}
    : Object.assign(markAuto(q,EX.resp[i]),{ticks:[]}) );
  // auto-marked results feed the per-card accuracy record — but only for
  // questions actually reached, so a timer expiry doesn't fake a pile of misses
  EX.qs.forEach((q,i)=>{ if(q.type==='saq'||EX.resp[i]===undefined) return;
    const m=S.mcq[q.key]||{a:0,c:0}; m.a++; if(EX.marks[i].got===EX.marks[i].tot) m.c++;
    m.g=(m.g||0)+EX.marks[i].got; m.t=(m.t||0)+EX.marks[i].tot; S.mcq[q.key]=m; });
  save();
  EX.qs.some(q=>q.type==='saq') ? renderExamReview() : examResults();
}

  view.innerHTML=`<div class="card setup"><h3>Self-mark your written answers</h3>

function examResults(){
  const got=EX.marks.reduce((a,m)=>a+m.got,0), tot=EX.marks.reduce((a,m)=>a+m.tot,0);
  const score=Math.round(got/tot*100), pass=score>=(EX.cfg.pass||80);
  /* Written answers self-marked in the mock test count toward the mark projection
     exactly as the ones in the Written view do — the projection would otherwise say
     "no written answers at all" to someone who has just sat a full paper. Guarded on
     ticks so a run abandoned before the self-mark screen records nothing. */
  EX.qs.forEach((q,i)=>{ const m=EX.marks[i];
    if(q.type!=='saq'||!m||!m.ticks||!m.ticks.length) return;
    const sm=S.saq[q.key]||{g:0,t:0}; sm.g+=m.got; sm.t+=m.tot; S.saq[q.key]=sm; });
  S.exams.unshift({d:new Date().toISOString().slice(0,10),score,pass}); S.exams=S.exams.slice(0,12); save();
  view.innerHTML=`
    <div class="result-hero ${pass?'pass':'fail'}"><div class="big">${score}%</div>

        pass?(PASSTARGET()?'<b>TARGET MET</b> 🎉':'<b>PASSED</b> 🎉'):'keep drilling — the review below is where the marks are.'}</div></div>
    ${EX.qs.map((q,i)=>{

      const head=`<div class="rhead" data-i="${i}"><span class="ic">${ic}</span><span class="qq">${q.q}</span><span style="font-weight:800">${m.got}/${m.tot}</span></div>`;
      if(q.type==='saq') return `<div class="rev">${head}
        <div class="rbody hidden" id="rb${i}"><ul class="points">${q.points.map((p,k)=>`<li class="${m.ticks[k]?'got':''}"><span class="n">${k+1}</span><span>${p}</span></li>`).join('')}</ul></div></div>`;
      const r=makeRunner(q,EX.resp[i]); r.rev=true;
      return `<div class="rev">${head}
        <div class="rbody hidden" id="rb${i}">${figHTML(q)}${runnerHTML(r)}${feedbackHTML(q,EX.resp[i])}</div></div>`;
    }).join('')}
    <div class="btnrow"><button class="btn primary" id="again">Run it again</button><button class="btn ghost" id="toStats">Progress</button></div>`;
  $$('.rhead[data-i]').forEach(h=>h.onclick=()=>{const b=$('#rb'+h.dataset.i); if(b)b.classList.toggle('hidden');});
  $('#again').onclick=renderExamSetup;

/* ---- Search ---- */
function renderSearch(){
  view.innerHTML=`<div class="search"><input id="sq" placeholder="Search every card and glossary term…" autocomplete="off"/></div><div id="sres"></div>`;
  const box=$('#sres'), inp=$('#sq'); inp.focus();
  const run=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ box.innerHTML=`<div class="empty">Type at least 2 characters.</div>`; return; }
    const hits=[];
    PACK.cards.forEach(c=>{
      const bits=[c.q,c.a,c.text,c.why,c.model]
        .concat(c.points||[],c.options||[],c.steps||[],
                (c.statements||[]).map(s=>s.s),
                [].concat(...(c.pairs||[])),
                [].concat(...(c.blanks||[]).map(b=>b.options)));
      if(!bits.filter(Boolean).map(strip).join(' ').toLowerCase().includes(q)) return;
      let a;
      switch(c.type){
        case 'flash': a=c.a; break;
        case 'mcq':   a=`Answer: <b>${c.options[c.correct]}</b>${c.why?' — '+c.why:''}`; break;
        case 'order': a=c.steps.map((s,i)=>`${i+1}. ${strip(s)}`).join('<br/>'); break;
        case 'cloze': a=c.blanks.map((b,i)=>`${i+1}. <b>${strip(b.options[b.correct])}</b>`).join(' · '); break;
        case 'tfset': a=c.statements.map(s=>`<b>${s.v?'T':'F'}</b> — ${strip(s.s)}`).join('<br/>'); break;
        case 'match': a=c.pairs.map(p=>`${strip(p[0])} → <b>${strip(p[1])}</b>`).join('<br/>'); break;
        default:      a=(c.points||[]).map((p,i)=>`${i+1}. ${p}`).join('<br/>');
      }
      hits.push({t:`${topicName(c.topic)} · ${(TYPELABEL[c.type]||c.type).toUpperCase()}`, q:c.q, a});
    });
    (PACK.glossary||[]).forEach(g=>{ if((g.term+' '+g.def).toLowerCase().includes(q)) hits.push({t:'📖 Glossary', q:`<b>${esc(g.term)}</b>`, a:esc(g.def)}); });
    box.innerHTML = hits.length ? hits.slice(0,40).map(h=>`<div class="sres"><div class="st">${h.t}</div><div>${h.q}</div><div class="sa">${h.a}</div></div>`).join('')
      : `<div class="empty">No matches for "${esc(q)}".</div>`;
  };
  inp.oninput=run; run();
}

/* ---- Stats ---- */
/* marks-based accuracy across the auto-marked cards in a list; null = untried */
function autoAcc(cards){
  let g=0,t=0,a=0;
  cards.filter(isAuto).forEach(c=>{ const m=S.mcq[c.key]; if(!m) return;
    a+=m.a; g+=(m.g!=null?m.g:m.c); t+=(m.t!=null?m.t:m.a); });   // legacy records fall back to c/a
  return t?{pct:Math.round(g/t*100),tries:a}:null;
}
/* ---- readiness, in the only unit that matters ---------------------------------
   What this replaces, and why it is not a rename. Progress used to report "cards in
   box 3+", "drill accuracy 62%" and "last exam 71%". A Leitner box is an internal
   detail of the scheduler, and none of the three answers the question the reader
   actually has, which is: *am I going to pass, and where do the next forty minutes
   go?* Relabelling "box 3+" as "Mastered" would have produced a nicer-sounding number
   that still answered the wrong question.

   So it is a mark projection, built only from questions actually attempted — nothing
   is assumed about material never touched — with the two halves weighted by their
   real share of the paper, taken from the pack's own declared composition. Per the
   self-explaining-UI rule it says what it is standing on, and below a usable sample
   it refuses to show a number at all rather than dress a guess up as a prediction. */
function paperWeights(){
  const cfg=Object.assign({auto:10,saq:2,pass:80},PACK.exam||{});
  if(cfg.mcq!=null&&cfg.auto==null) cfg.auto=cfg.mcq;         // legacy packs
  const mean=t=>{ const cs=PACK.cards.filter(c=>c.type===t);
    return cs.length?cs.reduce((a,c)=>a+cardMarks(c),0)/cs.length:0; };
  let autoM=0;
  if(cfg.mix){ for(const t in cfg.mix) autoM+=cfg.auto*cfg.mix[t]*mean(t); }
  else{ const ms=AUTO.map(mean).filter(Boolean); autoM=cfg.auto*(ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:1); }
  const saqM=cfg.saq*mean('saq'), tot=autoM+saqM;
  return {auto:tot?autoM/tot:1, saq:tot?saqM/tot:0, pass:cfg.pass};
}
function predict(cards){
  const w=paperWeights();
  let ag=0,at=0,sg=0,st=0,na=0,ns=0;
  cards.forEach(c=>{
    if(isAuto(c)){ const m=S.mcq[c.key]; if(m&&(m.t||m.a)){ ag+=(m.g!=null?m.g:m.c); at+=(m.t!=null?m.t:m.a); na++; } }
    else if(c.type==='saq'){ const m=S.saq[c.key]; if(m&&m.t){ sg+=m.g; st+=m.t; ns++; } }
  });
  const parts=[];
  if(at) parts.push([w.auto, ag/at]);
  if(st) parts.push([w.saq,  sg/st]);
  const wsum=parts.reduce((a,p)=>a+p[0],0);
  if(!wsum) return {n:0, pass:w.pass};
  return {pct:Math.round(100*parts.reduce((a,p)=>a+p[0]*p[1],0)/wsum),
          pass:w.pass, n:na+ns, nAuto:na, nSaq:ns,
          /* how much of the paper this projection actually stands on: the marks-share
             of the halves that have any data behind them at all */
          cover:Math.round(100*wsum)};
}
/* Where the next block of time goes. Never-touched focus points sort first — an
   unknown is worth more than a known weakness — and the row says which it is. */
function weakest(k){
  return (PACK.criteria||[]).map(cr=>({cr,n:critCards(cr.id).length,m:critMastery(cr.id)}))
    .filter(x=>x.n).sort((a,b)=>(a.m==null?-1:a.m)-(b.m==null?-1:b.m)).slice(0,k);
}
function renderStats(){
  /* Against the pool being studied, for the same reason topicReady is: counting the
     demoted background cards would report "6 of 286 recalled" at a reader who has
     been through most of what the tool actually deals them. The stat row says which
     pool it is counting. */
  const all=allCards().filter(inPool);
  const recall=all.filter(isRecall);
  const solid=recall.filter(c=>srsGet(c.key).box>=2).length;
  const p=predict(all);
  /* Two thresholds, both deliberately conservative. Under 20 attempts there is no
     number — a confident 58% built on nine questions is worse than saying nothing.
     Under 60, or with only one half of the paper attempted, it shows but says plainly
     that it is a guess. */
  const solidEnough = p.n>=60 && p.nAuto && p.nSaq;
  const showable    = p.n>=20;
  const hero = !showable
    ? `<div class="result-hero"><div class="big" style="font-size:26px">Not enough yet</div>
        <div class="sub">Answer <b>${20-p.n}</b> more question${20-p.n===1?'':'s'} in Study and a projected mark appears here. Guessing from ${p.n||'no'} answer${p.n===1?'':'s'} would just be making something up.</div></div>`
    : `<div class="result-hero ${p.pct>=p.pass?'pass':'fail'}"><div class="big">${p.pct}%</div>
        <div class="sub">${solidEnough?'Projected mark':'Rough guess at your mark'} · ${passPhrase()} —
          ${p.pct>=p.pass?'<b>you are over the line</b> on what you have done so far':'<b>below the line</b> on what you have done so far'}</div></div>
       ${PASSTARGET()?`<div class="doornote" style="border-left-color:var(--line2)">${passCaveat()}</div>`:''}
       <div class="doornote">${solidEnough
          ? `Worked out from the <b>${p.n}</b> questions you have answered, weighted the way the real paper weights its marks. It assumes the rest of the material goes like the part you have done — so it moves as you cover more ground.`
          : `⚠️ <b>This is a guess, not a prediction.</b> It is standing on <b>${p.n}</b> answered question${p.n===1?'':'s'}${p.nSaq?'':' and no written answers at all'}, which is nowhere near enough to be trusted. Keep going and it becomes real.`}</div>`;

  const weak=weakest(3);
  view.innerHTML=hero+`
    <div class="statgrid">
      <div class="stat"><div class="n">${solid}<span style="font-size:15px;color:var(--tx3)">/${recall.length}</span></div><div class="l">recalled right, twice over</div></div>
      <div class="stat"><div class="n">${p.nAuto?p.nAuto:'—'}</div><div class="l">${p.nAuto?'questions drilled':'nothing drilled yet'}</div></div>
      <div class="stat"><div class="n">${S.exams.length?S.exams[0].score+'%':'—'}</div><div class="l">${S.exams.length?'last mock test':'no mock test yet'}</div></div>
    </div>
    ${weak.length?`<h2 class="sec">Where the next half hour goes</h2>
      ${weak.map(x=>`<div class="catstat"><div class="top"><b>${esc(x.cr.name||x.cr.id)}</b><span class="m">${
          x.m==null?'not started':Math.round(x.m*100)+'%'}</span></div>
        <div class="bar"><i style="width:${x.m==null?0:Math.round(x.m*100)}%"></i></div>
        <div class="sub">${x.m==null?'You have not answered anything on this one yet.':'Your weakest so far.'}
          <button class="wlink" style="margin-top:6px" data-brief="${x.cr.id}">→ Read it in the Brief</button></div></div>`).join('')}`:''}
    ${hasBG()&&!S.bg?`<div class="doornote" style="border-left-color:var(--line2)">Counting the <b>${all.length}</b> cards you are studying. The background reading is not in these numbers — add it in <b>Study</b> and they recount.</div>`:''}
    <h2 class="sec">Topics</h2>
    ${PACK.topics.map(t=>{
      const cs=all.filter(c=>c.topic===t.id);
      const recTot=cs.filter(isRecall).length;
      const rec=cs.filter(c=>isRecall(c)&&srsGet(c.key).box>=2).length;
      const a=autoAcc(cs);
      const pct=recTot?Math.round(rec/recTot*100):0;
      return `<div class="catstat"><div class="top">${t.icon} ${esc(t.name)}<span class="m">${cs.length} cards</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="sub">${recTot?`${rec} of ${recTot} recalled right twice over`:'nothing to recall here'}${a?` · ${a.pct}% of drill marks (${a.tries} tries)`:' · not drilled yet'}</div></div>`;
    }).join('')}
    ${S.exams.length?`<h2 class="sec">Mock tests</h2>${S.exams.map(e=>`<div class="histrow"><span>${e.d}</span><span class="sc">${e.score}%</span><span class="pf ${e.pass?'p':'f'}">${
      PASSTARGET()?(e.pass?'ON TARGET':'UNDER'):(e.pass?'PASS':'FAIL')}</span></div>`).join('')}`:''}
    <div class="btnrow" style="margin-top:22px"><button class="btn ghost danger" id="reset">Reset all progress</button></div>`;
  $('#reset').onclick=()=>{ if(confirm('Wipe all progress for this pack?')){ localStorage.removeItem(KEY); S=load(); save(); renderStats(); } };
}

if((PACK.cards||[]).some(c=>c.tier)) $('#navAudit').hidden=false;
if(HASBRIEF()) $('#navBrief').hidden=false;
/* A reader with no history lands in the Brief. Learn would open by asking them to
   retrieve a fact they have not encoded yet, which is the slowest way to start and
   the most discouraging. Once there is any progress, Learn is the right landing. */
const coldStart=!Object.keys(S.srs).length&&!Object.keys(S.mcq).length;
renderOnboard();
nav(HASBRIEF()&&coldStart?'brief':'study');
</script>
<script>
/* ===== STUDY BUS v2 (hub ⚡ engine — see estate STUDY-ENGINE-SPEC.md) =====
   Copy-in block. Active only when the pack declares PACK.studybus; every
   tool made from this template inherits it for free. Bids the pack's due
   flash/saq CARDS onto the bus (the hub plays them in its own player),
   consumes the hub's grade write-back into this pack's SRS, and honours
   ?mode= / ?topic= deep links. */
(function(){
'use strict';
const here=location.origin+location.pathname;

if(PACK.studybus&&PACK.id){
  const APP='cram-'+PACK.id;

  // grades the hub player recorded for this pack since we last ran —
  // apply to our own SRS at the time the recall actually happened
  (function applyBusGrades(){
    const gk='studybus.grades.'+APP;
    let log=null; try{ log=JSON.parse(localStorage.getItem(gk)); }catch(e){}
    try{ localStorage.removeItem(gk); }catch(e){}
    if(!Array.isArray(log)||!log.length) return;
    const known=new Set(PACK.cards.map(c=>ckey(c)));
    log.forEach(function(ev){
      if(!ev||!known.has(ev.card)) return;      // card edited/removed since — drop
      const st=srsGet(ev.card), r=+ev.r||0;
      st.box = r===0?0 : r===1?st.box : Math.min(4, st.box+(r===3?2:1));
      st.due=(+ev.ts||Date.now())+IVL[st.box];
      st.seen++;
      S.srs[ev.card]=st;
    });
    save();
  })();

  const busCards=function(){
    // due first (most overdue leading), whole recall deck as fallback —
    // never let "nothing due" mean "nothing to cram".
    // Only RECALL types go on the bus: the hub's player understands flash/saq.
    const all=cardsOf(RECALL,'all').filter(inPool);
    const now=Date.now();
    const due=all.filter(c=>srsGet(c.key).due<=now);
    return (due.length?due:all).slice()
      .sort((a,b)=>srsGet(a.key).due-srsGet(b.key).due)
      .slice(0,20)
      .map(c=>c.type==='flash'
        ? {id:c.key,type:'flash',q:c.q,a:c.a}
        : {id:c.key,type:'saq',q:c.q,points:c.points,marks:c.marks||c.points.length,model:c.model||''});
  };
  const offers=function(){
    // evPerMin scales with how much of the deck is due — raw memory value
    // only; the hub multiplies in exam weight, urgency and hurdle boosts.
    // `inPool` so the hub's readiness bar counts the same cards the tool deals.
    const all=cardsOf(RECALL,'all').filter(inPool);
    const due=all.filter(c=>srsGet(c.key).due<=Date.now()).length;
    const frac=all.length?due/all.length:1;
    return [{ label:'🧠 '+(PACK.title||'Cram pack'),
      topic:PACK.studybus.topic||null, assess:PACK.studybus.assess||[],
      evPerMin:+(0.15+0.45*frac).toFixed(2),
      kind:'cards', cards:busCards(),
      counts:{due:due,total:all.length} }];
  };
  const pulse=function(){ try{ localStorage.setItem('studybus.pulse.'+APP,
    JSON.stringify({v:2,app:APP,name:PACK.title,url:here,ts:Date.now(),offers:offers()})); }catch(e){} };
  pulse();
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') pulse(); });
  addEventListener('pagehide',pulse);
}

/* deep links: land in the right view/topic */
const q=new URLSearchParams(location.search);
const tp=q.get('topic'), md=q.get('mode');
if(tp&&PACK.topics.some(t=>t.id===tp)){ S.topic=tp; save(); }
/* learn/mcq/saq are kept here on purpose: nav() aliases them onto Study, so a hub
   link or bookmark written before the merge still lands somewhere real. */
if(md&&['brief','study','learn','mcq','saq','exam','search','stats','audit'].includes(md)) nav(md);
else if(tp) nav(VIEW);   // re-render so the topic chip change shows
})();
</script>
</body>
