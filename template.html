<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0e1420"/>
<title>Cram Engine — Example Pack</title>
<style>
:root{
  --bg:#0e1420; --bg2:#141c2b; --card:#182133; --card2:#1e2941;
  --line:#27324a; --line2:#33405c;
  --tx:#e8eef7; --tx2:#9fb0c8; --tx3:#6d7f9c;
  --acc:#4f9dff; --acc2:#2f6fd0;
  --good:#39d98a; --hard:#ffce54; --miss:#ff6b6b;
  --gGood:#123a2a; --gHard:#3a3413; --gMiss:#3a1a1a;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:16px; --maxw:760px;
}
html[data-theme="light"]{
  --bg:#eef2f8; --bg2:#e3e9f3; --card:#ffffff; --card2:#f4f7fc;
  --line:#dbe3ef; --line2:#c7d3e6;
  --tx:#16202f; --tx2:#4a5a72; --tx3:#7d8ca5;
  --acc:#1f6fe0; --acc2:#1657b8;
  --good:#128a55; --hard:#a9791a; --miss:#c53b3b;
  --gGood:#dcf7ea; --gHard:#faf0d2; --gMiss:#fbe0e0;
  --shadow:0 8px 30px rgba(30,50,90,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--tx);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:14px 16px 120px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.hidden{display:none !important}
b{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2);transition:.15s}
.iconbtn:hover{border-color:var(--line2);color:var(--tx)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:8px;font-size:12.5px;color:var(--tx2);font-weight:600;white-space:nowrap;transition:.12s}
.seg button.on{background:var(--acc);color:#fff}
.seg button:not(.on):hover{color:var(--tx);background:var(--card2)}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx2);transition:.12s}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 20px;position:relative;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.tag.acc{background:rgba(79,157,255,.14);color:var(--acc);border-color:rgba(79,157,255,.3)}
.tag.right{margin-left:auto;color:var(--tx3);border-color:var(--line)}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:2px 0 4px}
.marks{font-size:12.5px;color:var(--tx3);margin:4px 0 0}
.answer{margin-top:16px;border-top:1px dashed var(--line2);padding-top:16px;animation:pop .22s ease}
.answer .lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:8px}
.answer .txt{font-size:16px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;line-height:1.45;transition:.15s;width:100%}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.opt.right{background:var(--gGood);border-color:rgba(57,217,138,.5)}
.opt.right .k{background:var(--good);color:#04120b;border-color:var(--good)}
.opt.wrong{background:var(--gMiss);border-color:rgba(255,107,107,.5)}
.opt.wrong .k{background:var(--miss);color:#fff;border-color:var(--miss)}
.opt.picked{outline:2px solid var(--acc)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;color:var(--tx2);line-height:1.5}
.why b{color:var(--acc)}
/* ---- interactive card types: order / cloze / tfset / match ---- */
.seq{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.slot{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.4;min-height:44px;text-align:left;width:100%;color:inherit;transition:.15s}
.slot .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.slot .s{flex:1;min-width:0}
.slot.full{border-style:solid}
.slot.full:hover{border-color:var(--acc)}
.slot.right{background:var(--gGood);border-color:rgba(57,217,138,.5);border-style:solid}
.slot.right .n{background:var(--good);color:#04120b;border-color:var(--good)}
.slot.wrong{background:var(--gMiss);border-color:rgba(255,107,107,.5);border-style:solid}
.slot.wrong .n{background:var(--miss);color:#fff;border-color:var(--miss)}
.slot .ph{color:var(--tx3);font-style:italic;font-size:13.5px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.bank button{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13.5px;line-height:1.35;text-align:left;max-width:100%;transition:.12s}
.bank button:hover:not(:disabled){border-color:var(--acc)}
.bank button:disabled{opacity:.3;cursor:default}
.clozebody{margin-top:14px;font-size:15.5px;line-height:2.1}
.blanksel{background:var(--card2);border:1px solid var(--acc);border-radius:7px;color:var(--tx);font:inherit;font-size:14px;padding:4px 6px;margin:2px 1px;max-width:100%}
.blanksel:disabled{opacity:1}
.blanksel.right{border-color:var(--good);background:var(--gGood)}
.blanksel.wrong{border-color:var(--miss);background:var(--gMiss)}
.tfrow{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.45}
.tfrow .s{flex:1;min-width:0}
.tfbtns{display:flex;gap:5px;flex:0 0 auto}
.tfbtns button{width:38px;padding:8px 0;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-weight:800;font-size:12.5px;color:var(--tx2);transition:.12s}
.tfbtns button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tfrow.right{background:var(--gGood);border-color:rgba(57,217,138,.45)}
.tfrow.wrong{background:var(--gMiss);border-color:rgba(255,107,107,.45)}
.tfrow .av{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--tx3)}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.mrow .l{flex:1 1 150px;min-width:0;line-height:1.4}
.mrow select{flex:1 1 170px;min-width:0}
.mrow.right{background:var(--gGood);border-color:rgba(57,217,138,.45)}
.mrow.wrong{background:var(--gMiss);border-color:rgba(255,107,107,.45)}
.mfix{flex:1 1 100%;font-size:12.5px;color:var(--tx2);padding-top:2px}
.figwrap{margin:15px 0 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fdfdfd}
.figwrap img,.figwrap svg{display:block;width:100%;height:auto}
.figcap{font-size:12px;color:var(--tx3);padding:7px 11px;background:var(--card2);border-top:1px solid var(--line);line-height:1.45}
.srcline{margin-top:10px;font-size:11.5px;color:var(--tx3);line-height:1.5}
.points{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.45;cursor:pointer;transition:.15s}
.points li .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2);margin-top:1px}
.points li.got{background:var(--gGood);border-color:rgba(57,217,138,.4)}
.points li.got .n{background:var(--good);color:#04120b;border-color:var(--good)}
.hinttxt{font-size:12.5px;color:var(--tx3);margin-top:10px;font-style:italic}
.btnrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:800;letter-spacing:.3px;transition:.12s;flex:1}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--acc)}
.rate{display:flex;gap:8px;margin-top:16px}
.rate button{flex:1;padding:12px 6px;border-radius:11px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:var(--card2);transition:.12s}
.rate .r1:hover{background:var(--gMiss);border-color:var(--miss);color:var(--miss)}
.rate .r2:hover{background:var(--gHard);border-color:var(--hard);color:var(--hard)}
.rate .r3:hover{background:var(--gGood);border-color:var(--good);color:var(--good)}
.rate .r4:hover{background:rgba(79,157,255,.15);border-color:var(--acc);color:var(--acc)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.topbar .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700}
.tprog{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.timer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--miss)}
.setup h3{margin:0 0 4px;font-size:18px}
.setup p{margin:0 0 14px;color:var(--tx2);font-size:13.5px}
.bigstart{width:100%;margin-top:8px;padding:15px;border-radius:12px;color:#fff;font-size:16px;font-weight:900;letter-spacing:.5px;background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(79,157,255,.35)}
.bigstart:hover{filter:brightness(1.1)}
.result-hero{border-radius:var(--r);padding:26px 20px;text-align:center;margin-bottom:14px;border:1px solid var(--line);animation:pop .3s ease}
.result-hero.pass{background:linear-gradient(160deg,rgba(57,217,138,.16),rgba(57,217,138,.04));border-color:rgba(57,217,138,.45)}
.result-hero.fail{background:linear-gradient(160deg,rgba(255,107,107,.16),rgba(255,107,107,.04));border-color:rgba(255,107,107,.45)}
.result-hero .big{font-size:40px;font-weight:900;letter-spacing:-1px}
.result-hero.pass .big{color:var(--good)}
.result-hero.fail .big{color:var(--miss)}
.result-hero .sub{font-size:14px;color:var(--tx2);margin-top:4px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.rev .rhead{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.45}
.rev .rhead .ic{flex:0 0 auto;margin-top:1px}
.rev .rhead .qq{flex:1;color:var(--tx2)}
.rev .rbody{padding:0 14px 13px}
.search input{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:13px 15px;color:var(--tx);font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:9px;font-size:14px;line-height:1.5}
.sres .st{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);margin-bottom:3px}
.sres .sa{color:var(--tx2);margin-top:5px;font-size:13.5px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.catstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.catstat .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px}
.catstat .top .m{margin-left:auto;font-size:12px;font-weight:800;color:var(--tx3)}
.catstat .bar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden}
.catstat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.catstat .sub{font-size:12px;color:var(--tx3);margin-top:5px}
.histrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:7px;color:var(--tx2)}
.histrow .sc{font-weight:800;font-size:14px;color:var(--tx)}
.histrow .pf{margin-left:auto;font-weight:800;font-size:11.5px}
.histrow .pf.p{color:var(--good)} .histrow .pf.f{color:var(--miss)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin:20px 0 9px}
.danger{color:var(--miss);border-color:rgba(255,107,107,.4) !important}
.packwarn{background:var(--gHard);border:1px solid rgba(255,206,84,.5);border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:12px;color:var(--tx)}
/* ---- two doors ---- */
.doors{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.door{flex:1;padding:12px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:800;color:var(--tx2);line-height:1.3;transition:.14s}
.door:hover{border-color:var(--line2);color:var(--tx)}
.door.on{background:var(--acc);border-color:var(--acc);color:#fff}
.doors .iconbtn{flex:0 0 auto;width:42px;height:auto;font-weight:800}
.doornote{font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.doorhelp{font-size:13px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:12px;line-height:1.6}
.doorhelp b{color:var(--tx)}
.doorhelp p{margin:0 0 8px}
.doorhelp p:last-child{margin-bottom:0}
.chip .pc{font-size:11px;font-weight:800;opacity:.75;margin-left:5px}
.empty{color:var(--tx3);text-align:center;padding:40px 10px;font-size:14px}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="iconbtn" href="https://jeremyspm.github.io/" title="Back to the hub" style="width:auto;padding:0 13px;gap:5px;font-size:13px;font-weight:700;text-decoration:none">← Hub</a>
    <div class="brand"><b id="hTitle">Cram Engine</b><span id="hSub">content pack</span></div>
    <button class="iconbtn" id="btnTts" title="Read aloud">🔊</button>
    <button class="iconbtn" id="btnTheme" title="Theme">◐</button>
  </header>
  <div id="packwarn"></div>
  <div class="controls">
    <div class="seg" id="nav">
      <button data-v="learn" class="on">Learn</button>
      <button data-v="mcq">Drill</button>
      <button data-v="saq">Marked drill</button>
      <button data-v="exam">Exam sim</button>
      <button data-v="search">Search</button>
      <button data-v="stats">Stats</button>
    </div>
  </div>
  <div id="view"></div>
  <div class="foot">Works offline, no account needed · sign in via the hub to sync your progress across devices</div>
</div>

<!-- Optional cloud sync: dormant unless signed in at jeremyspm.github.io. Fully offline-first without it.
     Copied into every tool made from this template, so new cram tools sync for free. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://jeremyspm.github.io/cloud/config.js"></script>
<script src="https://jeremyspm.github.io/cloud/cloud.js"></script>
<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  CONTENT PACK — replace everything between START and END to      ║
   ║  make a new cram tool. Schema: see README.md / PACK-SCHEMA.md    ║
   ╚══════════════════════════════════════════════════════════════════╝ */
/* ===== CONTENT PACK START ===== */
const PACK = {
  id: 'example-vitals',              // UNIQUE per tool — namespaces saved progress
  title: 'Vital Signs — Example Pack',
  subtitle: 'Cram Engine demo',
  // exam-sim composition. `auto` draws from every machine-marked type; `mix`
  // is optional and sets the share of each type (remainder filled at random).
  exam: { auto: 6, saq: 1, minutes: 10, pass: 80,
          mix:{ mcq:.40, cloze:.20, match:.15, tfset:.15, order:.10 } },
  // OPTIONAL — enrols this tool in the hub's ⚡ Study engine. Point at ids
  // from the hub's deadlines.js and the hub can schedule this pack into
  // one-press sessions. Omit entirely to stay off the study bus.
  // studybus: { topic:'hs2-m1', assess:['hs2-t1','hs2-final'] },
  topics: [
    { id:'obs',  name:'Observations', icon:'🩺' },
    { id:'resp', name:'Respiratory',  icon:'🫁' },
  ],
  cards: [
    // ---- flashcards (type:'flash') ----
    { type:'flash', topic:'obs', q:'Normal adult resting heart rate range?', a:'<b>60–100 beats per minute.</b> Below 60 = bradycardia, above 100 = tachycardia.' },
    { type:'flash', topic:'obs', q:'Normal adult oral temperature range?', a:'Approximately <b>36.5–37.5 °C</b>. Above ~38.0 °C is generally considered febrile.' },
    { type:'flash', topic:'resp', q:'Normal adult respiratory rate at rest?', a:'<b>12–20 breaths per minute.</b> RR is the most sensitive early indicator of deterioration.' },
    { type:'flash', topic:'resp', q:'Normal SpO₂ range for a healthy adult?', a:'<b>95–100%</b> on room air (target may be 88–92% in some COPD patients per local policy).' },
    // ---- MCQs (type:'mcq', correct = index into options) ----
    { type:'mcq', topic:'obs', q:'An adult has a resting heart rate of 48 bpm. This is best described as:',
      options:['Tachycardia','Bradycardia','Normal sinus rate','Asystole'], correct:1,
      why:'Below 60 bpm at rest = <b>bradycardia</b>. Tachycardia is above 100 bpm.' },
    { type:'mcq', topic:'obs', q:'Which vital sign change is often the EARLIEST indicator of clinical deterioration?',
      options:['Blood pressure fall','Temperature spike','Respiratory rate rise','Pupil dilation'], correct:2,
      why:'<b>Respiratory rate</b> rises early in deterioration; BP often falls late (compensated shock).' },
    { type:'mcq', topic:'obs', q:'A blood pressure of 88/54 mmHg in an adult is best described as:',
      options:['Hypertensive','Normotensive','Hypotensive','A normal paediatric value only'], correct:2,
      why:'Systolic under ~90 mmHg is generally <b>hypotensive</b> in adults — assess the patient, not just the number.' },
    { type:'mcq', topic:'resp', q:'Which SpO₂ reading on room air most warrants escalation in a previously well adult?',
      options:['98%','96%','95%','89%'], correct:3,
      why:'<b>89%</b> is below the normal 95–100% range and needs prompt assessment and escalation.' },

'use strict';
/* ============================ engine ============================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* stable per-card progress key: hash of type+question text — reordering cards
   is safe; editing a question's wording resets just that card's progress */
function ckey(c){ let h=5381; const s=c.type+'|'+strip(c.q); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'k'+(h>>>0).toString(36); }

/* ---- card taxonomy ----
   AUTO   = machine-marked; live in the Drill view and the exam sim
   RECALL = you grade yourself; live in Learn on the Leitner SRS          */
const AUTO=['mcq','order','cloze','tfset','match'];
const RECALL=['flash','saq'];
const ALLTYPES=AUTO.concat(RECALL);
const isAuto=c=>AUTO.includes(c.type), isRecall=c=>RECALL.includes(c.type);
const TYPELABEL={mcq:'multichoice',order:'put in order',cloze:'fill the blanks',tfset:'true / false',match:'matching',saq:'short answer',flash:'flashcard'};

/* marks per card — mirrors how the real Canvas paper scores each type:
   ordering and cloze pay per correct position/blank, matching per pair,
   but a true/false SET is one single mark for getting the whole set right. */
function cardMarks(c){
  if(c.marks) return c.marks;
  switch(c.type){
    case 'order': return (c.steps||[]).length;
    case 'cloze': return (c.blanks||[]).length;
    case 'match': return (c.pairs||[]).length;
    case 'tfset': return c.partial?(c.statements||[]).length:1;
    case 'saq':   return (c.points||[]).length;
    default:      return 1;
  }
}

/* ---- pack validation (surface content-authoring mistakes loudly) ---- */
function validatePack(p){
  const errs=[];
  if(!p.id) errs.push('PACK.id missing');
  if(!p.topics||!p.topics.length) errs.push('PACK.topics empty');
  const tids=new Set((p.topics||[]).map(t=>t.id));
  const cids=new Set((p.criteria||[]).map(c=>c.id));
  (p.cards||[]).forEach((c,i)=>{
    const at=`card ${i} (${c.type||'?'})`;
    if(!tids.has(c.topic)) errs.push(`${at}: unknown topic "${c.topic}"`);
    if(!c.q) errs.push(`${at}: no question`);
    if(c.crit&&cids.size&&!cids.has(c.crit)) errs.push(`${at}: unknown criterion "${c.crit}"`);
    if(!ALLTYPES.includes(c.type)){ errs.push(`${at}: unknown type "${c.type}"`); return; }
    if(c.type==='mcq'&&(!c.options||c.options.length<2||c.options.length>6||c.correct==null||c.options[c.correct]==null)) errs.push(`${at}: mcq needs 2–6 options and a valid correct index`);
    if(c.type==='flash'&&!c.a) errs.push(`${at}: flash has no answer`);
    if(c.type==='saq'&&(!c.points||!c.points.length)) errs.push(`${at}: saq has no marking points`);
    if(c.type==='order'){
      if(!c.steps||c.steps.length<3) errs.push(`${at}: order needs at least 3 steps, in the CORRECT sequence`);
    }
    if(c.type==='cloze'){
      if(!c.text) errs.push(`${at}: cloze needs a .text containing [[1]] … [[n]]`);
      if(!c.blanks||!c.blanks.length) errs.push(`${at}: cloze has no blanks`);
      (c.blanks||[]).forEach((b,k)=>{
        if(!b.options||b.options.length<2) errs.push(`${at}: blank ${k+1} needs 2+ options`);
        if(b.correct==null||b.options&&b.options[b.correct]==null) errs.push(`${at}: blank ${k+1} has no valid correct index`);
        const tok='[['+(k+1)+']]';
        if(c.text&&c.text.split(tok).length!==2) errs.push(`${at}: .text must contain ${tok} exactly once`);
      });
    }
    if(c.type==='tfset'){
      if(!c.statements||c.statements.length<2) errs.push(`${at}: tfset needs 2+ statements`);
      (c.statements||[]).forEach((s,k)=>{ if(!s.s) errs.push(`${at}: statement ${k+1} has no text`);
        if(typeof s.v!=='boolean') errs.push(`${at}: statement ${k+1} needs v:true or v:false`); });
    }
    if(c.type==='match'){
      if(!c.pairs||c.pairs.length<2) errs.push(`${at}: match needs 2+ pairs`);
      (c.pairs||[]).forEach((pr,k)=>{ if(!Array.isArray(pr)||pr.length!==2||!pr[0]||!pr[1]) errs.push(`${at}: pair ${k+1} must be [left, right]`); });
      // two prompts MAY share an answer (the runner de-duplicates the dropdown),
      // but a distractor that equals a real answer would be unanswerable
      const rights=(c.pairs||[]).map(pr=>pr&&pr[1]);
      ((c.distractors)||[]).forEach(d=>{ if(rights.includes(d)) errs.push(`${at}: distractor "${strip(d).slice(0,30)}" duplicates a real answer`); });
    }
  });
  errs.push(...validateCoverage(p));
  return errs;
}

/* ---- criterion coverage: prove the pack covers the published blueprint ----
   Optional. A pack with no PACK.criteria simply skips this.               */
function validateCoverage(p){
  if(!p.criteria||!p.criteria.length) return [];
  const cfg=Object.assign({min:0,blindMin:0,blindNeedsSaq:false},p.coverage||{});
  const errs=[];
  p.criteria.forEach(cr=>{
    const cs=(p.cards||[]).filter(c=>c.crit===cr.id);
    const floor=cr.blind?Math.max(cfg.min,cfg.blindMin):cfg.min;
    if(cs.length<floor) errs.push(`criterion ${cr.id} has ${cs.length} cards, needs ${floor}`);
    if(cr.blind&&cfg.blindNeedsSaq&&!cs.some(c=>c.type==='saq')) errs.push(`criterion ${cr.id} is a blind spot with no SAQ card`);
  });
  return errs;
}

if(packErrs.length) $('#packwarn').innerHTML=`<div class="packwarn">⚠️ <b>Content pack issues (${packErrs.length}):</b> ${packErrs.slice(0,6).map(esc).join(' · ')}${packErrs.length>6?' · …':''}</div>`;

function load(){

function migrate(s){ // v1 keyed progress by card index; v2 keys by question hash
  if(s.v===2) return s;
  const remap=o=>{ const out={}; for(const k in o){
    if(/^\d+$/.test(k)){ const c=PACK.cards[+k]; if(c) out[ckey(c)]=o[k]; }
    else out[k]=o[k]; } return out; };
  s.srs=remap(s.srs||{}); s.mcq=remap(s.mcq||{}); s.v=2; return s;
}

const topicName=id=>{const t=PACK.topics.find(t=>t.id===id);return t?`${t.icon} ${t.name}`:id;};
/* type may be a single type or an array of them (AUTO / RECALL) */
const cardsOf=(type,topic)=>{ const ts=Array.isArray(type)?type:[type];
  return PACK.cards.map((c,i)=>({...c,key:ckey(c),idx:i})).filter(c=>ts.includes(c.type)&&(topic==='all'||c.topic===topic)); };

/* ============ interactive question runners (the AUTO types) ============
   A "runner" holds one attempt at one card: the shuffled presentation
   order, the response so far, and whether it's been revealed. The same
   three functions drive the Drill view, the exam sim and the exam review. */
function makeRunner(c,resp){
  const r={c,rev:false,resp:null};
  switch(c.type){
    case 'mcq':   r.ord=shuffle(c.options.map((_,i)=>i)); r.resp=null; break;
    case 'order': r.ord=shuffle(c.steps.map((_,i)=>i));   r.resp=c.steps.map(()=>null); break;
    case 'cloze': r.ordB=c.blanks.map(b=>shuffle(b.options.map((_,i)=>i))); r.resp=c.blanks.map(()=>null); break;
    case 'tfset': r.resp=c.statements.map(()=>null); break;
    // de-duplicated: two prompts may legitimately share one answer, but the
    // dropdown must still only offer it once
    case 'match': r.opts=shuffle([...new Set(c.pairs.map(p=>p[1]).concat(c.distractors||[]))]); r.resp=c.pairs.map(()=>''); break;
  }
  if(resp!==undefined&&resp!==null) r.resp=resp;
  return r;
}
function runnerDone(r){
  switch(r.c.type){
    case 'mcq':   return r.resp!=null;
    case 'match': return r.resp.every(x=>x!=='');
    default:      return Array.isArray(r.resp)?r.resp.every(x=>x!=null):r.resp!=null;
  }
}
function markAuto(c,resp){
  const tot=cardMarks(c);
  if(resp==null) return {got:0,tot};
  switch(c.type){
    case 'mcq':   return {got:resp===c.correct?1:0,tot};
    case 'order': return {got:c.steps.reduce((a,_,i)=>a+(resp[i]===i?1:0),0),tot};
    case 'cloze': return {got:c.blanks.reduce((a,b,i)=>a+(resp[i]===b.correct?1:0),0),tot};
    case 'match': return {got:c.pairs.reduce((a,p,i)=>a+(resp[i]===p[1]?1:0),0),tot};
    case 'tfset': {
      const per=c.statements.reduce((a,s,i)=>a+(resp[i]===s.v?1:0),0);
      return c.partial?{got:per,tot}:{got:per===c.statements.length?1:0,tot};
    }
  }
  return {got:0,tot};
}
function figHTML(c){ return c.fig?`<div class="figwrap">${c.fig}</div>${c.figcap?`<div class="figcap">${c.figcap}</div>`:''}`:''; }
/* a card may name the course document it came from — shown under the answer so

function srcHTML(c){ return c.src?`<div class="srcline">📄 Source: ${esc(c.src)}</div>`:''; }

function runnerHTML(r){
  const c=r.c, rev=r.rev, resp=r.resp;
  if(c.type==='mcq') return `<div class="opts">${r.ord.map((oi,k)=>{
      let cls='opt';
      if(rev){ if(oi===c.correct) cls+=' right'; else if(oi===resp) cls+=' wrong'; }
      else if(oi===resp) cls+=' picked';
      return `<button class="${cls}" data-o="${oi}"${rev?' disabled':''}><span class="k">${'ABCDEF'[k]||'•'}</span><span>${c.options[oi]}</span></button>`;
    }).join('')}</div>`;

  if(c.type==='order'){
    const used=new Set(resp.filter(x=>x!=null));
    return `<div class="seq">${c.steps.map((_,i)=>{
        const si=resp[i]; let cls='slot'+(si!=null?' full':'');
        if(rev&&si!=null) cls+=(si===i?' right':' wrong');
        return `<button class="${cls}" data-slot="${i}"${rev?' disabled':''}><span class="n">${i+1}</span><span class="s">${si!=null?c.steps[si]:'<i class="ph">tap a step below</i>'}</span></button>`;
      }).join('')}</div>
      ${rev?`<div class="why">Correct order: ${c.steps.map((s,i)=>`<b>${i+1}.</b> ${strip(s)}`).join(' &nbsp;→&nbsp; ')}</div>`
           :`<div class="bank">${r.ord.map(oi=>`<button data-step="${oi}"${used.has(oi)?' disabled':''}>${c.steps[oi]}</button>`).join('')}</div>`}`;
  }

  if(c.type==='cloze'){
    let html=c.text;
    c.blanks.forEach((b,i)=>{
      const sel=resp[i]; let cls='blanksel';
      if(rev) cls+=(sel===b.correct?' right':' wrong');
      const opts=r.ordB[i].map(oi=>`<option value="${oi}"${sel===oi?' selected':''}>${strip(b.options[oi])}</option>`).join('');
      html=html.split('[['+(i+1)+']]').join(
        `<select class="${cls}" data-b="${i}"${rev?' disabled':''}><option value=""${sel==null?' selected':''}>— select —</option>${opts}</select>`);
    });
    const misses=rev?c.blanks.map((b,i)=>resp[i]===b.correct?null:`<b>${i+1}.</b> ${strip(b.options[b.correct])}`).filter(Boolean):[];
    return `<div class="clozebody">${html}</div>${misses.length?`<div class="why">Correct answers you missed: ${misses.join(' &nbsp;·&nbsp; ')}</div>`:''}`;
  }

  if(c.type==='tfset') return c.statements.map((s,i)=>{
      let cls='tfrow';
      if(rev) cls+=(resp[i]===s.v?' right':' wrong');
      return `<div class="${cls}"><span class="s">${s.s}</span>${rev?`<span class="av">${s.v?'TRUE':'FALSE'}</span>`:
        `<span class="tfbtns"><button data-t="${i}" data-v="1" class="${resp[i]===true?'on':''}">T</button><button data-t="${i}" data-v="0" class="${resp[i]===false?'on':''}">F</button></span>`}</div>`;
    }).join('')+(rev&&!c.partial?`<div class="hinttxt">This is a single mark — every statement has to be right.</div>`:'');

  if(c.type==='match') return c.pairs.map((p,i)=>{
      let cls='mrow'; const ok=resp[i]===p[1];
      if(rev) cls+=(ok?' right':' wrong');
      return `<div class="${cls}"><span class="l">${p[0]}</span>
        <select class="blanksel" data-m="${i}"${rev?' disabled':''}><option value=""${resp[i]===''?' selected':''}>— select —</option>${
          r.opts.map(o=>`<option value="${esc(o)}"${resp[i]===o?' selected':''}>${strip(o)}</option>`).join('')}</select>
        ${rev&&!ok?`<div class="mfix">✓ ${strip(p[1])}</div>`:''}</div>`;
    }).join('');
  return '';
}

/* wires a rendered runner; onChange() fires after every interaction */
function wireRunner(root,r,onChange){
  const c=r.c;
  if(c.type==='mcq') root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ r.resp=+b.dataset.o; onChange(); });
  if(c.type==='order'){
    root.querySelectorAll('.bank button').forEach(b=>b.onclick=()=>{
      const slot=r.resp.indexOf(null); if(slot<0) return;
      r.resp[slot]=+b.dataset.step; onChange();
    });
    root.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{
      const i=+s.dataset.slot; if(r.resp[i]==null) return;
      r.resp[i]=null; onChange();                    // tap a filled slot to send it back
    });
  }
  if(c.type==='cloze') root.querySelectorAll('select[data-b]').forEach(s=>s.onchange=()=>{
    r.resp[+s.dataset.b]= s.value===''?null:+s.value; onChange(); });
  if(c.type==='tfset') root.querySelectorAll('.tfbtns button').forEach(b=>b.onclick=()=>{
    r.resp[+b.dataset.t]= b.dataset.v==='1';
    root.querySelectorAll('.tfbtns button').forEach(x=>x.classList.toggle('on', r.resp[+x.dataset.t]===(x.dataset.v==='1')));
    onChange(); });
  if(c.type==='match') root.querySelectorAll('select[data-m]').forEach(s=>s.onchange=()=>{
    r.resp[+s.dataset.m]=s.value; onChange(); });
}

/* ---- SRS (Leitner boxes 0-4) ---- */
const IVL=[0, 10*60e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3]; // per box, ms
function srsGet(i){ return S.srs[i]||{box:0,due:0,seen:0}; }
function srsRate(i,r){ // r: 0 again, 1 hard, 2 good, 3 easy
  const st=srsGet(i);
  st.box = r===0?0 : r===1?st.box : Math.min(4, st.box+(r===3?2:1));
  st.due = Date.now()+IVL[st.box];
  st.seen++;
  S.srs[i]=st; save();
}
function duePool(topic){
  const all=cardsOf(RECALL,topic);
  const now=Date.now();
  const due=all.filter(c=>srsGet(c.key).due<=now);
  return due.length?due:all; // never block cramming: fall back to full pool
}

/* ============================ two doors ============================
   ONE dataset, two ways in. "Get me ready" lets the engine choose the
   queue; "I'll pick" hands the topics back. Neither locks anything, and
   a reduced queue always says so out loud.                            */
function cardWeak(c){
  if(isRecall(c)) return srsGet(c.key).box<=1;
  const m=S.mcq[c.key];
  return (!m||!m.t) ? true : (m.g/m.t)<0.6;      // never drilled counts as weak
}
const TIERMSG=[
  'Starting with the <b>blueprint blind spots</b> — criteria flagged as having no practice coverage.',
  'Starting with what you are <b>shakiest</b> on.',
  'Working through what is <b>due for review</b>.',
  'Nothing is flagged — running the <b>full pool</b>.'
];
function priorityPool(types){
  const cm={}; (PACK.criteria||[]).forEach(c=>cm[c.id]=c);
  const all=cardsOf(types,'all');
  const rank=c=>{
    const cr=cm[c.crit];
    if(cr&&cr.blind&&cardWeak(c)) return 0;
    if(cardWeak(c)) return 1;
    if(isRecall(c)&&srsGet(c.key).due<=Date.now()) return 2;
    return 3;
  };
  const ranked=all.map(c=>({c,r:rank(c)}));
  const tier=ranked.length?Math.min(...ranked.map(x=>x.r)):3;
  return {pool:ranked.filter(x=>x.r===tier).map(x=>x.c), tier, total:all.length};
}
/* per-topic readiness, or null when there is genuinely no data to report */
function topicReady(tid){
  const cs=PACK.cards.map(c=>({...c,key:ckey(c)})).filter(c=>c.topic===tid);
  const rec=cs.filter(isRecall), acc=autoAcc(cs);
  const seen=rec.filter(c=>srsGet(c.key).seen>0).length;
  if(!seen&&!acc) return null;
  const parts=[];
  if(rec.length) parts.push(rec.filter(c=>srsGet(c.key).box>=2).length/rec.length);
  if(acc) parts.push(acc.pct/100);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):null;
}
function chipRow(cb){
  const anyData=PACK.topics.some(t=>topicReady(t.id)!=null);
  const html=`<div class="chips"><button class="chip ${S.topic==='all'?'on':''}" data-t="all">✨ All topics</button>${
    PACK.topics.map(t=>{ const r=topicReady(t.id);
      return `<button class="chip ${S.topic===t.id?'on':''}" data-t="${t.id}">${t.icon} ${esc(t.name)}${r!=null?`<span class="pc">${r}%</span>`:''}</button>`;
    }).join('')}</div>${anyData?'':`<div class="doornote">No attempts yet — readiness percentages appear here once you have actually drilled something.</div>`}`;
  setTimeout(()=>$$('.chip').forEach(c=>c.onclick=()=>{S.topic=c.dataset.t;save();cb();}),0);
  return html;
}
function gate(cb,types){
  const P=S.door==='ready'?priorityPool(types):null;
  const html=`<div class="doors">
      <button class="door ${S.door==='ready'?'on':''}" data-d="ready">🎯 Get me ready</button>
      <button class="door ${S.door==='pick'?'on':''}" data-d="pick">🗂 I'll pick</button>
      <button class="iconbtn" id="doorWhy" title="How this queue is chosen">?</button>
    </div>
    <div id="doorHelp"></div>
    ${P?`<div class="doornote">${TIERMSG[P.tier]} <b>${P.pool.length}</b> of ${P.total} cards are in this queue — switch to <b>I'll pick</b> for the rest.</div>`:''}`;
  setTimeout(()=>{
    $$('.door').forEach(b=>b.onclick=()=>{ S.door=b.dataset.d; save(); cb(); });
    $('#doorWhy').onclick=()=>{
      const h=$('#doorHelp');
      h.innerHTML = h.innerHTML ? '' : `<div class="doorhelp">
        <p><b>🎯 Get me ready</b> picks for you. It works down a fixed order: criteria the
        published blueprint lists but no practice test ever covered, then anything you have
        been getting wrong, then whatever is due for review. It only ever shows you one of
        those layers at a time, and it tells you which one.</p>
        <p><b>🗂 I'll pick</b> gives you the topics and gets out of the way. Same cards —
        nothing is hidden behind the other door.</p>
        ${PACK.doorNote?`<p>${PACK.doorNote}</p>`:''}
        ${PACK.sources?`<p style="border-top:1px solid var(--line);padding-top:9px;margin-top:9px"><b>Where this content comes from.</b> ${PACK.sources}</p>`:''}</div>`;
    };
  },0);   // chip wiring is chipRow's own job
  return html+(S.door==='pick'?chipRow(cb):'');
}

/* ---- Drill: every auto-marked type (mcq / order / cloze / tfset / match) ---- */
function renderDrill(){
  const G=gate(renderDrill,AUTO);
  const pool=S.door==='ready'?priorityPool(AUTO).pool:cardsOf(AUTO,S.topic);
  if(!pool.length){ view.innerHTML=G+`<div class="empty">No drillable questions in this topic yet.</div>`; return; }
  CUR=pool[Math.floor(Math.random()*pool.length)];
  const r=makeRunner(CUR), tot=cardMarks(CUR);
  view.innerHTML=G+`
    <div class="card">
      <div class="cmeta"><span class="tag acc">${topicName(CUR.topic)}</span><span class="tag">${tot} mark${tot>1?'s':''}</span><span class="tag right">${TYPELABEL[CUR.type]}</span></div>
      <div class="q">${CUR.q}</div>
      ${figHTML(CUR)}
      <div id="body">${runnerHTML(r)}</div>
      <div id="fb">${CUR.type==='mcq'?'':`<div class="btnrow"><button class="btn primary" id="submit" disabled>Check answer ↵</button></div>`}</div>
    </div>`;
  speak(CUR.q);
  const refresh=()=>{
    if(CUR.type==='order'){ $('#body').innerHTML=runnerHTML(r); wireRunner($('#body'),r,refresh); }
    const sb=$('#submit'); if(sb) sb.disabled=!runnerDone(r);
    if(CUR.type==='mcq'&&runnerDone(r)) grade();
  };
  const grade=()=>{
    r.rev=true;
    const {got}=markAuto(CUR,r.resp), ok=got===tot;
    $('#body').innerHTML=runnerHTML(r);
    const m=S.mcq[CUR.key]||{a:0,c:0}; m.a++; if(ok)m.c++;
    m.g=(m.g||0)+got; m.t=(m.t||0)+tot; S.mcq[CUR.key]=m; save();
    $('#fb').innerHTML=`<div class="why">${ok?'✅':got?'➖':'❌'} <b>${got} / ${tot} marks.</b> ${CUR.why||''}</div>${srcHTML(CUR)}
      <div class="btnrow"><button class="btn primary" id="next">Next ↵</button></div>`;
    $('#next').onclick=renderDrill;
    document.onkeydown=e=>{ if(VIEW==='mcq'&&e.key==='Enter'&&$('#next')) renderDrill(); };
  };
  wireRunner($('#body'),r,refresh);
  if($('#submit')) $('#submit').onclick=grade;
  document.onkeydown=e=>{ if(VIEW==='mcq'&&e.key==='Enter'&&$('#submit')&&!$('#submit').disabled) grade(); };
}

/* ---- Exam sim ---- */
const examEligible=c=>c.lean!=='exam';          // cards flagged as final-exam-only sit out
const blindCrits=()=>new Set((PACK.criteria||[]).filter(c=>c.blind).map(c=>c.id));
function drawPool(cards){                        // blind-spot criteria get 2× weight until nailed
  const bc=blindCrits(), out=[];
  cards.forEach(c=>{ out.push(c);
    const m=S.mcq[c.key], mastered=m&&m.t&&m.g/m.t>=1;
    if(bc.has(c.crit)&&!mastered) out.push(c);
  });
  return out;
}
function takeUnique(pool,n){ const seen=new Set(),out=[];
  for(const c of shuffle(pool)){ if(seen.has(c.key))continue; seen.add(c.key); out.push(c); if(out.length>=n)break; }
  return out; }
function drawAuto(n,mix){
  const elig=cardsOf(AUTO,'all').filter(examEligible);
  let out=[];
  if(mix) for(const t in mix){
    const sub=elig.filter(c=>c.type===t);
    out=out.concat(takeUnique(drawPool(sub),Math.min(Math.round(n*mix[t]),sub.length)));
  }
  if(out.length<n){ const have=new Set(out.map(c=>c.key));
    out=out.concat(takeUnique(drawPool(elig.filter(c=>!have.has(c.key))),n-out.length)); }
  return out.slice(0,n);
}
function renderExamSetup(){
  const cfg=Object.assign({auto:10,saq:2,minutes:0,pass:80},PACK.exam||{});
  if(PACK.exam&&PACK.exam.mcq!=null&&PACK.exam.auto==null) cfg.auto=PACK.exam.mcq;   // legacy packs
  const autoAll=cardsOf(AUTO,'all').filter(examEligible), saqAll=cardsOf('saq','all').filter(examEligible);
  const nA=Math.min(cfg.auto,autoAll.length), nS=Math.min(cfg.saq,saqAll.length);
  const last=S.exams[0];
  view.innerHTML=`
    <div class="card setup">
      <h3>🎯 Exam simulation</h3>
      <p><b>${nA}</b> auto-marked + <b>${nS}</b> written questions, all topics mixed${cfg.minutes?`, <b>${cfg.minutes} min</b> timer`:''}. No feedback until the end. Pass mark <b>${cfg.pass}%</b>.</p>
      ${cfg.noPaper?`<div class="packwarn">✋ <b>No rough paper.</b> That's the real condition — work the multi-step questions in your head, not on a pad.</div>`:''}
      ${nA+nS>0?`<button class="bigstart" id="start">START EXAM</button>`:`<div class="empty">This pack has no drillable or marked cards yet — the exam sim needs at least one.</div>`}
      ${last?`<p style="margin:12px 0 0;text-align:center">Last attempt: <b>${last.score}%</b> ${last.pass?'✅':'❌'}</p>`:''}
    </div>`;
  if(nA+nS===0) return;
  $('#start').onclick=()=>{
    EX={qs:shuffle(drawAuto(nA,cfg.mix).concat(takeUnique(saqAll,nS))),
        i:0,resp:[],cfg,end:cfg.minutes?Date.now()+cfg.minutes*60e3:null,timer:null};
    renderExamQ();
    if(EX.end){ EX.timer=setInterval(()=>{ const el=$('#extimer'); if(!el){clearInterval(EX.timer);return;}
      const left=EX.end-Date.now(); if(left<=0){ examMark(); return; }
      el.textContent=`${Math.floor(left/60e3)}:${String(Math.floor(left%60e3/1e3)).padStart(2,'0')}`;
      el.classList.toggle('low',left<60e3); },250); }
  };
}
function renderExamQ(){
  const q=EX.qs[EX.i], tot=cardMarks(q);
  const head=`<div class="topbar"><span>Question <b>${EX.i+1}</b> / ${EX.qs.length}</span>${EX.end?`<span class="timer" id="extimer">–:––</span>`:''}</div>
    <div class="tprog"><i style="width:${EX.i/EX.qs.length*100}%"></i></div>`;
  if(q.type==='saq'){
    view.innerHTML=head+`<div class="card">
      <div class="cmeta"><span class="tag acc">${topicName(q.topic)}</span><span class="tag right">${tot} marks</span></div>
      <div class="q">${q.q}</div>${figHTML(q)}
      <div class="hinttxt">Answer in full (out loud, or on paper if your real sitting allows it) — you'll self-mark it in the review.</div>
      <div class="btnrow"><button class="btn primary" id="donesaq">Answered — next</button></div></div>`;
    $('#donesaq').onclick=()=>{ EX.resp[EX.i]=null; nextExam(); };
    return;
  }
  const r=makeRunner(q);
  view.innerHTML=head+`<div class="card">
      <div class="cmeta"><span class="tag acc">${topicName(q.topic)}</span><span class="tag">${tot} mark${tot>1?'s':''}</span><span class="tag right">${TYPELABEL[q.type]}</span></div>
      <div class="q">${q.q}</div>${figHTML(q)}
      <div id="body">${runnerHTML(r)}</div>
      <div class="btnrow"><button class="btn primary" id="exnext">${q.type==='mcq'?'Skip →':'Next →'}</button></div>
    </div>`;
  const refresh=()=>{
    if(q.type==='order'){ $('#body').innerHTML=runnerHTML(r); wireRunner($('#body'),r,refresh); }
    $('#exnext').textContent=runnerDone(r)?'Next →':'Skip →';
    if(q.type==='mcq'&&runnerDone(r)){ EX.resp[EX.i]=r.resp; nextExam(); }
  };
  wireRunner($('#body'),r,refresh);
  $('#exnext').onclick=()=>{ EX.resp[EX.i]=r.resp; nextExam(); };   // partial answers still score their parts
}
function nextExam(){ EX.i++; EX.i>=EX.qs.length?examMark():renderExamQ(); }
function examMark(){
  clearInterval(EX.timer);
  EX.marks=EX.qs.map((q,i)=> q.type==='saq'
    ? {got:0, tot:cardMarks(q), ticks:q.points.map(()=>false)}
    : Object.assign(markAuto(q,EX.resp[i]),{ticks:[]}) );
  // auto-marked results feed the per-card accuracy record — but only for
  // questions actually reached, so a timer expiry doesn't fake a pile of misses
  EX.qs.forEach((q,i)=>{ if(q.type==='saq'||EX.resp[i]===undefined) return;
    const m=S.mcq[q.key]||{a:0,c:0}; m.a++; if(EX.marks[i].got===EX.marks[i].tot) m.c++;
    m.g=(m.g||0)+EX.marks[i].got; m.t=(m.t||0)+EX.marks[i].tot; S.mcq[q.key]=m; });
  save();
  EX.qs.some(q=>q.type==='saq') ? renderExamReview() : examResults();
}
function renderExamReview(){
  view.innerHTML=`<div class="card setup"><h3>Self-mark your written answers</h3>
    <p>For each marked question, tick the points you actually got — honest marking is the whole game.</p></div>`+
    EX.qs.map((q,i)=>{
      if(q.type!=='saq') return '';
      return `<div class="rev"><div class="rhead"><span class="ic">✍️</span><span class="qq">${q.q}</span></div>
        <div class="rbody"><ul class="points" id="ep${i}">${q.points.map((p,k)=>`<li data-q="${i}" data-k="${k}"><span class="n">${k+1}</span><span>${p}</span></li>`).join('')}</ul>
        ${q.model?`<div class="why" style="margin-top:10px">💡 ${q.model}</div>`:''}</div></div>`;
    }).join('')+
    `<div class="btnrow"><button class="btn primary" id="finish">Finish & score</button></div>`;
  $$('.points li').forEach(li=>li.onclick=()=>{
    li.classList.toggle('got');
    const m=EX.marks[+li.dataset.q]; m.ticks[+li.dataset.k]=li.classList.contains('got');
    m.got=m.ticks.filter(Boolean).length;
  });
  $('#finish').onclick=examResults;
  window.scrollTo({top:0});
}
function examResults(){
  const got=EX.marks.reduce((a,m)=>a+m.got,0), tot=EX.marks.reduce((a,m)=>a+m.tot,0);
  const score=Math.round(got/tot*100), pass=score>=(EX.cfg.pass||80);
  S.exams.unshift({d:new Date().toISOString().slice(0,10),score,pass}); S.exams=S.exams.slice(0,12); save();
  view.innerHTML=`
    <div class="result-hero ${pass?'pass':'fail'}"><div class="big">${score}%</div>
      <div class="sub"><b>${got} / ${tot}</b> marks · pass ${EX.cfg.pass||80}% — ${pass?'<b>PASSED</b> 🎉':'keep drilling — the review below is where the marks are.'}</div></div>
    ${EX.qs.map((q,i)=>{
      const m=EX.marks[i], ic=m.got===m.tot?'✅':m.got?'➖':'❌';
      const head=`<div class="rhead" data-i="${i}"><span class="ic">${ic}</span><span class="qq">${q.q}</span><span style="font-weight:800">${m.got}/${m.tot}</span></div>`;
      if(q.type==='saq') return `<div class="rev">${head}
        <div class="rbody hidden" id="rb${i}"><ul class="points">${q.points.map((p,k)=>`<li class="${m.ticks[k]?'got':''}"><span class="n">${k+1}</span><span>${p}</span></li>`).join('')}</ul></div></div>`;
      const r=makeRunner(q,EX.resp[i]); r.rev=true;
      return `<div class="rev">${head}
        <div class="rbody hidden" id="rb${i}">${figHTML(q)}${runnerHTML(r)}${q.why?`<div class="why">${q.why}</div>`:''}</div></div>`;
    }).join('')}
    <div class="btnrow"><button class="btn primary" id="again">Run it again</button><button class="btn ghost" id="toStats">Stats</button></div>`;
  $$('.rhead[data-i]').forEach(h=>h.onclick=()=>{const b=$('#rb'+h.dataset.i); if(b)b.classList.toggle('hidden');});
  $('#again').onclick=renderExamSetup;
  $('#toStats').onclick=()=>nav('stats');
  window.scrollTo({top:0});
}

/* ---- Search ---- */
function renderSearch(){
  view.innerHTML=`<div class="search"><input id="sq" placeholder="Search every card and glossary term…" autocomplete="off"/></div><div id="sres"></div>`;
  const box=$('#sres'), inp=$('#sq'); inp.focus();
  const run=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ box.innerHTML=`<div class="empty">Type at least 2 characters.</div>`; return; }
    const hits=[];
    PACK.cards.forEach(c=>{
      const bits=[c.q,c.a,c.text,c.why,c.model]
        .concat(c.points||[],c.options||[],c.steps||[],
                (c.statements||[]).map(s=>s.s),
                [].concat(...(c.pairs||[])),
                [].concat(...(c.blanks||[]).map(b=>b.options)));
      if(!bits.filter(Boolean).map(strip).join(' ').toLowerCase().includes(q)) return;
      let a;
      switch(c.type){
        case 'flash': a=c.a; break;
        case 'mcq':   a=`Answer: <b>${c.options[c.correct]}</b>${c.why?' — '+c.why:''}`; break;
        case 'order': a=c.steps.map((s,i)=>`${i+1}. ${strip(s)}`).join('<br/>'); break;
        case 'cloze': a=c.blanks.map((b,i)=>`${i+1}. <b>${strip(b.options[b.correct])}</b>`).join(' · '); break;
        case 'tfset': a=c.statements.map(s=>`<b>${s.v?'T':'F'}</b> — ${strip(s.s)}`).join('<br/>'); break;
        case 'match': a=c.pairs.map(p=>`${strip(p[0])} → <b>${strip(p[1])}</b>`).join('<br/>'); break;
        default:      a=(c.points||[]).map((p,i)=>`${i+1}. ${p}`).join('<br/>');
      }
      hits.push({t:`${topicName(c.topic)} · ${(TYPELABEL[c.type]||c.type).toUpperCase()}`, q:c.q, a});
    });
    (PACK.glossary||[]).forEach(g=>{ if((g.term+' '+g.def).toLowerCase().includes(q)) hits.push({t:'📖 Glossary', q:`<b>${esc(g.term)}</b>`, a:esc(g.def)}); });
    box.innerHTML = hits.length ? hits.slice(0,40).map(h=>`<div class="sres"><div class="st">${h.t}</div><div>${h.q}</div><div class="sa">${h.a}</div></div>`).join('')
      : `<div class="empty">No matches for "${esc(q)}".</div>`;
  };
  inp.oninput=run; run();
}

/* ---- Stats ---- */
/* marks-based accuracy across the auto-marked cards in a list; null = untried */
function autoAcc(cards){
  let g=0,t=0,a=0;
  cards.filter(isAuto).forEach(c=>{ const m=S.mcq[c.key]; if(!m) return;
    a+=m.a; g+=(m.g!=null?m.g:m.c); t+=(m.t!=null?m.t:m.a); });   // legacy records fall back to c/a
  return t?{pct:Math.round(g/t*100),tries:a}:null;
}
function renderStats(){
  const recall=PACK.cards.map(c=>({...c,key:ckey(c)})).filter(isRecall);
  const learned=recall.filter(c=>srsGet(c.key).box>=2).length;
  const acc=autoAcc(PACK.cards.map(c=>({...c,key:ckey(c)})));
  view.innerHTML=`
    <div class="statgrid">
      <div class="stat"><div class="n">${learned}/${recall.length}</div><div class="l">cards in box 3+</div></div>
      <div class="stat"><div class="n">${acc?acc.pct+'%':'—'}</div><div class="l">${acc?'drill accuracy':'no attempts yet'}</div></div>
      <div class="stat"><div class="n">${S.exams.length?S.exams[0].score+'%':'—'}</div><div class="l">${S.exams.length?'last exam':'no exam sat yet'}</div></div>
    </div>
    <h2 class="sec">Topics</h2>
    ${PACK.topics.map(t=>{
      const cs=PACK.cards.map(c=>({...c,key:ckey(c)})).filter(c=>c.topic===t.id);
      const recTot=cs.filter(isRecall).length;
      const rec=cs.filter(c=>isRecall(c)&&srsGet(c.key).box>=2).length;
      const a=autoAcc(cs);
      const pct=recTot?Math.round(rec/recTot*100):0;
      return `<div class="catstat"><div class="top">${t.icon} ${esc(t.name)}<span class="m">${cs.length} cards</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="sub">${recTot?`${rec}/${recTot} recall cards in box 3+`:'no recall cards'}${a?` · drill ${a.pct}% (${a.tries} tries)`:' · not drilled yet'}</div></div>`;
    }).join('')}
    ${S.exams.length?`<h2 class="sec">Exam history</h2>${S.exams.map(e=>`<div class="histrow"><span>${e.d}</span><span class="sc">${e.score}%</span><span class="pf ${e.pass?'p':'f'}">${e.pass?'PASS':'FAIL'}</span></div>`).join('')}`:''}
    <div class="btnrow" style="margin-top:22px"><button class="btn ghost danger" id="reset">Reset all progress</button></div>`;
  $('#reset').onclick=()=>{ if(confirm('Wipe all progress for this pack?')){ localStorage.removeItem(KEY); S=load(); save(); renderStats(); } };
}

nav('learn');
</script>
<script>
/* ===== STUDY BUS v2 (hub ⚡ engine — see estate STUDY-ENGINE-SPEC.md) =====
   Copy-in block. Active only when the pack declares PACK.studybus; every
   tool made from this template inherits it for free. Bids the pack's due
   flash/saq CARDS onto the bus (the hub plays them in its own player),
   consumes the hub's grade write-back into this pack's SRS, and honours
   ?mode= / ?topic= deep links. */
(function(){
'use strict';
const here=location.origin+location.pathname;

if(PACK.studybus&&PACK.id){
  const APP='cram-'+PACK.id;

  // grades the hub player recorded for this pack since we last ran —
  // apply to our own SRS at the time the recall actually happened
  (function applyBusGrades(){
    const gk='studybus.grades.'+APP;
    let log=null; try{ log=JSON.parse(localStorage.getItem(gk)); }catch(e){}
    try{ localStorage.removeItem(gk); }catch(e){}
    if(!Array.isArray(log)||!log.length) return;
    const known=new Set(PACK.cards.map(c=>ckey(c)));
    log.forEach(function(ev){
      if(!ev||!known.has(ev.card)) return;      // card edited/removed since — drop
      const st=srsGet(ev.card), r=+ev.r||0;
      st.box = r===0?0 : r===1?st.box : Math.min(4, st.box+(r===3?2:1));
      st.due=(+ev.ts||Date.now())+IVL[st.box];
      st.seen++;
      S.srs[ev.card]=st;
    });
    save();
  })();

  const busCards=function(){
    // due first (most overdue leading), whole recall deck as fallback —
    // never let "nothing due" mean "nothing to cram".
    // Only RECALL types go on the bus: the hub's player understands flash/saq.
    const all=cardsOf(RECALL,'all');
    const now=Date.now();
    const due=all.filter(c=>srsGet(c.key).due<=now);
    return (due.length?due:all).slice()
      .sort((a,b)=>srsGet(a.key).due-srsGet(b.key).due)
      .slice(0,20)
      .map(c=>c.type==='flash'
        ? {id:c.key,type:'flash',q:c.q,a:c.a}
        : {id:c.key,type:'saq',q:c.q,points:c.points,marks:c.marks||c.points.length,model:c.model||''});
  };
  const offers=function(){
    // evPerMin scales with how much of the deck is due — raw memory value
    // only; the hub multiplies in exam weight, urgency and hurdle boosts
    const all=cardsOf(RECALL,'all');
    const due=all.filter(c=>srsGet(c.key).due<=Date.now()).length;
    const frac=all.length?due/all.length:1;
    return [{ label:'🧠 '+(PACK.title||'Cram pack'),
      topic:PACK.studybus.topic||null, assess:PACK.studybus.assess||[],
      evPerMin:+(0.15+0.45*frac).toFixed(2),
      kind:'cards', cards:busCards(),
      counts:{due:due,total:all.length} }];
  };
  const pulse=function(){ try{ localStorage.setItem('studybus.pulse.'+APP,
    JSON.stringify({v:2,app:APP,name:PACK.title,url:here,ts:Date.now(),offers:offers()})); }catch(e){} };
  pulse();
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') pulse(); });
  addEventListener('pagehide',pulse);
}

/* deep links: land in the right view/topic */
const q=new URLSearchParams(location.search);
const tp=q.get('topic'), md=q.get('mode');
if(tp&&PACK.topics.some(t=>t.id===tp)){ S.topic=tp; save(); }
if(md&&['learn','mcq','saq','exam','search','stats'].includes(md)) nav(md);
else if(tp) nav(VIEW);   // re-render so the topic chip change shows
})();
</script>
