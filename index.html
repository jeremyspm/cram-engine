    else out[k]=o[k];                       // card since edited or removed — leave as is
  } return out; };
  s.srs=lift(s.srs||{}); s.mcq=lift(s.mcq||{});
  s.v=3; return s;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
if(!S.door) S.door='ready';        // saves made before the two doors existed
if(!S.flags) S.flags={};           // …and before cards could be flagged
/* …and before there were bounded sessions or typed answers. All three are ADDITIVE:
   defaulted here rather than in migrate(), which returns early on a v3 blob, so a
   reader with saved progress picks them up empty and fills them as they go. Nothing
   here is read by the Progress projection — see the note over `S.typed` below. */
/* …and before the deck was dealt in rings. `lock` is cardKey → {n,t}: how many
   qualifying correct answers, and when the last one counted. `ring` is which ring the
   reader has chosen to be in, or the string 'any' for the escape hatch. Both additive
   and both default empty, so a saved blob from before the rings arrives at ring 0 with
   nothing locked — which is the honest starting position, not a regression. */
if(!S.lock)  S.lock={};
if(S.ring===undefined) S.ring=0;
if(!S.sess)  S.sess={d:'',n:0,goal:0};
if(!S.typed) S.typed={};           // cardKey -> {a,c,n}: attempted / clean / near-miss
if(!S.ovr)   S.ovr=[];             // "I was right" overrides, newest last, capped
/* …and before the queue could be narrowed by anything but one topic.
   `migrate()` returns early on a v3 blob, so this cannot live there: a reader who
   already has v3 saved progress with a topic chip selected still has to arrive in
   the new scope object holding what they had chosen. Carried across rather than
   dropped, because dropping it silently widens the queue under someone who
   deliberately narrowed it. The legacy keys are left on the blob — Cloud.sync
   carries this record and a destructive write for tidiness is not worth it. */
let MIGRATED_SCOPE=false;
if(!S.filters||FILTDIMS.some(d=>!Array.isArray(S.filters[d]))){
  MIGRATED_SCOPE=true;
  const f=Object.assign(FILT0(),S.filters&&typeof S.filters==='object'?S.filters:null);
  FILTDIMS.forEach(d=>{ if(!Array.isArray(f[d])) f[d]=[]; });
  /* Only when it was actually IN EFFECT. `S.topic` was honoured under the "I'll
     pick" door and inert under "Get me ready", where filters now apply to both — so
     carrying a stale chip across would silently narrow a queue that had been showing
     everything, which is precisely the failure this whole surface exists to stop. */
  if(!f.topics.length&&S.door==='pick'&&S.topic&&S.topic!=='all') f.topics=[S.topic];
  if(!f.crits.length&&S.crit) f.crits=[S.crit];
  S.filters=f;
}
/* Two booleans became three states when "exactly as it is when you are tested on
   it" arrived, so the old answers-on/answers-off flag folds into the new one. */
if(!S.libView) S.libView=S.libAns===false?'q':'read';
const topicName=id=>{const t=PACK.topics.find(t=>t.id===id);return t?`${t.icon} ${t.name}`:id;};

/* ---- background reading -------------------------------------------------------
   A pack may mark a card `bg:true`: real content, worth having, but not what the
   course has actually asked about. On hs2-test1 that is 346 of 586 cards — standard
   physiology sitting on focus points the lecturer's own questions already cover.

   Left in the default queue they are most of the tool, and "586 cards before the
   23rd" is the kind of number that stops someone starting. So they are OUT of the
   queue by default and one tap puts them back. What that must never become is a
   hidden pack: they stay in the Brief, they stay in Search, the note above the queue
   states both counts, and the toggle sits under BOTH doors. Nothing is deleted and
   nothing is locked.

   `hasBG()` is what makes it inert for every other pack. No `bg` on any card and the
   toggle never renders and `inPool` is the identity. */
let _hasBG=null;
const hasBG=()=>_hasBG!==null?_hasBG:(_hasBG=PACK.cards.some(c=>c.bg));
const bgOn=()=>!hasBG()||!!S.bg;
const inPool=c=>!c.bg||bgOn();

/* DAMAGED AT SOURCE — dealt to nobody, hidden from nobody.

   A harvested pack occasionally carries a question that is broken in the COURSE, not
   in the import. hs2-test1 has one: a matching exercise whose published key uses the
   same string as both a prompt and an answer, and whose seventh prompt reads "A tion
   of norepine on myocardial cellshrine". The capture is faithful — that is what
   Canvas served — so the card is genuinely verbatim and genuinely unanswerable.

   Neither obvious response is right. Editing it would break the one promise the
   verbatim tier makes. Dealing it means marking a student wrong on a string that does
   not parse, which teaches them nothing and makes them doubt themselves. Dropping it
   silently would hide a real defect in material they are about to be examined on.

   So: `damaged` holds the reason, the card stays in All cards, Search and the Brief
   with that reason shown, and it is never dealt as a question. The reader gets to see
   it, and to know the problem is not theirs. */
const answerable=c=>!c.damaged;

/* type may be a single type or an array of them (AUTO / RECALL).
   `all` here means every card of that type; callers that must respect the background
   setting filter with `inPool`. Search and the Brief deliberately do not. */
const cardsOf=(type,topic)=>{ const ts=Array.isArray(type)?type:[type];
  return PACK.cards.map((c,i)=>({...c,key:ckey(c),idx:i})).filter(c=>ts.includes(c.type)&&(topic==='all'||c.topic===topic)); };

/* ============ narrowing the queue ==========================================
   "Rep only the multichoice questions on the heart." "Rep only the ones I keep
   getting wrong." "Rep only the written answers." None of that was possible: the
   queue could be narrowed to ONE topic, or to ONE focus point if you arrived from
   the Brief, and the two could not be combined or even seen at the same time.

   Five dimensions, because five is what the data actually has — topic, question
   type, where the card came from, focus point, and how you are doing on it. Every
   one of them is already a grouping in All cards, which is the tell: the reader can
   already SEE the pack cut those five ways, and could not then study any of the
   slices. Selecting inside a dimension is OR (multichoice or matching), across
   dimensions is AND (multichoice, on the heart, that I keep getting wrong).

   Three rules this must not break, all of them house rules learnt the hard way:
     · it applies under BOTH doors, like the background switch — it is a property of
       the pool, not of who chooses the order, so it does not belong to a door;
     · a narrowed queue ANNOUNCES itself, every filter individually removable, and
       the way out is delegated so it can never come unbound. A filter you cannot
       see or cannot clear is a lock, and we do not lock;
     · it narrows the QUEUE, not the pack. Progress, the Brief, Search, All cards
       and the hub's ⚡ bus all keep reading the whole thing, exactly as they do
       through the background switch.                                            */
const STATUS=[
  {id:'unseen', lab:'Never attempted',  hint:'you have not answered these even once'},
  {id:'wrong',  lab:'Getting wrong',    hint:'attempted, and not sticking yet'},
  {id:'due',    lab:'Due for review',   hint:'recall cards the spacing says to see again now'},
  {id:'strong', lab:'Getting right',    hint:'attempted and holding up'},
  {id:'flagged',lab:'⚑ Flagged',        hint:'cards you marked as wrong or unclear'},
];
/* Derived from the SAME predicates the ordering uses, never re-implemented, so a
   card the door calls weak and a card this calls "getting wrong" are the same card.
   `cardWeak` counts never-attempted as weak on purpose — right for ranking, wrong
   as a label — so `seen` splits it back apart here, the same way deckStats does. */
function cardStatus(c){
  const out=[], seen=cardSeen(c);
  if(flagOf(c.key)) out.push('flagged');
  if(!seen) return (out.push('unseen'),out);
  out.push(cardWeak(c)?'wrong':'strong');
  /* Only recall cards have a due date, and only once they have been seen — an
     untouched card's due is 0, so without `seen` this would report the entire deck
     as due for review and mean nothing. */
  if(isRecall(c)&&srsGet(c.key).due<=Date.now()) out.push('due');
  return out;
}
const filtOn=()=>FILTDIMS.some(d=>S.filters[d].length);
const filtCount=()=>FILTDIMS.reduce((n,d)=>n+S.filters[d].length,0);
/* `skip` leaves one dimension out. That is how the panel counts what a chip would
   actually get you — a count taken against the whole pack would promise 41 matching
   cards and deliver 3 once the other four dimensions are applied, and a reader who
   is told a number and handed a different one stops believing the numbers. */
function passFilters(c,skip){
  const f=S.filters;
  if(skip!=='topics'&&f.topics.length&&!f.topics.includes(c.topic)) return false;
  if(skip!=='types' &&f.types.length &&!f.types.includes(c.type)) return false;
  /* `provOf`, not `c.tier`. A pack may carry a tier string the badge scale does not
     know — hs2-test1 gives its 46 rails `tier:'rail'` — and every other view already
     files those under "No source recorded" via provOf. Reading `c.tier` raw here made
     the panel offer "No source recorded · 46" and the queue then deal none of them:
     the option counted one predicate and the filter applied another. Two predicates
     for one idea is the bug; there is now one. */
  if(skip!=='tiers' &&f.tiers.length &&!f.tiers.includes(provOf(c)||'_none')) return false;
  if(skip!=='crits' &&f.crits.length &&!f.crits.some(id=>c.crit===id||(c.alsoCrit||[]).includes(id))) return false;
  if(skip!=='status'&&f.status.length){ const st=cardStatus(c); if(!f.status.some(s=>st.includes(s))) return false; }
  return true;
}
const filtClear=()=>{ S.filters=FILT0(); save(); };
function filtToggle(dim,id){
  const a=S.filters[dim], i=a.indexOf(id);
  if(i<0) a.push(id); else a.splice(i,1);
  save();
}

/* ============ interactive question runners (the AUTO types) ============
   A "runner" holds one attempt at one card: the shuffled presentation
   order, the response so far, and whether it's been revealed. The same
   three functions drive the Drill view. */
function makeRunner(c,resp){
  const r={c,rev:false,resp:null};
  switch(c.type){
    case 'mcq':   r.ord=shuffle(c.options.map((_,i)=>i)); r.resp=null; break;
    case 'order': r.ord=shuffle(c.steps.map((_,i)=>i));   r.resp=c.steps.map(()=>null); break;
    case 'cloze': r.ordB=c.blanks.map(b=>shuffle(b.options.map((_,i)=>i))); r.resp=c.blanks.map(()=>null); break;
    case 'tfset': r.resp=c.statements.map(()=>null); break;
    // de-duplicated: two prompts may legitimately share one answer, but the
    // dropdown must still only offer it once
    case 'match': r.opts=shuffle([...new Set(c.pairs.map(p=>p[1]).concat(c.distractors||[]))]); r.resp=c.pairs.map(()=>''); break;
  }
  if(resp!==undefined&&resp!==null) r.resp=resp;
  return r;
}
function runnerDone(r){
  switch(r.c.type){
    case 'mcq':   return r.resp!=null;
    case 'match': return r.resp.every(x=>x!=='');
    default:      return Array.isArray(r.resp)?r.resp.every(x=>x!=null):r.resp!=null;
  }
}
function markAuto(c,resp){
  const tot=cardMarks(c);
  if(resp==null) return {got:0,tot};
  switch(c.type){
    case 'mcq':   return {got:resp===c.correct?1:0,tot};
    case 'order': return {got:c.steps.reduce((a,_,i)=>a+(resp[i]===i?1:0),0),tot};
    case 'cloze': return {got:c.blanks.reduce((a,b,i)=>a+(resp[i]===b.correct?1:0),0),tot};
    case 'match': return {got:c.pairs.reduce((a,p,i)=>a+(resp[i]===p[1]?1:0),0),tot};
    case 'tfset': {
      const per=c.statements.reduce((a,s,i)=>a+(resp[i]===s.v?1:0),0);
      return c.partial?{got:per,tot}:{got:per===c.statements.length?1:0,tot};
    }
  }
  return {got:0,tot};
}
function figHTML(c){ return c.fig?`<div class="figwrap">${c.fig}</div>${c.figcap?`<div class="figcap">${c.figcap}</div>`:''}`:''; }

/* ---- where each card came from ---------------------------------------------
   Optional. A pack that declares `tier` on its cards gets a badge saying where the
   card came from, tappable for the source and the exact quote. Packs without `tier`
   render exactly as before — provHTML returns ''.

   Two rules hold this together.

   ONE: the labels are what a student would say. `verbatim`, `taught`, `textbook`
   and `unverified` are database values and they never reach the screen. A reader
   scanning a card should learn "this was on a past quiz" without first learning
   our vocabulary for it.

   TWO: the loudness is inverted from what you would expect. Background reading is
   the majority of a well-made pack — 61% of hs2-test1 — and dressing the majority
   in a warning glyph does not make the tool honest, it makes it look faulty, and it
   invites the reader to write off two cards in three. It is also simply not true
   that the content is suspect: it is ordinary physiology that happens not to be in
   the slides, which is what a study guide is for. So background reading is grey and
   silent, a past quiz question gets the strong colour because that is the rare thing
   worth scanning for, and real alarm is spent only on the tier that genuinely means
   nobody has checked this.

   The engine carries NO pronouns and no lecturer's name. `PACK.lecturer` supplies a
   name when a pack has one; without it every string still reads correctly with "the
   lecturer". A shared template that assumes a lecturer's gender is wrong for the
   next course by construction. */
const LECT=(PACK.lecturer||'the lecturer'), LECTS=LECT+"'s";
const LECTU=LECT.charAt(0).toUpperCase()+LECT.slice(1);
const PROV={
  verbatim:{ic:'📄',lab:'From a past quiz',
    blurb:`Copied out of one of ${LECTS} own past quizzes — the question, the options and the correct answer are exactly as they were set. This is the closest you get to seeing the real paper.`},
  taught:{ic:'📘',lab:'From the lecture slides',
    blurb:'Pinned to one specific place in the course material. The quote below is re-checked against that source every time this tool is built.'},
  textbook:{ic:'',lab:'Background reading',
    blurb:`Standard anatomy and physiology, written for this pack so the examinable facts have something to sit on, then cross-checked against the module hub. It is not in ${LECTS} own slides, so it is unlikely to come back at you word for word — but it is what makes the rest of this make sense, and it is not a warning.`},
  unverified:{ic:'⛔',lab:'Unchecked',
    blurb:'This card names a source that is not on disk, so nobody has verified it. Trust it less than anything else here.'},
};
const provOf=c=>PROV[c&&c.tier]?c.tier:null;
const provLabel=t=>`${PROV[t].ic?PROV[t].ic+' ':''}${PROV[t].lab}`;
function provHTML(c){
  const t=provOf(c); if(!t) return '';
  return `<button class="prov ${t}" data-prov="1" data-ck="${c.key||ckey(c)}" aria-expanded="false">${provLabel(t)}</button>`;
}
/* THE ORIGINAL QUESTION, WHERE THE PACK REWROTE ONE.

   Some of these questions arrive from a Canvas capture with their context stripped:
   Canvas kept the framing outside the question — a quiz title above it, a preamble, an
   underline, a link — and the harvest took only the question. A pack may supply a
   readable stem in its place and MUST hand the original over as `qOrig`.

   Showing it is not politeness, it is the thing that keeps the rewrite honest. The card
   claims to be the lecturer's; a reader has to be able to check what she actually
   wrote, and to see that only the framing moved. Collapsed by default because the
   original is usually the less useful of the two — but never more than one tap away,
   and it is plain <details>, so it works with no JS and reads correctly to a screen
   reader. A pack that rewrites nothing renders nothing. */
/* The reason a card is never dealt, shown wherever the card can be read. Silence here
   would turn an honest exclusion into a hidden one. */
function damagedHTML(c){
  if(!c.damaged) return '';
  return `<div class="damaged"><b>⚠ Not dealt as a question.</b> ${esc(c.damaged)}
    <span class="dm2">It is kept here, exactly as published, because it is still ${esc(PACK.lecturer||'the lecturer')}'s material and worth reading — the problem is in the question, not in you.</span></div>`;
}
function origHTML(c){
  if(!c.qOrig) return '';
  return `<details class="qorig"><summary>Show it as it appeared in Canvas</summary><div class="qo">${c.qOrig}</div>
    <div class="qon">Only the wording of the question was changed, to say what it is asking now that Canvas's own framing is gone. The answer, the options and any passage are exactly as ${esc(PACK.lecturer||'the lecturer')} set them.</div></details>`;
}
function provDetailHTML(c){
  const t=provOf(c); if(!t) return '';
  const evs=Array.isArray(c.ev)?c.ev:(c.ev?[c.ev]:[]);
  let body=`<b>${provLabel(t)}.</b> ${esc(PROV[t].blurb)}`;
  /* `srcNote` is what the pack knows about this card's sourcing. It used to live in
     `why`, which is the field the drill view renders as the EXPLANATION of a wrong
     answer — so 123 of hs2-test1's drill cards answered "why was I wrong?" with
     "no citation — standard textbook content written for the pack". One field, one
     job: `why` explains, `srcNote` sources. */
  if(c.srcNote) body+=`<span class="loc">${esc(c.srcNote)}</span>`;
  for(const e of evs){
    if(e.quiz) body+=`<span class="loc">📄 ${esc(e.quiz)} · ${esc(e.n||'')}</span>`;
    else if(e.src){
      if(e.quote) body+=`<span class="qt">“${esc(e.quote)}”</span>`;
      body+=`<span class="loc">${esc(SRCLABEL(e.src))}${e.loc?' · '+esc(e.loc):''}</span>`;
    }
  }
  if(c.candidateEv&&c.candidateEv.src)
    body+=`<span class="loc">Possible source, not yet confirmed: ${esc(SRCLABEL(c.candidateEv.src))}${c.candidateEv.loc?' · '+esc(c.candidateEv.loc):''}</span>`;
  if(c.selfMark) body+=`<span class="loc">This one was self-marked in Canvas — no model answer is published for it.</span>`;
  return `<div class="provdet">${body}</div>`;
}
/* Source ids are machine keys (SRC-2026-RESP2); show something a human recognises. */
function SRCLABEL(id){
  return String(id).replace(/^SRC-/,'').replace(/-/g,' ')
    .toLowerCase().replace(/\b\w/g,m=>m.toUpperCase());
}
/* a card may name the course document it came from — shown under the answer so
   you can always tell a sourced fact from a textbook one */
function srcHTML(c){ return c.src?`<div class="srcline">📄 Source: ${esc(c.src)}</div>`:''; }

/* ============ the explanation floor ============================================
   NO drill card may show a mark with nothing beside it. Ever.

   This is the moment the tool either teaches the reader or loses them, and until now
   it coin-flipped: 268 of hs2-test1's 299 drill cards landed a wrong answer on a red
   box and a number. The card was shown WHICH answer was right and told nothing about
   what it had just got wrong — for a reader who half-absorbed the lecture, which is
   the stated target, that is the least useful possible response.

   Two layers, and only the first is here. The floor SYNTHESISES a minimum honest
   line from what the card already knows: the correct option, the pairs missed, the
   blanks missed, the statements flipped. It is deliberately not a fabricated
   rationale — it states what is true and then hands the reader through to the Brief
   section for that focus point, which is where the actual prose explanation lives.
   An authored `why:` always wins where one exists; the floor is what happens
   underneath, not a replacement for writing them. */
function synthWhy(c,resp){
  const B=s=>`<b>${strip(s)}</b>`, R=resp;
  switch(c.type){
    case 'mcq':{
      const right=`The answer is ${B(c.options[c.correct])}.`;
      return (R!=null&&R!==c.correct&&c.options[R]!=null)?`${right} You went for ${B(c.options[R])}.`:right;
    }
    case 'order':{
      const out=(R||[]).map((si,i)=>si===i?null:i).filter(x=>x!=null);
      const seq=c.steps.map((s,i)=>`<b>${i+1}.</b> ${strip(s)}`).join(' → ');
      return out.length?`${out.length} step${out.length===1?'':'s'} out of place. The right order is ${seq}.`
                       :`That is the order, start to finish.`;
    }
    case 'cloze':{
      const miss=c.blanks.map((b,i)=>(R||[])[i]===b.correct?null:`${i+1}. ${B(b.options[b.correct])}`).filter(Boolean);
      return miss.length?`The blanks you missed — ${miss.join(' · ')}.`
                        :`Every blank right.`;
    }
    case 'tfset':{
      const miss=c.statements.map((s,i)=>(R||[])[i]===s.v?null:`“${strip(s.s)}” is ${B(s.v?'true':'false')}`).filter(Boolean);
      return miss.length?`What you missed — ${miss.join(' · ')}.`
                        :`All ${c.statements.length} right.`;
    }
    case 'match':{
      const miss=c.pairs.map((p,i)=>(R||[])[i]===p[1]?null:`${strip(p[0])} → ${B(p[1])}`).filter(Boolean);
      return miss.length?`The pairs you missed — ${miss.join(' · ')}.`
                        :`Every pair right.`;
    }
  }
  return '';
}
/* The way through to the prose. Only offered when the pack HAS a Brief and this card
   names a focus point that is actually in it — a dead link would be worse than none. */
function briefLink(c){
  if(!HASBRIEF()||!c||!c.crit) return '';
  const cr=(PACK.criteria||[]).find(x=>x.id===c.crit); if(!cr) return '';
  return `<button class="wlink" data-brief="${c.crit}">→ Read the full explanation: ${esc(cr.name||cr.id)}</button>`;
}
/* One feedback block, used by the Drill view, so the floor
   cannot be honoured in one place and forgotten in the other.

   The two halves are additive, not either/or. What the right answer WAS always shows —
   an authored `why:` explains the reasoning but rarely restates the answer, and the
   two together are what a reader needs. Doing it either/or meant a cloze with an
   authored note stopped telling you which blanks you had missed. */
function feedbackHTML(c,resp,head){
  const facts=synthWhy(c,resp);
  const why=c.why?`<span class="whyx">${c.why}</span>`:'';
  return `<div class="why">${head||''}${facts}${why}${briefLink(c)}</div>`;
}

/* ---- long cloze passages ------------------------------------------------------
   The biggest cloze card in hs2-test1 is 404 words with ten dropdowns buried in it,
   and it is not really a passage: it is ten separate numbered questions that Canvas
   serialised into one multiple-dropdown item. Met as a single grey wall it is the
   most demoralising card in the pack.

   It cannot be SPLIT into several cards. Harvested cards are the lecturer's content
   reproduced unaltered — verify-harvest.mjs proves it by diffing against the capture —
   and cutting one in two would edit it, break that proof, and change the card's key.
   So the card is untouched and the RENDERING is segmented: same text, same blanks,
   same marking, same progress record, laid out as a list of short blocks.

   Cuts are taken on the RAW text at sentence ends, and each piece KEEPS its trailing
   separator, so `segments.join('') === text` exactly. That is the property worth
   holding on to: segmentation can never drop, duplicate or reorder a word, and can
   never leave a `[[n]]` token orphaned between two blocks. */
const CLOZE_SEG_MIN=4;      // fewer blanks than this and it reads fine as prose
const CLOZE_PER_SEG=2;      // blanks per block
const NBLANK=/\[\[\d+\]\]/g;
/* Sentence ends, dash bullets, and newlines. The dash alternatives require whitespace
   BEFORE the dash, which is what stops them cutting inside "Cardio-acceleratory". */
const CLOZE_NATURAL=/[.?!:]\s+|\s+[–—]\s*|\s+-(?=\s|[A-Z])|\n+/g;
/* Last resort: cut immediately after a blank. Bounds every block no matter what the
   prose looks like. */
const CLOZE_AFTERBLANK=/\[\[\d+\]\]\s*/g;
/* Split keeping each separator ON the piece before it, so join('') is the input. */
function cutKeep(text,re){
  const parts=[]; let last=0,m;
  re.lastIndex=0;
  while((m=re.exec(text))){
    if(m[0].length===0){ re.lastIndex++; continue; }        // never loop on a zero-width match
    parts.push(text.slice(last,m.index+m[0].length));
    last=m.index+m[0].length;
  }
  if(last<text.length) parts.push(text.slice(last));
  return parts.length?parts:[text];
}
function packParts(parts,max){
  const segs=[]; let cur='',n=0;
  for(const p of parts){
    const b=(p.match(NBLANK)||[]).length;
    if(cur&&n+b>max){ segs.push(cur); cur=p; n=b; }
    else { cur+=p; n+=b; }
  }
  if(cur) segs.push(cur);
  return segs;
}
function clozeSegments(text,nBlanks){
  if(nBlanks<CLOZE_SEG_MIN) return [text];
  const out=[];
  for(const s of packParts(cutKeep(text,CLOZE_NATURAL),CLOZE_PER_SEG)){
    /* A block still over the limit had no natural break in it at all — the harvested
       slide dumps are like this, running on for 128 words with no full stop. Re-cut
       those on blank boundaries so no block is ever a wall. */
    if((s.match(NBLANK)||[]).length<=CLOZE_PER_SEG){ out.push(s); continue; }
    out.push(...packParts(cutKeep(s,CLOZE_AFTERBLANK),CLOZE_PER_SEG));
  }
  return out.length?out:[text];
}
const clozeProg=(c,resp)=>`<b>${(resp||[]).filter(x=>x!=null).length}</b> of <b>${c.blanks.length}</b> filled`;

function runnerHTML(r){
  const c=r.c, rev=r.rev, resp=r.resp;
  if(c.type==='mcq') return `<div class="opts">${r.ord.map((oi,k)=>{
      let cls='opt';
      if(rev){ if(oi===c.correct) cls+=' right'; else if(oi===resp) cls+=' wrong'; }
      else if(oi===resp) cls+=' picked';
      return `<button class="${cls}" data-o="${oi}"${rev?' disabled':''}><span class="k">${'ABCDEF'[k]||'•'}</span><span>${c.options[oi]}</span></button>`;
    }).join('')}</div>`;

  if(c.type==='order'){
    const used=new Set(resp.filter(x=>x!=null));
    return `<div class="seq">${c.steps.map((_,i)=>{
        const si=resp[i]; let cls='slot'+(si!=null?' full':'');
        if(rev&&si!=null) cls+=(si===i?' right':' wrong');
        return `<button class="${cls}" data-slot="${i}"${rev?' disabled':''}><span class="n">${i+1}</span><span class="s">${si!=null?c.steps[si]:'<i class="ph">tap a step below</i>'}</span></button>`;
      }).join('')}</div>
      ${rev?'':`<div class="bank">${r.ord.map(oi=>`<button data-step="${oi}"${used.has(oi)?' disabled':''}>${c.steps[oi]}</button>`).join('')}</div>`}`;
  }

  if(c.type==='cloze'){
    const mk=i=>{
      const b=c.blanks[i], sel=resp[i]; let cls='blanksel';
      if(rev) cls+=(sel===b.correct?' right':' wrong');
      const opts=r.ordB[i].map(oi=>`<option value="${oi}"${sel===oi?' selected':''}>${strip(b.options[oi])}</option>`).join('');
      return `<select class="${cls}" data-b="${i}"${rev?' disabled':''}><option value=""${sel==null?' selected':''}>— select —</option>${opts}</select>`;
    };
    const segs=clozeSegments(c.text,c.blanks.length);
    /* Substitution runs per segment. Every `[[n]]` sits in exactly one segment, so the
       other passes are no-ops — and no boundary can ever fall inside generated markup,
       because the segments were cut from the RAW text before any <select> existed. */
    const body=segs.map(s=>{
      let h=s;
      c.blanks.forEach((_,i)=>{ const tok='[['+(i+1)+']]'; if(h.indexOf(tok)>=0) h=h.split(tok).join(mk(i)); });
      return segs.length>1?`<div class="clozeseg">${h}</div>`:h;
    }).join('');
    /* The correct answers used to be restated here as well as in the feedback block,
       so a wrong cloze printed the same list twice. There is one explanation block
       now and `synthWhy` owns it — see the explanation floor. */
    return `<div class="clozebody${segs.length>1?' seg':''}">${body}</div>`
      +(c.blanks.length>=CLOZE_SEG_MIN&&!rev?`<div class="clozeprog" id="clozeprog">${clozeProg(c,resp)}</div>`:'');
  }

  if(c.type==='tfset') return c.statements.map((s,i)=>{
      let cls='tfrow';
      if(rev) cls+=(resp[i]===s.v?' right':' wrong');
      return `<div class="${cls}"><span class="s">${s.s}</span>${rev?`<span class="av">${s.v?'TRUE':'FALSE'}</span>`:
        `<span class="tfbtns"><button data-t="${i}" data-v="1" class="${resp[i]===true?'on':''}">T</button><button data-t="${i}" data-v="0" class="${resp[i]===false?'on':''}">F</button></span>`}</div>`;
    }).join('')+(rev&&!c.partial?`<div class="hinttxt">This is a single mark — every statement has to be right.</div>`:'');

  if(c.type==='match') return c.pairs.map((p,i)=>{
      let cls='mrow'; const ok=resp[i]===p[1];
      if(rev) cls+=(ok?' right':' wrong');
      return `<div class="${cls}"><span class="l">${p[0]}</span>
        <select class="blanksel" data-m="${i}"${rev?' disabled':''}><option value=""${resp[i]===''?' selected':''}>— select —</option>${
          r.opts.map(o=>`<option value="${esc(o)}"${resp[i]===o?' selected':''}>${strip(o)}</option>`).join('')}</select>
        ${rev&&!ok?`<div class="mfix">✓ ${strip(p[1])}</div>`:''}</div>`;
    }).join('');
  return '';
}

/* wires a rendered runner; onChange() fires after every interaction */
function wireRunner(root,r,onChange){
  const c=r.c;
  if(c.type==='mcq') root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ r.resp=+b.dataset.o; onChange(); });
  if(c.type==='order'){
    root.querySelectorAll('.bank button').forEach(b=>b.onclick=()=>{
      const slot=r.resp.indexOf(null); if(slot<0) return;
      r.resp[slot]=+b.dataset.step; onChange();
    });
    root.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{
      const i=+s.dataset.slot; if(r.resp[i]==null) return;
      r.resp[i]=null; onChange();                    // tap a filled slot to send it back
    });
  }
  /* The counter is updated HERE rather than in the view's refresh, so it works in the
     in place rather than by re-render, which would drop the
     reader's scroll position halfway down a ten-blank passage. */
  if(c.type==='cloze') root.querySelectorAll('select[data-b]').forEach(s=>s.onchange=()=>{
    r.resp[+s.dataset.b]= s.value===''?null:+s.value;
    const cp=root.querySelector('#clozeprog'); if(cp) cp.innerHTML=clozeProg(c,r.resp);
    onChange(); });
  if(c.type==='tfset') root.querySelectorAll('.tfbtns button').forEach(b=>b.onclick=()=>{
    r.resp[+b.dataset.t]= b.dataset.v==='1';
    root.querySelectorAll('.tfbtns button').forEach(x=>x.classList.toggle('on', r.resp[+x.dataset.t]===(x.dataset.v==='1')));
    onChange(); });
  if(c.type==='match') root.querySelectorAll('select[data-m]').forEach(s=>s.onchange=()=>{
    r.resp[+s.dataset.m]=s.value; onChange(); });
}

/* ---- SRS (Leitner boxes 0-4) ---- */
const IVL=[0, 10*60e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3]; // per box, ms
function srsGet(i){ return S.srs[i]||{box:0,due:0,seen:0}; }
function srsRate(i,r){ // r: 0 again, 1 hard, 2 good, 3 easy
  const st=srsGet(i);
  st.box = r===0?0 : r===1?st.box : Math.min(MAXBOX, st.box+(r===3?2:1));
  st.due = Date.now()+IVL[st.box];
  st.seen++;
  S.srs[i]=st; save();
}

/* ---- header / theme / days left ---- */
$('#hTitle').textContent=PACK.title;
$('#hSub').textContent=PACK.subtitle||'cram engine';
document.title=PACK.title;
function applyTheme(){ document.documentElement.setAttribute('data-theme',S.theme); }
$('#btnTheme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme();};
applyTheme();

/* ---- the benchmark, and whether we are allowed to call it a pass mark ----------
   `exam.pass` is the number the Progress projection and the readiness readout mark
   against. (It used to serve the mock test too; that view is gone — see below.)
   Plenty of courses never publish one — Health Science 2 specifies everything else
   about its tests (duration, question count, SAQ share, conditions, weighting) and
   states no pass mark anywhere, and the number this pack carried turned out to be
   the 65 MINUTE duration sitting in the wrong field. It was then rendered as "you
   need 65% to pass", which is a rule the course has never made.

   So a pack that has not sourced its number sets `exam.passIsTarget:true`, and every
   string that mentions it says TARGET and says whose it is. A benchmark is still
   useful — the projection needs something to mark against, and aiming at a bare pass
   is bad advice — but the tool must not invent a requirement and attribute it to the
   course. Packs whose pass mark IS published leave the flag off and read as before. */
const PASSMARK=()=>((PACK.exam&&PACK.exam.pass)||80);
const PASSTARGET=()=>!!(PACK.exam&&PACK.exam.passIsTarget);
const passPhrase=()=>PASSTARGET()?`against a <b>${PASSMARK()}%</b> target`:`you need <b>${PASSMARK()}%</b> to pass`;
const passWord=()=>PASSTARGET()?'target':'pass';
const passCaveat=()=>PASSTARGET()
  ?`The course publishes no pass mark for this one, so <b>${PASSMARK()}%</b> is this tool's target — set above a bare pass to leave you some margin.`
  :'';

/* Days until the sitting. Optional: a pack with no `exam.date` renders nothing and
   behaves exactly as before. Parsed as LOCAL midnight, not UTC — `new Date('2026-08-23')`
   is UTC midnight, which in NZ is already midday on the 23rd and would report a day fewer
   than the student has. */
function examDate(){
  const d=PACK.exam&&PACK.exam.date; if(!d) return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return null;
  return new Date(+m[1],+m[2]-1,+m[3]);
}
function daysLeft(){
  const d=examDate(); if(!d) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((d-today)/864e5);
}
(function renderDaysLeft(){
  const n=daysLeft(); if(n==null) return;
  const el=$('#hDays'); el.hidden=false;
  el.textContent = n>1?`${n} days left` : n===1?'Tomorrow' : n===0?'Today' : 'Test has been';
  el.className='dleft'+(n<0?'':n<=2?' now':n<=7?' soon':'');
})();

/* Source badges are wired by delegation: the card views re-render constantly and
   per-render wiring would have to be repeated in each of them. Deliberately NOT added
   knowing mid-question that a card is background reading is a hint
   the real paper will not give you. It appears in the review afterwards instead. */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-prov]'); if(!b) return;
  /* The Brief puts dozens of cards on one screen, so the card is resolved from the
     button and the detail fills the slot inside its OWN fact block. The single-card
     views have one .provslot per .card and still fall back to CUR.
     `.libcard` must be listed BEFORE `.card`: All cards renders many .libcards and
     none of them is a .card, so without it every badge in that view resolved no slot
     and did nothing at all — a dead control that throws no error. */
  const host=b.closest('.fact')||b.closest('.libcard')||b.closest('.card');
  const slot=host&&host.querySelector('.provslot'); if(!slot) return;
  const ck=b.dataset.ck;
  const card=ck?PACK.cards.find(x=>ckey(x)===ck):null;
  const open=slot.innerHTML!=='';
  slot.innerHTML=open?'':provDetailHTML(card||CUR);
  b.setAttribute('aria-expanded',String(!open));
});


/* ---- Sources: where this pack's content came from ---------------------------
   Only shown for packs that declare `tier`. The house rule is that a tool must say
   what it does not know rather than sound uniformly confident, so this is a plain
   count of what came off a past quiz, what is pinned to the lecture material, and
   what was written for the pack — plus anything the build flags about itself.

   This is also where the content-pack validator's output lands now. A reader can
   come and find it; they are simply never made to walk past it. */
function renderAudit(){
  const cards=PACK.cards||[];
  const by={verbatim:[],taught:[],textbook:[],unverified:[],untiered:[]};
  for(const c of cards) (by[c.tier]||by.untiered).push(c);
  const n=t=>by[t].length, pct=t=>cards.length?Math.round(100*n(t)/cards.length):0;

  const gaps=(PACK.criteria||[]).filter(c=>c.acknowledgedGap||c.blind);
  const byTopic={};
  for(const c of by.textbook) byTopic[c.topic]=(byTopic[c.topic]||0)+1;
  const topics=Object.entries(byTopic).sort((a,b)=>b[1]-a[1]);

  view.innerHTML=`
    <div class="card">
      <h3>🔎 Where this came from</h3>
      <p style="color:var(--tx2);font-size:14px;line-height:1.6;margin:2px 0 14px">
        Every card records its own source. Tap the badge on any card to see the document
        and the exact quote it was checked against.</p>
      <div class="statgrid">
        <div class="catstat"><div class="top"><b>📄 From a past quiz</b><span class="m">${n('verbatim')}</span></div>
          <div class="bar"><i style="width:${pct('verbatim')}%"></i></div>
          <div class="sub">Copied out of ${esc(LECTS)} own past quizzes, wording and answer key unchanged. The most valuable thing in here.</div></div>
        <div class="catstat"><div class="top"><b>📘 From the lecture slides</b><span class="m">${n('taught')}</span></div>
          <div class="bar"><i style="width:${pct('taught')}%"></i></div>
          <div class="sub">Pinned to one place in the course material by a quote the build re-checks every time.</div></div>
        <div class="catstat"><div class="top"><b>Background reading</b><span class="m">${n('textbook')}</span></div>
          <div class="bar"><i style="width:${pct('textbook')}%"></i></div>
          <div class="sub">Standard anatomy and physiology written for this pack so the examinable facts have something to sit on, then cross-checked against the module hub. Normal for a study guide — not a warning.</div></div>
        ${n('unverified')?`<div class="catstat"><div class="top"><b>⛔ Unchecked</b><span class="m">${n('unverified')}</span></div>
          <div class="bar"><i style="width:${pct('unverified')}%"></i></div>
          <div class="sub">Names a source that is not on disk. Nobody has verified these — trust them less than anything else here.</div></div>`:''}
      </div>
      <p style="color:var(--tx3);font-size:12.5px;margin:10px 0 0">
        ${n('verbatim')+n('taught')} of ${cards.length} cards
        (${Math.round(100*(n('verbatim')+n('taught'))/Math.max(cards.length,1))}%) trace back to something the course itself published.</p>
    </div>

    ${flagCount()?`<div class="card" style="margin-top:14px">
      <h3>⚑ ${flagCount()} card${flagCount()===1?'':'s'} you have flagged</h3>
      <p style="color:var(--tx2);font-size:13.5px;line-height:1.6;margin:2px 0 10px">Cards you marked as having a wrong or unclear question or answer. They are kept on this device so they can be sent on and fixed at the source.</p>
      <div class="btnrow" style="margin-top:0"><button class="btn ghost" id="auditFlags">Read them in All cards</button></div>
    </div>`:''}

    ${gaps.length?`<div class="card" style="margin-top:14px">
      <h3>Never practised</h3>
      <p style="color:var(--tx2);font-size:13.5px;margin:2px 0 10px">The course lists these as examinable, but no practice test we can read covers them. They are not hidden from you, and this tool leads with them.</p>
      ${gaps.map(c=>`<div class="auditrow"><span class="n">${c.herQuestions!=null?c.herQuestions:'—'}</span>
        <span><b>${esc(c.name||c.id)}</b><br><span style="color:var(--tx3);font-size:12.5px">${
          esc(c.acknowledgedGap|| (c.blind?'No question in any practice material we can read touches this focus point.':''))}</span></span></div>`).join('')}
    </div>`:''}

    ${topics.length?`<div class="card" style="margin-top:14px">
      <h3>Where the background reading sits</h3>
      <p style="color:var(--tx2);font-size:13.5px;margin:2px 0 10px">Background-reading cards by topic — the parts worth a second look against the lecture slides if you have the time.</p>
      ${topics.map(([t,k])=>`<div class="auditrow"><span class="n">${k}</span><span>${esc(topicName(t))}</span></div>`).join('')}
    </div>`:''}

    ${packErrs.length?`<div class="card" style="margin-top:14px">
      <h3>What the build flags about itself</h3>
      <p style="color:var(--tx2);font-size:13.5px;margin:2px 0 10px">This tool checks its own content every time it is built. These checks did not pass. They are authoring problems rather than anything you can act on — they are here because hiding them would be worse than showing them.</p>
      ${packErrs.map(e=>`<div class="auditrow"><span class="n">!</span><span>${esc(e)}</span></div>`).join('')}
    </div>`:''}`;
  const g=$('#auditFlags'); if(g) g.onclick=()=>{ S.libAt='_flagged'; save(); nav('cards'); };
}

/* ============================================================================
   ALL CARDS — the browse-everything view, and flagging
   ============================================================================
   Every other view answers "what should I do next?". This one answers "what is
   actually IN here?", which is a different question and had no home: Study deals
   one card and chooses it for you, Search needs you to already know the word you
   are looking for, and the Brief is prose about focus points rather than the cards
   themselves. On a 586-card pack that means most cards could not be READ on
   purpose, only encountered.

   That matters more than browsing convenience, because it is also the only way a
   wrong answer key gets caught. The pack is built from a lecturer's own quizzes;
   three of hs2-test1's imported keys turned out to be wrong, and every one was
   found by a human reading the card. So this view and the flag button ship
   together: see all of it, and mark what is broken while you are looking at it. */

/* One renderer for "what is the answer to this card", shared with Search. Each
   type answers differently and every view that shows an answer outside the runner
   needs the same switch — it existed once already, inside renderSearch. */
function clozeFilled(c){
  let h=c.text||'';
  (c.blanks||[]).forEach((b,i)=>{ h=h.split('[['+(i+1)+']]').join(`<b>${b.options[b.correct]}</b>`); });
  return h;
}
/* THE WHOLE CHOICE SET, not just the key.

   This used to return `<b>options[correct]</b>` for an mcq and nothing else, so All
   cards and Search showed the question and the right answer with the distractors
   invisible. On hs2-test1 that is 111 of 255 cards rendered in a form nobody can
   check: you cannot tell whether a key is right without seeing what it was chosen
   over, and you cannot spot the two failure modes that actually occur in an imported
   pack — a distractor that is also true, and a key pointing at the wrong index.

   Three of this pack's imported keys have already turned out to be wrong, every one
   caught by a human reading the card. Hiding the options is hiding the evidence. The
   same applied to a match card's distractors and a cloze blank's options. */
/* PARAGRAPHS, FROM STRUCTURE THAT WAS ALREADY THERE.

   The long answers are not shapeless — 38 of the 40 answers over 90 words are already
   written as "<b>1. Where its blood comes from.</b> …<br><br><b>2. What it perfuses.</b> …".
   The structure is in the markup and the renderer was throwing it away: a doubled <br>
   collapses to one thin line break, so a 274-word answer with three clearly labelled
   parts arrived as one grey slab. That is the "paragraph for a card" complaint, and it
   is a typography bug rather than an authoring one.

   So: split on doubled breaks and give each part a real block, with a leading <b> read
   as a run-in heading. Purely presentational — the stored text is untouched, nothing is
   reordered or dropped, and an answer with no doubled break simply becomes one block.
   Done here rather than in the pack so every card gets it, including the lecturer's own
   verbatim ones, which may not be edited. */
function proseHTML(html){
  const s=String(html==null?'':html);
  if(!s.trim()) return '';
  const parts=s.split(/(?:<br\s*\/?>\s*){2,}/i).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return `<div class="pblk">${s}</div>`;
  return parts.map(p=>`<div class="pblk${/^<b>/i.test(p)?' run':''}">${p}</div>`).join('');
}
const optLine=(txt,ok)=>`<div class="optl${ok?' ok':''}"><span class="mk">${ok?'✓':'·'}</span><span>${txt}</span></div>`;
function answerHTML(c){
  switch(c.type){
    case 'flash': return proseHTML(c.a);
    /* Fully revealed. All cards is for READING the pack, not being tested by it. */
    case 'rail':  return railHTML(c,{hideBeads:[],hideVerbs:[]},true);
    case 'mcq':   return (c.options||[]).map((o,i)=>optLine(o,i===c.correct)).join('');
    /* The completed passage, not a numbered list of the blanks. A cloze card's
       answer IS the sentence read through with the gaps filled — checking one
       against the slides means reading it as prose. The per-blank choices follow it,
       because a blank whose distractors are all also correct is a broken blank and
       the filled sentence alone will never show you that. */
    case 'cloze': return clozeFilled(c)
      + (c.blanks||[]).map((b,i)=>`<div class="optset"><span class="bn">${i+1}</span>${
          (b.options||[]).map((o,j)=>`<span class="opt${j===b.correct?' ok':''}">${strip(o)}</span>`).join('')}</div>`).join('');
    case 'order': return c.steps.map((s,i)=>`${i+1}. ${strip(s)}`).join('<br/>');
    case 'tfset': return c.statements.map(s=>`<b>${s.v?'TRUE':'FALSE'}</b> — ${strip(s.s)}`).join('<br/>');
    case 'match': return c.pairs.map(p=>`${strip(p[0])} → <b>${strip(p[1])}</b>`).join('<br/>')
      + ((c.distractors||[]).length?`<div class="optset"><span class="bn">✗</span>${
          c.distractors.map(d=>`<span class="opt">${strip(d)}</span>`).join('')}<span class="dl">decoys — match to nothing</span></div>`:'');
    default:      return (c.points||[]).map((p,i)=>`${i+1}. ${p}`).join('<br/>');   // saq
  }
}

/* ---- flags -------------------------------------------------------------------
   A flag is keyed by `ckey` — the same hash of type + question + content that keys
   progress and the authored explanations overlay. That is the whole design:

   - EDIT THE CARD AND THE KEY CHANGES. A flag against a card that has since been
     rewritten stops resolving, which is exactly right — it has probably been fixed.
     The flagged list shows those separately and says so rather than silently
     dropping them or, worse, re-attaching them to a card nobody flagged.
   - It rides Cloud.sync with the rest of the state blob, so flags raised on a phone
     are on the laptop that can fix them.

   There is no server. A flag is a note to whoever maintains the pack, and the panel
   says so in those words — claiming a report had been "sent" when it went into
   localStorage would be the self-explaining-UI rule broken in the one place the
   reader cannot check. */
const FLAGREASONS=[
  {id:'answer',   lab:'The answer is wrong'},
  {id:'question', lab:'The question is wrong'},
  {id:'unclear',  lab:'Unclear or badly worded'},
  {id:'typo',     lab:'Typo or formatting'},
  {id:'misfiled', lab:'Wrong topic'},
  {id:'dupe',     lab:'Duplicate'},
  {id:'other',    lab:'Something else'},
];
const REASONLAB=id=>(FLAGREASONS.find(r=>r.id===id)||{lab:id}).lab;
const flagOf=ck=>(S.flags||{})[ck];
const flagCount=()=>Object.keys(S.flags||{}).length;
const flagsIn=cards=>cards.filter(c=>flagOf(c.key)).length;
function flagBtnHTML(ck){
  const f=flagOf(ck);
  return `<button class="flagbtn${f?' on':''}" data-flag="1" data-ck="${ck}" aria-expanded="false">⚑ ${f?'Flagged':'Flag'}</button>`;
}
function flagPanelHTML(ck){
  const f=flagOf(ck)||{};
  return `<div class="flagpanel">
    <b>What is wrong with this card?</b>
    <div class="chips">${FLAGREASONS.map(r=>`<button class="chip${f.r===r.id?' on':''}" data-fr="${r.id}">${r.lab}</button>`).join('')}</div>
    <textarea placeholder="Optional — what should it say instead?">${esc(f.note||'')}</textarea>
    <div class="btnrow">
      <button class="btn primary" data-fsave="1"${f.r?'':' disabled'}>${f.r?'Update flag':'Pick what is wrong'}</button>
      ${f.r?`<button class="btn ghost" data-fdel="1">Remove flag</button>`:''}
    </div>
    <p class="note">Saved on this device, and carried to your other devices if you are signed in on the hub. <b>Nothing is sent anywhere.</b> Send them on from <b>All cards → Flagged</b>.</p>
  </div>`;
}
/* Delegated, like the source badges and for the same reason: the study card
   re-renders on every answer and All cards re-renders on every filter keystroke,
   so per-render wiring would have to be repeated in five places and would rot in
   the sixth. */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-flag]'); if(!b) return;
  const host=b.closest('.libcard')||b.closest('.rev')||b.closest('.card');
  const slot=host&&host.querySelector('.flagslot'); if(!slot) return;
  const ck=b.dataset.ck;
  if(slot.innerHTML){ slot.innerHTML=''; b.setAttribute('aria-expanded','false'); return; }
  slot.innerHTML=flagPanelHTML(ck);
  b.setAttribute('aria-expanded','true');
  wireFlagPanel(slot,ck,b);
});
function wireFlagPanel(slot,ck,btn){
  let sel=(flagOf(ck)||{}).r||null;
  const sv=slot.querySelector('[data-fsave]'), del=slot.querySelector('[data-fdel]');
  const chips=[...slot.querySelectorAll('[data-fr]')];
  /* Saving with no reason chosen would file everything as "other" and make the
     export useless to read, so the button states the requirement instead of
     failing on press. */
  const upd=()=>{ if(!sv) return; sv.disabled=!sel;
    sv.textContent=sel?(flagOf(ck)?'Update flag':'Save flag'):'Pick what is wrong'; };
  chips.forEach(ch=>ch.onclick=()=>{ sel=ch.dataset.fr; chips.forEach(x=>x.classList.toggle('on',x===ch)); upd(); });
  const refreshBtn=()=>{
    const f=flagOf(ck);
    btn.classList.toggle('on',!!f);
    btn.textContent='⚑ '+(f?'Flagged':'Flag');
    const lc=btn.closest('.libcard'); if(lc) lc.classList.toggle('flagged',!!f);
  };
  const close=()=>{ slot.innerHTML=''; btn.setAttribute('aria-expanded','false'); };
  /* Redrawing the smallest thing that changed, and no more. Re-rendering the whole
     view on save cost the reader their filter text and their place in a 60-card
     list every time they flagged something — which is the moment they are least
     likely to be finished. Only the flagged list genuinely changes shape, because
     removing a flag removes the card from it. */
  const after=()=>{
    save();
    if(VIEW==='cards'&&S.libAt==='_flagged'){ libFlagged(); return; }
    const lc=btn.closest('.libcard'), c=allCards().find(x=>x.key===ck);
    if(lc&&c){
      const parent=lc.parentNode;
      lc.outerHTML=libCardHTML(c);                      // delegated handlers, so the fresh node is live
      /* …except the runner, which is not delegated and cannot be: a replaced test
         card would keep its options and stop responding to them. Re-query rather
         than reuse `lc`, which this line has just detached. */
      const fresh=parent&&parent.querySelector(`.libcard[data-ck="${ck}"]`);
      if(fresh) libWireCard(fresh,c);
      return;
    }
    refreshBtn(); close();                              // study card
  };
  if(sv) sv.onclick=()=>{
    if(!sel) return;
    const c=PACK.cards.find(x=>ckey(x)===ck);
    S.flags[ck]={r:sel, note:(slot.querySelector('textarea').value||'').trim(), t:Date.now(),
                 q:c?strip(c.q).slice(0,200):(flagOf(ck)||{}).q||''};
    after();
  };
  if(del) del.onclick=()=>{ delete S.flags[ck]; after(); };
}
/* The export. Enough per flag that it is still legible after the card it points at
   has been edited away — the reason, the note, and the question as it read when it
   was flagged. */
function flagsJSON(){
  const rows=Object.entries(S.flags||{}).sort((a,b)=>(b[1].t||0)-(a[1].t||0)).map(([ck,f])=>{
    const c=PACK.cards.find(x=>ckey(x)===ck);
    return {ck, reason:f.r, note:f.note||'', at:new Date(f.t||Date.now()).toISOString(),
            type:c?c.type:null, topic:c?c.topic:null, crit:c?(c.crit||null):null,
            stillInPack:!!c, q:(c?strip(c.q):f.q||'').slice(0,300)};
  });
  return JSON.stringify({pack:PACK.id, exported:new Date().toISOString(), n:rows.length, flags:rows},null,2);
}
/* clipboard-then-textarea: navigator.clipboard is absent over file:// and on some
   in-app browsers, which is exactly where an offline single-file tool gets opened. */
function copyText(t,btn){
  const done=ok=>{ if(!btn) return; const o=btn.textContent;
    btn.textContent=ok?'Copied ✓':'Could not copy — select it manually'; setTimeout(()=>btn.textContent=o,2200); };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false));
  try{ const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;top:-999px'; document.body.appendChild(ta);
    ta.select(); const ok=document.execCommand('copy'); ta.remove(); done(ok);
  }catch(err){ done(false); }
}
function downloadText(t,name){
  const b=new Blob([t],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ---- the groupings ----
   All four already exist in the data, so all four are offered: the reader's mental
   model of "category" is not knowable in advance, and by-source is the one an
   author wants (read every Unchecked card in a sitting) while by-topic is the one
   a student wants. A card with `alsoCrit` appears under each focus point it
   covers — that is how the coverage gate counts it, and a browse view that
   disagreed with the gate would send someone hunting for a card that is there. */
function libModes(){
  const gs=[{id:'topic',lab:'By topic'}];
  if((PACK.criteria||[]).length) gs.push({id:'crit',lab:'By focus point'});
  if(PACK.cards.some(c=>c.tier)) gs.push({id:'tier',lab:'By source'});
  gs.push({id:'type',lab:'By question type'});
  return gs;
}
const critName=id=>{const c=(PACK.criteria||[]).find(x=>x.id===id);return c?(c.name||c.id):id;};
function libBuckets(mode){
  const all=allCards(), mk=(id,name,cards,note)=>({id,name,cards,note:note||''});
  let bs;
  if(mode==='crit')
    bs=(PACK.criteria||[]).map(cr=>mk(cr.id,cr.name||cr.id,
      all.filter(c=>c.crit===cr.id||(c.alsoCrit||[]).includes(cr.id)), cr.blind?'never practised in the course':''));
  else if(mode==='tier')
    bs=['verbatim','taught','textbook','unverified'].map(t=>mk(t,PROV[t].lab,all.filter(c=>c.tier===t)))
      .concat([mk('_none','No source recorded',all.filter(c=>!PROV[c.tier]))]);
  else if(mode==='type')
    bs=ALLTYPES.map(t=>mk(t,TYPELABEL[t],all.filter(c=>c.type===t)));
  else
    bs=PACK.topics.map(t=>mk(t.id,topicName(t.id),all.filter(c=>c.topic===t.id)))
      .concat([mk('_none','Not in any topic',all.filter(c=>!PACK.topics.some(t=>t.id===c.topic)))]);
  return bs.filter(b=>b.cards.length);
}

/* ---- three ways to look at a card ----------------------------------------------
   READ is question and answer together: the job is checking the pack, and a wrong
   answer key is only findable by someone reading the key.

   QUESTIONS ONLY is the same list with the answers withheld, for self-testing off
   the page.

   AS TESTED is the card wearing the clothes it wears in the queue — the actual
   options as buttons, the actual dropdowns, the chain with its beads knocked out,
   the mark count, everything. It exists because READ answers "is this card right?"
   and cannot answer "what will this look like when it is put to me?", which is a
   different and equally reasonable question, and until now the only way to find out
   was to be dealt the card by chance. On a 345-card pack that is not a way.

   It is not a lookalike. `cardHeadHTML` and `faceHTML` are the functions Study
   itself renders through, called here with the same arguments — so this view cannot
   drift from the real thing without the real thing changing too. Answering is live
   for the same reason; a static screenshot of a multichoice card is not what being
   tested on it looks like. What it deliberately does NOT do is write to your
   progress: this is a browse view, and a browse view that quietly marks cards as
   attempted would corrupt every readiness number in the tool. The card says so, and
   points at the button that does count. */
const LIBVIEWS=[{id:'read',lab:'📖 Read'},{id:'q',lab:'🙈 Questions only'},{id:'test',lab:'🎯 As tested'}];
/* Runners live across re-renders, keyed by card. The list redraws on every keystroke
   in the filter box; without this, typing one letter would reshuffle every set of
   options on screen and throw away answers half-entered. Cleared when the group or
   the view mode changes, which is the point at which a fresh deal is what you want. */
let LIBR={};
function libTestCardHTML(c){
  const f=flagOf(c.key);
  /* A damaged card is never dealt, so there is no "as tested" for it — showing one
     would be inventing a version of the card the reader will never meet. It keeps
     its head and its reason, and hands over the answer as READ mode shows it. */
  if(c.damaged) return `<div class="libcard test${f?' flagged':''}" data-ck="${c.key}">
    ${cardHeadHTML(c)}${damagedHTML(c)}
    <div class="liba"><span class="lb">Answer</span>${answerHTML(c)}</div>
    <div class="flagslot"></div></div>`;
  const r=LIBR[c.key]||(LIBR[c.key]=makeRunner(c));
  const item=c.type==='rail'?railItem(c,srsGet(c.key).box||0):null;
  const showLab=c.type==='saq'?'Show the marking points':c.type==='rail'?'Show the chain':'Show the answer';
  return `<div class="libcard test${f?' flagged':''}" data-ck="${c.key}">
    ${cardHeadHTML(c)}
    <div class="tface">${faceHTML(c,r,item)}</div>
    <div class="tbtns">${isAuto(c)&&c.type!=='mcq'?`<button class="btn ghost" data-tcheck="1" disabled>Check answer</button>`:''}
      <button class="btn ghost" data-tshow="1">${showLab}</button></div>
    <div class="tans"></div>
    <div class="flagslot"></div></div>`;
}
/* One card, standing still. Question and answer together by default, because the
   job here is reading and checking rather than testing yourself — the queue is two
   taps away for that. */
function libCardHTML(c){
  if(S.libView==='test') return libTestCardHTML(c);
  const f=flagOf(c.key), showA=S.libView!=='q';
  return `<div class="libcard${f?' flagged':''}" data-ck="${c.key}">
    <div class="libmeta">
      <span class="tag acc">${esc(topicName(c.topic))}</span>
      <span class="tag">${TYPELABEL[c.type]||c.type}</span>
      ${c.crit?`<span class="tag">${esc(critName(c.crit))}</span>`:''}
      ${c.bg?`<span class="tag">not in the queue</span>`:''}
      ${provHTML(c)}
      ${flagBtnHTML(c.key)}
    </div>
    <div class="libq">${c.type==='rail'?esc(c.name||'Rebuild this chain'):c.q}</div>${origHTML(c)}${damagedHTML(c)}
    <div class="provslot"></div>
    ${c.type==='cloze'&&!showA?`<div class="liba">${esc(strip(c.text||''))}</div>`:''}
    ${figHTML(c)}
    ${showA?`<div class="liba"><span class="lb">${c.type==='saq'?'Marking points':'Answer'}</span>${answerHTML(c)}</div>`:''}
    ${showA&&(c.why||c.model)?`<div class="libwhy">💡 ${c.why||c.model}</div>`:''}
    ${f?`<div class="libstale">⚑ You flagged this: <b>${esc(REASONLAB(f.r))}</b>${f.note?` — ${esc(f.note)}`:''}</div>`:''}
    <div class="flagslot"></div>
  </div>`;
}

/* Wiring one test card. Per-card and per-draw rather than delegated, because a
   runner holds state that a delegated handler would have to look up, and the flag
   panel — which IS delegated — proves why the two are different problems: a flag is
   a fact about a card, a half-answered matching exercise is a fact about this
   rendering of it. Every path that replaces a card's markup has to call this again,
   which is exactly one path (the flag save) plus the draw. */
function libWireCard(el,c){
  if(S.libView!=='test'||!c||c.damaged) return;
  const r=LIBR[c.key]; if(!r) return;
  const face=el.querySelector('.tface'), slot=el.querySelector('.tans');
  const btns=el.querySelector('.tbtns');
  if(!face||!slot||!btns) return;
  const chk=btns.querySelector('[data-tcheck]'), show=btns.querySelector('[data-tshow]');
  const done=()=>{ btns.remove(); };
  /* Marked exactly as the queue marks it, and then NOT written down. The one line
     studyAuto has that this must not have is the S.mcq write — see the note above. */
  const mark=()=>{
    r.rev=true;
    const tot=cardMarks(c), {got}=markAuto(c,r.resp);
    face.innerHTML=faceHTML(c,r);
    slot.innerHTML=`<div class="tres">${got===tot?'✅':got?'➖':'❌'} <b>${got} / ${tot} mark${tot>1?'s':''}</b> — a look, not an attempt: nothing here is recorded.</div>`
      +feedbackHTML(c,r.resp,'')+srcHTML(c);
    done();
  };
  const reveal=()=>{
    if(isAuto(c)){ r.rev=true; face.innerHTML=faceHTML(c,r); }
    slot.innerHTML=`<div class="liba"><span class="lb">${c.type==='saq'?'Marking points':c.type==='rail'?'The whole chain':'Answer'}</span>${answerHTML(c)}</div>`
      +((c.why||c.model)?`<div class="libwhy">💡 ${c.why||c.model}</div>`:'')+srcHTML(c);
    done();
  };
  const refresh=()=>{
    /* `order` is the one type whose face rebuilds on every tap — the bank and the
       slots swap — so it re-wires, the same way studyAuto does. */
    if(c.type==='order'){ face.innerHTML=faceHTML(c,r); wireRunner(face,r,refresh); }
    if(chk) chk.disabled=!runnerDone(r);
    if(c.type==='mcq'&&runnerDone(r)) mark();      // mcq marks on pick, exactly as in the queue
  };
  if(isAuto(c)) wireRunner(face,r,refresh);
  if(chk) chk.onclick=mark;
  if(show) show.onclick=reveal;
}
/* Re-wires whatever test cards are currently on screen. */
function libWireAll(root,cards){
  if(S.libView!=='test') return;
  const by={}; cards.forEach(c=>by[c.key]=c);
  root.querySelectorAll('.libcard.test').forEach(el=>libWireCard(el,by[el.dataset.ck]));
}
/* The three-way view switch, rendered by every screen in All cards that lists cards
   so the choice is never somewhere the reader has to go back for. */
function libViewSeg(){
  return `<div class="seg libseg">${LIBVIEWS.map(v=>
    `<button class="${v.id===S.libView?'on':''}" data-lv="${v.id}">${v.lab}</button>`).join('')}</div>`;
}
function wireLibView(redraw){
  /* `libAns` is kept in step although nothing reads it any more. This state blob is
     Cloud.sync'd, and a phone still holding the previous build reads that key — a
     stale `true` there would show it answers while the laptop shows none. */
  $$('[data-lv]').forEach(b=>b.onclick=()=>{ S.libView=b.dataset.lv; S.libAns=S.libView!=='q'; LIBR={}; save(); redraw(); });
}
/* ⚡ REP THESE — the browse view's way into the queue.
   Reading a group and then wanting to be tested on exactly that group is the obvious
   next move, and the two features are the same feature from opposite ends: this
   button turns whatever you are looking at into the filter that produces it. Every
   grouping maps onto a filter dimension one-for-one, which is not a coincidence —
   they are the same five facts about a card. */
const LIBREP={topic:'topics',crit:'crits',tier:'tiers',type:'types'};
function libRepBtn(mode,id){
  if(id==='_flagged') return `<button class="btn primary" data-rep="status:flagged">⚡ Rep these in Study</button>`;
  const dim=LIBREP[mode];
  /* "Not in any topic" and "No source recorded" are catch-alls in the browse view,
     and only one of them is a real filter value. A card in no declared topic cannot
     be asked for by topic id, so the button is simply not offered rather than
     offered and then dealing nothing. */
  if(!dim||(id==='_none'&&mode!=='tier')) return '';
  return `<button class="btn primary" data-rep="${dim}:${esc(id)}">⚡ Rep these in Study</button>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-rep]'); if(!b) return;
  const [dim,val]=b.dataset.rep.split(':');
  /* Replaces the whole scope rather than adding to it. "Rep these" has to deal the
     group you are looking at; leaving a leftover filter on from an hour ago would
     hand back a subset of it with no explanation. The pill row shows the result. */
  S.filters=FILT0(); S.filters[dim]=[val]; save();
  nav('study'); window.scrollTo({top:0});
});

function renderLibrary(){
  if(S.libAt==='_flagged') return libFlagged();
  const mode=S.libGroup||'topic', buckets=libBuckets(mode);
  const at=S.libAt?buckets.find(b=>b.id===S.libAt):null;

  view.innerHTML=`
    <div class="card">

        The whole pack, standing still. Nothing is scheduled and nothing is left out${nbg?`, including the ${nbg} cards held back from the study queue`:''} — open a group and read the questions and their answers straight through.</p>
      <p style="color:var(--tx2);font-size:14px;line-height:1.6;margin:0 0 10px">
        Inside a group you can switch to <b>🎯 As tested</b> and see every card exactly as it is put to you in the queue — the real options, the real blanks, answerable — or hit <b>⚡ Rep these in Study</b> to be dealt just that group.</p>
      <p style="color:var(--tx2);font-size:14px;line-height:1.6;margin:0">

    </div>

    ${buckets.map(b=>{ const fb=flagsIn(b.cards);
      return `<button class="libgrp" data-lib="${esc(b.id)}">
        <span class="nm">${esc(b.name)}${b.note?`<br><span style="font-size:11.5px;color:var(--tx3);font-weight:600">${esc(b.note)}</span>`:''}</span>

  $$('#libModes [data-lm]').forEach(ch=>ch.onclick=()=>{ S.libGroup=ch.dataset.lm; S.libAt=null; save(); renderLibrary(); });

/* Filtering is live and re-renders the list, so the back button and the answers
   toggle are wired ONCE against the header and the list is swapped underneath
   them — the header is the only way out of a group, and rebuilding it on every
   keystroke is how that kind of control quietly stops working. */
function libGroup(b){
  view.innerHTML=`
    <div class="libhead">
      <button class="btn ghost" id="libBack">← All cards</button>
      ${libRepBtn(S.libGroup||'topic',b.id)}
    </div>
    <div class="card" style="padding:16px 18px 14px">
      <h3 style="margin:0">${esc(b.name)}</h3>
      <p style="color:var(--tx2);font-size:13.5px;margin:5px 0 0">${b.cards.length} card${b.cards.length===1?'':'s'}${b.note?` · ${esc(b.note)}`:''}</p>
    </div>
    ${libViewSeg()}
    ${S.libView==='test'?`<div class="libnote">Every card below is drawn by the same code the queue draws it with — the same options, the same blanks, the same mark count. You can answer them; <b>nothing here is recorded against your progress</b>. Use <b>⚡ Rep these in Study</b> for that.</div>`:''}
    <div class="search" style="margin-top:12px"><input id="libq" placeholder="Filter within this group…" autocomplete="off"/></div>
    <div id="liblist"></div>`;
  $('#libBack').onclick=()=>{ S.libAt=null; save(); renderLibrary(); window.scrollTo({top:0}); };
  wireLibView(()=>libGroup(b));
  const list=$('#liblist'), inp=$('#libq');
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();
    const hits=q?b.cards.filter(c=>strip([c.q,c.a,c.text,c.why,c.model].filter(Boolean).join(' ')).toLowerCase().includes(q)):b.cards;
    list.innerHTML=hits.length?hits.map(libCardHTML).join(''):`<div class="empty">Nothing in this group matches "${esc(q)}".</div>`;
    libWireAll(list,hits);
  };
  inp.oninput=draw; draw();
}

function libFlagged(){
  const live=[], stale=[];
  Object.entries(S.flags||{}).sort((a,b)=>(b[1].t||0)-(a[1].t||0)).forEach(([ck,f])=>{
    const c=allCards().find(x=>x.key===ck);
    (c?live:stale).push({ck,f,c});
  });
  view.innerHTML=`
    <div class="libhead"><button class="btn ghost" id="libBack">← All cards</button>${live.length?libRepBtn('_x','_flagged'):''}</div>
    <div class="card">
      <h3>⚑ Flagged cards</h3>
      <p style="color:var(--tx2);font-size:14px;line-height:1.6;margin:2px 0 10px">${
        live.length+stale.length
          ? `${live.length+stale.length} card${live.length+stale.length===1?'':'s'} you have marked as wrong or unclear. They live on this device — send them to whoever maintains this pack and they can be fixed at the source.`
          : 'Nothing flagged yet. Hit ⚑ Flag on any card whose question or answer looks wrong.'}</p>
      ${live.length+stale.length?`<div class="btnrow">
        <button class="btn primary" id="flagCopy">Copy them</button>
        <button class="btn ghost" id="flagDl">Download as a file</button>

      <p style="color:var(--tx2);font-size:13.5px;line-height:1.6;margin:2px 0 10px">The card you flagged is no longer in the pack in that exact wording, which usually means it has been rewritten — quite possibly because of the flag. They are kept here so nothing disappears silently.</p>
      ${stale.map(x=>`<div class="auditrow"><span class="n">⚑</span><span><b>${esc(REASONLAB(x.f.r))}</b><br>
        <span style="color:var(--tx3);font-size:12.5px">${esc((x.f.q||'').slice(0,160))}</span>
        ${x.f.note?`<br><span style="color:var(--tx3);font-size:12.5px">“${esc(x.f.note)}”</span>`:''}
        <br><button class="chip" data-fdrop="${x.ck}" style="margin-top:6px">Remove this flag</button></span></div>`).join('')}
    </div>`:''}
