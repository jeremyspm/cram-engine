     ciliated one, "Glomerular" sits inside "Juxta glomerular". Six cards in the pack
     did exactly this, and every one of them would have marked the opposite of the right
     answer correct. Typing an option the card offers and calls wrong is a miss. */
  if(wforms.includes(t)&&!forms.includes(t)) return 'miss';
  if(forms.includes(t)) return 'hit';
  /* Containment, and only for multi-word keys — a one-word key inside a longer answer
     is not evidence, since "veins" sits inside "veins and arteries". Even then it is
     refused when a DISTRACTOR is the better containment match, which is the same
     negation trap one step along: the reader who writes out the non-ciliated option in
     full should not be credited because the ciliated key is a substring of it. */
  for(const f of forms){
    if(f.split(' ').length<2) continue;
    if(!(t.includes(f)||f.includes(t))) continue;
    if(wforms.some(w=>w!==f&&(t.includes(w)||w.includes(t))&&w.length>=f.length)) continue;
    return 'hit';
  }
  const dists=forms.map(f=>lev(t,f));
  const best=Math.min(...dists);
  const bestForm=forms[dists.indexOf(best)]||forms[0];
  const wrongBest=wforms.reduce((m,w)=>Math.min(m,lev(t,w)),Infinity);
  if(wrongBest<=best) return 'miss';
  return best<=nearTol(bestForm.length)?'near':'miss';
}
/* ---- which cards can honestly be asked without their options ----
   The trap this avoids: a stem written to be read alongside its options — "which of the
   following is NOT part of the conducting zone" — is meaningless as an open question,
   and asking it typed produces a card nobody can answer and everybody blames themselves
   for. Rejecting conservatively costs one card; getting it wrong costs the reader's
   trust in the whole mode. On hs2-test1 this leaves 55 of 157 multichoice.

   True/false options are excluded for a different reason: typing "true" is not recall. */
const OPTDEP=/which of the (following|statements|options)|from the (list|options)|select (all|the)|choose (the|from)|listed (above|below)|(shown|given) below/i;
const NEGSTEM=/\b(not|except|incorrect|least)\b/i;
const plainQ=q=>{ const s=String(q||'').replace(/<[^>]*>/g,' '); return !OPTDEP.test(s)&&!NEGSTEM.test(s); };
const shortAns=s=>{ const n=normAns(s); return !!n && n.split(' ').length<=3 && !/^(true|false)$/.test(n); };
/* An mcq is typeable when its stem stands alone and its answer is a short term. */
function typedMCQ(c){
  if(c.type!=='mcq') return null;
  const opts=c.options||[];
  if(opts.length<2) return null;
  const i=typeof c.correct==='number'?c.correct:-1;
  if(i<0||opts[i]==null) return null;
  if(!plainQ(c.q)||!shortAns(opts[i])) return null;
  return {answer:opts[i],wrongs:opts.filter((_,j)=>j!==i)};
}
/* A cloze is a fill-in-the-blank already — the engine just renders dropdowns over it,
   which hands the reader the answer. Typed, it becomes the thing it always was.
   ALL-OR-NOTHING per card: a card with one long blank among short ones would deal half
   typed and half dropdown, which reads as a bug. Whole card or nothing. */
function typedCloze(c){
  if(c.type!=='cloze') return null;
  const bs=c.blanks||[];
  if(!bs.length) return null;
  const out=[];
  for(const b of bs){
    const o=b.options||[], i=typeof b.correct==='number'?b.correct:-1;
    if(i<0||o[i]==null||!shortAns(o[i])) return null;
    out.push({answer:o[i],wrongs:o.filter((_,j)=>j!==i)});
  }
  return out;
}
const typedPlan=c=>{ const m=typedMCQ(c); if(m) return {kind:'mcq',slots:[m]};
                     const z=typedCloze(c); return z?{kind:'cloze',slots:z}:null; };
/* Bookkeeping for typed attempts. Deliberately its OWN store: `S.mcq` is what the
   Progress projection reads to weight the paper, and it must keep meaning "marks scored
   on this card". Typing is a study mode, not a different score — so the mark recorded
   for a card is whatever the card is finally worth, exactly as before, and the typed
   attempt is recorded here beside it. Nothing downstream shifts. */
function typedLog(key,verdict){
  const t=S.typed[key]||{a:0,c:0,n:0};
  t.a++; if(verdict==='hit') t.c++; else if(verdict==='near') t.n++;
  S.typed[key]=t; save();
}
function logOverride(key,typed,expected){
  S.ovr.push({k:key,t:String(typed).slice(0,80),e:String(expected).slice(0,80),ts:Date.now()});
  if(S.ovr.length>200) S.ovr=S.ovr.slice(-200);   // a log, not a leak
  save();
}

/* ═══════════════ THE CRAM SESSION ═════════════════════════════════════════════
   A session is NOT a new queue. It is the deck the Study view already builds — same
   cards, same ranking, the lecturer's own questions and the never-practised focus
   points still first — with a fence around it at a finishable number.

   That is the entire idea, and it is why this is ~100 lines rather than a scheduler.
   The thing that makes a 345-card pack frightening is not 345 cards, it is an
   unbounded queue with a debt number printed on it. Shrinking the pack does not fix
   that; a 60-card pack with a growing due count produces the same dread. So: no due
   count anywhere on this view, a set you can see the end of, and a real ending.

   What this view must never do is imply the set IS the pack. It says what it is. */
const SESSION_N=()=>Math.max(4,((PACK.session||{}).n)||12);
/* Aim for one typed card in every N dealt. Measured, not guessed: on hs2-test1, 69 of
   the 344 dealable cards can be asked typed, but only ONE of them lands in the first
   twelve — `cardRank` leads with weak rails and flashcards by design, and neither can
   be typed. A mode whose whole argument is "producing it beats recognising it" cannot
   show the reader one typed card per sitting.

   So the session pulls the next typeable card forward when it is due one. It reorders,
   it never filters: nothing is added to the deck, nothing is dropped from it, and every
   card still appears exactly once per pass. It mutates the SHARED deck — the same one
   Study deals from — which is deliberate rather than sloppy: two decks would need two
   requeue paths and could disagree about what the reader had already seen. The visible
   effect on Study is that a multichoice card may arrive a few places earlier than it
   otherwise would, which breaks none of the guarantees the door note makes. */
const CRAM_TYPED_EVERY=()=>{ const v=(PACK.session||{}).typedEvery; return v===0?0:(v||3); };
const today=()=>new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD, local
function sessState(){
  const s=S.sess;
  if(s.d!==today()){ s.d=today(); s.n=0; s.goal=0; s.base=0; save(); }
  if(s.base==null) s.base=0;      // a blob saved before sets were counted from a baseline
  return s;
}
/* A set is never longer than the pool it is drawn from. Without this, a small pack — or
   a reader who has narrowed the queue to eleven cards — is promised twelve, and the deck
   silently rebuilds and starts repeating cards to make the number up. Promising more
   distinct cards than exist is the one lie this view cannot afford, since the number IS
   the feature.

   `base` is where the CURRENT set started, and it is what the bar counts from. Without
   it the counter accumulated across the day: a reader who took a fourth set was looking
   at "48 of 60" over sixty wrapped pips, which is a debt number over two rows — the
   precise thing this view exists to keep off the screen. The day's total is still kept
   (`n`) and still reported, but on the ending, where it reads as something done rather
   than something owed. */
function sessStart(){
  const s=sessState();
  s.base=s.n;
  s.goal=s.n+Math.min(SESSION_N(),Math.max(1,deckSource(ALLTYPES).length));
  save();
}
const sessLive=()=>{ const s=sessState(); return s.goal>s.n; };
/* The button that starts one. Rendered on Study and the Brief — the two views a reader
   actually lands on — and it is the loudest thing on either of them by design. */
function cramCTA(){
  const s=sessState(), n=SESSION_N();
  const live=s.goal>s.n, left=s.goal-s.n;
  return `<button class="bigcram" id="goCram">${
    live?`⚡ CARRY ON CRAMMING<small>${left} card${left===1?'':'s'} left in this set</small>`
        :`⚡ HELP ME CRAM<small>${n} cards, about ${Math.round(n*0.6)} minutes — then you are done</small>`}</button>`;
}
function wireCramCTA(){
  const b=$('#goCram'); if(!b||!b.addEventListener) return;
  b.onclick=()=>{
    /* Retire the first-run panel on the way in. It sits above the view and is six lines
       tall, so on a 390px phone the card a reader just asked for starts below the fold —
       they tap the big button and land on the thing they tapped, pushed off screen.
       ACTING on the panel's own suggestion is a stronger "got it" than tapping Got it,
       and every fact in it is still reachable from Progress and Sources. */
    if(!S.onboarded){ S.onboarded=true; save(); renderOnboard(); }
    if(!sessLive()) sessStart();
    nav('cram'); window.scrollTo({top:0});
  };
}
function pipsHTML(done,goal){
  let h='';
  for(let i=0;i<goal;i++) h+=`<i class="${i<done?'on':i===done?'now':''}"></i>`;
  return `<div class="pips">${h}</div>`;
}
function sessBar(){
  const s=sessState(), done=s.n-s.base, total=s.goal-s.base;
  return `<div class="sessbar"><b>${done} of ${total}</b>${pipsHTML(done,total)}
    <button class="sx" id="sessOut">leave</button></div>`;
}
/* Counting a card as done is the session's ONLY job beyond dealing it, and it is
   deliberately generous: an item counts when the reader has finished with it, whether
   they got it right or not. Counting only correct answers turns a 12-card set into an
   unbounded one for exactly the reader who most needs it to end. */
function sessDone(){ const s=sessState(); s.n++; save(); }
/* Deal the next card, pulling a typeable one forward when the session is due one.
   Costs a scan of the remaining deck only on the slots that want a typed card. */
function cramDeal(){
  const every=CRAM_TYPED_EVERY(), s=sessState();
  if(every>0 && (s.n%every)===0){
    const d=ensureDeck(ALLTYPES);
    if(d.i<d.cards.length && !typedPlan(d.cards[d.i])){
      for(let j=d.i+1;j<d.cards.length;j++){
        if(typedPlan(d.cards[j])){ const [c]=d.cards.splice(j,1); d.cards.splice(d.i,0,c); break; }
      }
    }
  }
  return nextCard(ALLTYPES);
}
function renderCram(){
  const s=sessState();
  /* The empty check comes BEFORE the finished check. A reader who has narrowed the queue
     to nothing has a goal of n and would otherwise be congratulated on finishing a set
     that was never dealt — "Done — 0 cards", with no hint that a filter did it. */
  if(!deckSource(ALLTYPES).length){
    view.innerHTML=`<div class="empty">${filtOn()
      ? `Nothing matches the filters you have on. <button class="btn ghost" data-fx="clear" style="margin-left:6px">Clear them</button>`
      : 'No cards in this pack yet.'}</div>`;
    return;
  }
  if(!s.goal){ sessStart(); }
  if(s.n>=s.goal) return cramFinished();
  CUR=cramDeal();
  if(!CUR){ view.innerHTML=`<div class="empty">No cards here yet.</div>`; return; }
  const c=CUR, bar=sessBar(), head=cardHeadHTML(c), plan=typedPlan(c);
  if(plan)                 cramTyped(bar,head,c,plan);
  else if(c.type==='rail') studyRail(bar,head,c);
  else if(c.type==='flash')studyFlash(bar,head,c);
  else if(c.type==='saq')  studyWritten(bar,head,c);
  else                     studyAuto(bar,head,c,cardMarks(c));
  wireSessBar();
}
/* "leave" goes to the BRIEF, not to Study. Study is the unbounded queue with the whole
   card count printed across the top of it — the exact screen a bounded session exists to
   keep a nervous reader away from — so exiting into it undoes the point at the one moment
   the reader has already decided they have had enough. The Brief is calm, and it carries
   the CARRY ON CRAMMING button at the top, so the way back is the first thing on it. */
function wireSessBar(){
  setTimeout(()=>{
    const b=$('#sessOut');
    if(b&&b.addEventListener) b.onclick=()=>nav(HASBRIEF()?'brief':'study');
  },0);
}
/* The end of a set. It has to do two things at once: stop, and not imply that stopping
   means finished. Both are said plainly — the tally is what happened, the line under it
   is what is still there. No projection, no percentage, no "you are 34% ready": this
   view has no business estimating a mark, and the Progress tab already does the honest
   version of that. */
function cramFinished(){
  const s=sessState(), dl=(typeof daysLeft==='function')?daysLeft():null;
  const n=SESSION_N();
  /* A zero tile is a worse report than no tile: a reader whose set happened to contain no
     typeable card reads "0 terms typed" as a thing they failed to do. */
  const typedN=Object.keys(S.typed).length;
  /* The heading counts the SET just finished; the tally counts the day. Both were `s.n`
     before, so a second set announced "Done — 24 cards" for twelve cards of work. */
  const set=Math.max(0,s.goal-s.base);
  view.innerHTML=`<div class="sessdone">
    <h3>Done — ${set} card${set===1?'':'s'}.</h3>
    <p>That is the set. ${dl!=null&&dl>0?`<b>${dl} day${dl===1?'':'s'}</b> until the test — one set a day from here is ${n*dl} more reps.`:''}</p>
    <div class="tally">
      <div><b>${s.n}</b><span>today</span></div>
      ${typedN?`<div><b>${typedN}</b><span>terms typed</span></div>`:''}
    </div>
    <p style="margin-top:16px">The rest of the pack has not gone anywhere — <b>Study</b>
      deals from it without a limit, and <b>All cards</b> shows every one of them.</p>
    <div class="btnrow">
      <button class="btn primary" id="cramMore">Another ${n}</button>
      <button class="btn ghost" id="cramStop">I'm done for now</button>
    </div></div>`;
  setTimeout(()=>{
    const m=$('#cramMore'), st=$('#cramStop');
    if(m&&m.addEventListener) m.onclick=()=>{ sessStart(); renderCram(); window.scrollTo({top:0}); };
    if(st&&st.addEventListener) st.onclick=()=>nav('stats');
  },0);
}

/* ---- the typed card: produce it, then meet it the way the paper asks it ----
   TWO STAGES, and the second is not a consolation prize. Stage one asks for the term
   with no options on screen. Miss it — or ask to see them — and the SAME card re-deals
   as the multichoice/dropdown it has always been, which is the format the real paper
   uses. So a miss converts into a rep of the examinable form instead of a dead end,
   and the lazy path (tap straight through to the options every time) still trains the
   right thing. Nobody hits a wall.

   Marks are recorded by the ORIGINAL runner in stage two, untouched. A typed hit
   records the card's full marks through the same `markAuto` path — see cramCredit —
   so `S.mcq` keeps meaning exactly what it meant before this view existed. */
function cramTyped(bar,head,c,plan){
  const multi=plan.slots.length>1;
  const fields=plan.slots.map((s,i)=>`<div>${multi?`<label>Blank ${i+1}</label>`:''}
      <input class="tin" id="tin${i}" autocomplete="off" autocapitalize="off" autocorrect="off"
        spellcheck="false" enterkeyhint="go" aria-label="${multi?`Blank ${i+1}`:'Your answer'}"
        placeholder="${multi?'…':'Type the answer'}"/></div>`).join('');
  /* THE FIRST ONE OF THESE A READER EVER MEETS needs a different sentence. Typed recall
     is the only place in the tool that asks you to produce something with nothing on
     screen to lean on, and a cold reader's honest reaction to a blank box is that they
     are about to be caught out. The thing that defuses it is not encouragement, it is
     the mechanic: you cannot get stuck, because a miss hands you the multichoice. Said
     once, on the first card, and never again — `S.typed` empty is the test, so no new
     state and no flag to reset. */
  const firstEver=!Object.keys(S.typed).length;
  view.innerHTML=bar+`<div class="card">${head}
    ${plan.kind==='cloze'&&c.text?`<div class="txt" style="margin-top:6px">${clozeStemHTML(c)}</div>`:''}
    <div class="tblanks" id="tblanks">${fields}</div>
    <div class="tinhint">${firstEver
      ? `Type it from memory — nothing is on screen to pick from, which is the point. Spelling is marked kindly, and if you miss it the multichoice version comes straight up, so you cannot get stuck.`
      : `Type it from memory — spelling is marked kindly. No options yet.`}</div>
    <div id="tfb"></div>
    <div class="btnrow">
      <button class="btn primary" id="tcheck">Check ↵</button>
      <button class="btn ghost" id="tskip">Show me the options</button>
    </div></div>`;
  const inputs=plan.slots.map((_,i)=>$('#tin'+i)).filter(x=>x&&x.classList);
  if(inputs[0]&&inputs[0].focus) inputs[0].focus();
  /* Falls through to the ordinary runner, which owns marking from here. */
  const toOptions=(note)=>{
    const G=bar+(note?`<div class="tverdict miss">${note}</div>`:'');
    studyAuto(G,head,c,cardMarks(c));
    wireSessBar();
  };
  const check=()=>{
    const verdicts=plan.slots.map((s,i)=>matchAnswer(inputs[i]?inputs[i].value:'',s.answer,s.wrongs));
    verdicts.forEach((v,i)=>{ if(inputs[i]) inputs[i].className='tin '+v; });
    plan.slots.forEach((s,i)=>typedLog(c.key+'#'+i,verdicts[i]));
    const worst=verdicts.includes('miss')?'miss':verdicts.includes('near')?'near':'hit';
    if(worst==='miss'){
      const missed=plan.slots.filter((_,i)=>verdicts[i]==='miss').length;
      $('#tfb').innerHTML=`<div class="tverdict miss">Not quite${
        multi?` — ${missed} of ${plan.slots.length} off`:''}. Here it is the way the paper asks it.</div>
        <button class="tovr" id="tovr">I think I was right — count it</button>`;
      const ov=$('#tovr');
      if(ov&&ov.addEventListener) ov.onclick=()=>{
        plan.slots.forEach((s,i)=>{ if(verdicts[i]==='miss') logOverride(c.key+'#'+i,inputs[i]?inputs[i].value:'',s.answer); });
        cramCredit(c,'near');
      };
      const btn=$('#tcheck'); if(btn&&btn.classList) btn.textContent='Show the options ↵';
      if(btn&&btn.addEventListener) btn.onclick=()=>toOptions('You typed it before seeing these.');
      const sk=$('#tskip'); if(sk&&sk.remove) sk.remove();
      return;
    }
    const shown=plan.slots.map(s=>`<b>${esc(String(s.answer).replace(/<[^>]*>/g,''))}</b>`).join(' · ');
    $('#tfb').innerHTML=`<div class="tverdict ${worst}">${
      worst==='hit'?`✅ Yes — ${shown}. You produced that from memory, which is the hard version.`
                   :`➖ Right idea — the spelling is ${shown}.`}</div>`;
    cramCredit(c,worst);
  };
  const finish=()=>{ sessDone(); renderCram(); window.scrollTo({top:0}); };
  /* A typed hit still has to record the card's marks, or a card answered the hard way
     would look unattempted to Progress and to cardWeak(). It records the SAME full
     marks the runner would have recorded for a correct answer — no bonus, no penalty.
     A near-miss is credited in full too and re-queued, because the reader knew it and
     the spelling is worth meeting again inside the sitting. */
  function cramCredit(card,verdict){
    const tot=cardMarks(card), m=S.mcq[card.key]||{a:0,c:0};
    m.a++; m.c++; m.g=(m.g||0)+tot; m.t=(m.t||0)+tot; S.mcq[card.key]=m; save();
    lockMark(card.key,true);           // typing it from memory is the strongest evidence there is
    if(verdict==='near') requeue(ALLTYPES,card,10);
    $('#tfb').innerHTML+=srcHTML(card);
    const row=$('.card .btnrow');
    if(row&&row.innerHTML!==undefined) row.innerHTML=`<button class="btn primary" id="tnext">Next ↵</button>`;
    const nx=$('#tnext');
    if(nx&&nx.addEventListener) nx.onclick=finish;
    document.onkeydown=e=>{ if(VIEW==='cram'&&e.key==='Enter'&&$('#tnext')) finish(); };
  }
  const ck=$('#tcheck'), sk=$('#tskip');
  if(ck&&ck.addEventListener) ck.onclick=check;
  if(sk&&sk.addEventListener) sk.onclick=()=>toOptions('You asked for the options — no penalty, this is the format the paper uses.');
  document.onkeydown=e=>{
    if(VIEW!=='cram'||e.key!=='Enter') return;
    if($('#tnext')) finish(); else if($('#tcheck')) $('#tcheck').click();
  };
}
/* The cloze passage with its blanks left as blanks. `runnerHTML` renders dropdowns into
   the same slots; here they stay holes, because handing over the options is the one
   thing this stage must not do. */
function clozeStemHTML(c){
  return String(c.text||'').replace(/\[\[(\d+)\]\]/g,(_,n)=>`<b>&nbsp;____${n}____&nbsp;</b>`);
}

/* ---- Mock test: REMOVED ----
   There was a full practice paper here — timed, drawn to the real paper's question
   mix, self-marked, with a score history on the Progress view. It is gone deliberately.

   It marked against exam.pass, a number this course does not publish, and dressed a
   sample of the same cards the queue deals as a prediction of a sitting it cannot
   model. What it actually measured was how well you did on twenty cards you had
   already met, reported as a percentage that looked official. Repetition plus an
   honest Progress view does the same job without the theatre.

   Kept, because the real paper still exists and the reader still has to plan for it:
   exam.date drives the countdown; exam.auto / exam.saq / exam.minutes describe the
   sitting in the onboarding; and paperWeights still weights the Progress projection
   the way the real paper weights its marks. That projection reads S.mcq and S.saq —
   study state — so it never depended on this view at all. */

/* ---- Search ---- */
function renderSearch(){
  view.innerHTML=`<div class="search"><input id="sq" placeholder="Search every card and glossary term…" autocomplete="off"/></div><div id="sres"></div>`;
  const box=$('#sres'), inp=$('#sq'); inp.focus();
  const run=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ box.innerHTML=`<div class="empty">Type at least 2 characters.</div>`; return; }
    const hits=[];
    PACK.cards.forEach(c=>{
      const bits=[c.q,c.name,c.a,c.text,c.why,c.model,...(c.beads||[]),...(c.verbs||[])]
        .concat(c.points||[],c.options||[],c.steps||[],
                (c.statements||[]).map(s=>s.s),
                [].concat(...(c.pairs||[])),
                [].concat(...(c.blanks||[]).map(b=>b.options)));
      if(!bits.filter(Boolean).map(strip).join(' ').toLowerCase().includes(q)) return;
      /* This switch used to live here in its own, slightly different copy — a cloze
         hit listed its blanks as "1. x · 2. y" while nothing showed the sentence
         they belong to. One renderer now, shared with All cards. */
      const a=answerHTML(c)+(c.why?`<br/>💡 ${c.why}`:'');
      hits.push({t:`${topicName(c.topic)} · ${(TYPELABEL[c.type]||c.type).toUpperCase()}`, q:c.q, a});
    });
    (PACK.glossary||[]).forEach(g=>{ if((g.term+' '+g.def).toLowerCase().includes(q)) hits.push({t:'📖 Glossary', q:`<b>${esc(g.term)}</b>`, a:esc(g.def)}); });
    box.innerHTML = hits.length ? hits.slice(0,40).map(h=>`<div class="sres"><div class="st">${h.t}</div><div>${h.q}</div><div class="sa">${h.a}</div></div>`).join('')
      : `<div class="empty">No matches for "${esc(q)}".</div>`;
  };
  inp.oninput=run; run();
}

/* ---- Stats ---- */
/* marks-based accuracy across the auto-marked cards in a list; null = untried */
function autoAcc(cards){
  let g=0,t=0,a=0;
  cards.filter(isAuto).forEach(c=>{ const m=S.mcq[c.key]; if(!m) return;
    a+=m.a; g+=(m.g!=null?m.g:m.c); t+=(m.t!=null?m.t:m.a); });   // legacy records fall back to c/a
  return t?{pct:Math.round(g/t*100),tries:a}:null;
}
/* ---- readiness, in the only unit that matters ---------------------------------
   What this replaces, and why it is not a rename. Progress used to report "cards in
   box 3+", "drill accuracy 62%" and "last exam 71%". A Leitner box is an internal
   detail of the scheduler, and none of the three answers the question the reader
   actually has, which is: *am I going to pass, and where do the next forty minutes
   go?* Relabelling "box 3+" as "Mastered" would have produced a nicer-sounding number
   that still answered the wrong question.

   So it is a mark projection, built only from questions actually attempted — nothing
   is assumed about material never touched — with the two halves weighted by their
   real share of the paper, taken from the pack's own declared composition. Per the
   self-explaining-UI rule it says what it is standing on, and below a usable sample
   it refuses to show a number at all rather than dress a guess up as a prediction. */
function paperWeights(){
  const cfg=Object.assign({auto:10,saq:2,pass:80},PACK.exam||{});
  if(cfg.mcq!=null&&cfg.auto==null) cfg.auto=cfg.mcq;         // legacy packs
  const mean=t=>{ const cs=PACK.cards.filter(c=>c.type===t);
    return cs.length?cs.reduce((a,c)=>a+cardMarks(c),0)/cs.length:0; };
  let autoM=0;
  if(cfg.mix){ for(const t in cfg.mix) autoM+=cfg.auto*cfg.mix[t]*mean(t); }
  else{ const ms=AUTO.map(mean).filter(Boolean); autoM=cfg.auto*(ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:1); }
  const saqM=cfg.saq*mean('saq'), tot=autoM+saqM;
  return {auto:tot?autoM/tot:1, saq:tot?saqM/tot:0, pass:cfg.pass};
}
function predict(cards){
  const w=paperWeights();
  let ag=0,at=0,sg=0,st=0,na=0,ns=0;
  cards.forEach(c=>{
    if(isAuto(c)){ const m=S.mcq[c.key]; if(m&&(m.t||m.a)){ ag+=(m.g!=null?m.g:m.c); at+=(m.t!=null?m.t:m.a); na++; } }
    else if(c.type==='saq'){ const m=S.saq[c.key]; if(m&&m.t){ sg+=m.g; st+=m.t; ns++; } }
  });
  const parts=[];
  if(at) parts.push([w.auto, ag/at]);
  if(st) parts.push([w.saq,  sg/st]);
  const wsum=parts.reduce((a,p)=>a+p[0],0);
  if(!wsum) return {n:0, pass:w.pass};
  return {pct:Math.round(100*parts.reduce((a,p)=>a+p[0]*p[1],0)/wsum),
          pass:w.pass, n:na+ns, nAuto:na, nSaq:ns,
          /* how much of the paper this projection actually stands on: the marks-share
             of the halves that have any data behind them at all */
          cover:Math.round(100*wsum)};
}
/* Where the next block of time goes. Never-touched focus points sort first — an
   unknown is worth more than a known weakness — and the row says which it is. */
function weakest(k){
  return (PACK.criteria||[]).map(cr=>({cr,n:critCards(cr.id).length,m:critMastery(cr.id)}))
    .filter(x=>x.n).sort((a,b)=>(a.m==null?-1:a.m)-(b.m==null?-1:b.m)).slice(0,k);
}
/* ── THE BLUEPRINT, as a list — inherited from the Brief ──────────────────────
   The one thing the Brief did that nothing else did: every focus point the course
   publishes, in the order it publishes them, so a reader can see the SHAPE of the paper
   rather than infer it from a queue. It belongs at the top of Progress, because that is
   the question it answers — where am I, against what can be asked.

   Three states, and the middle one matters most: LOCKED (answered right twice, an hour
   or more apart), STARTED (some progress, not proven), and untouched. A point with one
   card says so, and a point standing on background reading says that too — a reader
   deciding what to do next needs to know which of these is a real gap in the course and
   which is a real gap in them. */
/* ONE RENDERER, TWO CALLERS — Progress and the expanded Spine Bar. Split out when the
   bar learned to expand in place: two hand-written copies of these rows would have
   drifted the moment either grew a state, and the whole point of the bar is that it
   agrees with the list it opens into. `bpmark` carries the SAME four states as a
   segment, including HALF, which the Progress list used to fold into "started". */
function blueprintRowsHTML(){
  const crits=PACK.criteria||[], thin=new Map((PACK.thin||[]).map(t=>[t.id,t]));
  const MARK={locked:'✓',half:'◐',seen:'◔',new:'○'};
  return `<div class="bplist">${crits.map(cr=>{
    const cs=critCards(cr.id).filter(inPool);
    const st=pointState(cr.id);
    const sp=(PACK.spine||{})[cr.id], spCard=cs.find(c=>c.key===sp);
    return `<button class="bprow ${st}" data-crit="${cr.id}" title="${esc(cr.name||cr.id)} — ${SEGWORD[st]}">
        <span class="bpmark">${MARK[st]}</span>
        <span class="bptx"><b>${esc(cr.name||cr.id)}</b>
          <span class="bpsub">${cs.length} card${cs.length===1?'':'s'}${
            st==='half'?' · <b>right once</b> — one more, an hour later':''}${
            thin.has(cr.id)?' · thin':''}${
            cr.blind?' · never practised':''}${
            spCard&&spCard.tier!=='verbatim'?' · lead card is background':''}</span></span>
        <span class="bpgo">Drill →</span>
      </button>`;
  }).join('')}</div>`;
}
function blueprintHTML(){
  if(!HASRINGS()) return '';
  const t=spineTally();
  return `<div class="card" style="margin-bottom:14px">
      <h3>The blueprint — ${t.locked} of ${t.tot} locked${t.half?`, ${t.half} half-way`:''}</h3>
      <p class="ringsub" style="margin:2px 0 12px">Every focus point the course says the test can ask about, in the order it publishes them. <b>Locked</b> means you answered its lead card right twice, in sittings an hour or more apart.</p>
      ${blueprintRowsHTML()}
    </div>`;
}
function wireBlueprint(){
  $$('.bprow').forEach(b=>b.onclick=()=>{
    /* Drilling one point uses the scope the tool already has, rather than a second
       mechanism that would need its own chips, its own count and its own way out. */
    S.filters=FILT0(); S.filters.crits=[b.dataset.crit]; S.ring='point'; save();
    nav('study'); window.scrollTo({top:0});
  });
}
function renderStats(){
  /* Against the pool being studied, for the same reason topicReady is: counting the
     demoted background cards would report "6 of 286 recalled" at a reader who has
     been through most of what the tool actually deals them. The stat row says which
     pool it is counting. */
  const all=allCards().filter(inPool);
  const recall=all.filter(isRecall);
  const solid=recall.filter(c=>srsGet(c.key).box>=2).length;
  const p=predict(all);
  /* Two thresholds, both deliberately conservative. Under 20 attempts there is no
     number — a confident 58% built on nine questions is worse than saying nothing.
     Under 60, or with only one half of the paper attempted, it shows but says plainly
     that it is a guess. */
  const solidEnough = p.n>=60 && p.nAuto && p.nSaq;
  const showable    = p.n>=20;
  const hero = !showable
    ? `<div class="result-hero"><div class="big" style="font-size:26px">Not enough yet</div>
        <div class="sub">Answer <b>${20-p.n}</b> more question${20-p.n===1?'':'s'} in Study and a projected mark appears here. Guessing from ${p.n||'no'} answer${p.n===1?'':'s'} would just be making something up.</div></div>`
    : `<div class="result-hero ${p.pct>=p.pass?'pass':'fail'}"><div class="big">${p.pct}%</div>
        <div class="sub">${solidEnough?'Projected mark':'Rough guess at your mark'} · ${passPhrase()} —
          ${p.pct>=p.pass?'<b>you are over the line</b> on what you have done so far':'<b>below the line</b> on what you have done so far'}</div></div>
       ${PASSTARGET()?`<div class="doornote" style="border-left-color:var(--line2)">${passCaveat()}</div>`:''}
       <div class="doornote">${solidEnough
          ? `Worked out from the <b>${p.n}</b> questions you have answered, weighted the way the real paper weights its marks. It assumes the rest of the material goes like the part you have done — so it moves as you cover more ground.`
          : `⚠️ <b>This is a guess, not a prediction.</b> It is standing on <b>${p.n}</b> answered question${p.n===1?'':'s'}${p.nSaq?'':' and no written answers at all'}, which is nowhere near enough to be trusted. Keep going and it becomes real.`}</div>`;

  const weak=weakest(3);
  view.innerHTML=blueprintHTML()+hero+`
    <div class="statgrid">
      <div class="stat"><div class="n">${solid}<span style="font-size:15px;color:var(--tx3)">/${recall.length}</span></div><div class="l">recalled right, twice over</div></div>
      <div class="stat"><div class="n">${p.nAuto?p.nAuto:'—'}</div><div class="l">${p.nAuto?'questions drilled':'nothing drilled yet'}</div></div>
      <!-- Was "last mock test". A one-off score on a sample of cards you had already
           met told you less than the plainest fact in the tool: how much of the deck
           you have still never laid eyes on. That is the number that decides whether
           tonight is revision or first contact. -->
      <div class="stat"><div class="n">${all.filter(c=>!srsGet(c.key).seen).length}</div><div class="l">never seen yet</div></div>
    </div>
    ${weak.length?`<h2 class="sec">Where the next half hour goes</h2>
      ${weak.map(x=>`<div class="catstat"><div class="top"><b>${esc(x.cr.name||x.cr.id)}</b><span class="m">${
          x.m==null?'not started':Math.round(x.m*100)+'%'}</span></div>
        <div class="bar"><i style="width:${x.m==null?0:Math.round(x.m*100)}%"></i></div>
        <div class="sub">${x.m==null?'You have not answered anything on this one yet.':'Your weakest so far.'}
          <button class="wlink" style="margin-top:6px" data-brief="${x.cr.id}">→ Read it in the Brief</button></div></div>`).join('')}`:''}
    ${hasBG()&&!S.bg?`<div class="doornote" style="border-left-color:var(--line2)">Counting the <b>${all.length}</b> cards you are studying. The rest of the pack is not in these numbers — add it in <b>Study</b> and they recount.</div>`:''}
    <h2 class="sec">Topics</h2>
    ${PACK.topics.map(t=>{
      const cs=all.filter(c=>c.topic===t.id);
      const recTot=cs.filter(isRecall).length;
      const rec=cs.filter(c=>isRecall(c)&&srsGet(c.key).box>=2).length;
      const a=autoAcc(cs);
      const pct=recTot?Math.round(rec/recTot*100):0;
      return `<div class="catstat"><div class="top">${t.icon} ${esc(t.name)}<span class="m">${cs.length} cards</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="sub">${recTot?`${rec} of ${recTot} recalled right twice over`:'nothing to recall here'}${a?` · ${a.pct}% of drill marks (${a.tries} tries)`:' · not drilled yet'}</div></div>`;
    }).join('')}
    <div class="btnrow" style="margin-top:22px"><button class="btn ghost danger" id="reset">Reset all progress</button></div>`;
  $('#reset').onclick=()=>{ if(confirm('Wipe all progress for this pack?')){ localStorage.removeItem(KEY); S=load(); save(); renderStats(); } };
  wireBlueprint();
}

if((PACK.cards||[]).some(c=>c.tier)) $('#navAudit').hidden=false;
if(HASBRIEF()&&!HASRINGS()) $('#navBrief').hidden=false;
/* ── THREE TABS, NOT SEVEN — for a ringed pack ────────────────────────────────
   Study, Progress, Search. The Brief goes because the rings replaced the thing it was
   for: it was the cold-start landing page, it was a third empty (derived from prose
   cards, which a third of the focus points do not have), and it competed with the
   loudest control on its own screen. What it did that nothing else did — show the
   blueprint as a LIST, all of it, in the order the course publishes it — is not lost;
   it is now the top of Progress, with the lock state against each point.

   All cards and Sources stay, behind the ···, and that is a deliberate deviation from
   §5 of the rebuild spec, which lists All cards among the deletions. It is the only
   surface where a reader can SEE a card's options without being tested on them, it
   carries the ⚑ flag export that has already turned nine reader reports into fixes, and
   this template is copied by other tools that have no rings at all. Out of the tab bar
   is enough to buy the calm §5 is asking for; deleting the code is not the same thing
   and costs more than it saves. */
if(HASRINGS()){
  $('#navCram').hidden=true;
  $('#navSearch').hidden=false;
  $('#navSearch2').hidden=true;
}
/* A reader with no history lands in the Brief. Learn would open by asking them to
   retrieve a fact they have not encoded yet, which is the slowest way to start and
   the most discouraging. Once there is any progress, Learn is the right landing. */
/* ONE-TIME REPAIR, and only for a scope that came from before the filters existed.

   The old code let a topic and a focus point be set at once and quietly ignored the
   topic when the two held nothing in common — `critScope` fell back to the whole pack
   for that focus point. Carried across literally, that saved state becomes an
   intersection of two filters that is genuinely empty, so a reader who left the tool
   mid-drill would come back after the update to "Nothing matches", on a combination
   they never made and cannot remember making.

   So the migrated case reproduces exactly what it used to do — the focus point wins,
   the topic is dropped — and the pill row shows the result. It is gated on
   MIGRATED_SCOPE and not on "the queue is empty", because widening a scope the reader
   built themselves, silently, is the behaviour this whole surface exists to remove.
   Here rather than in the migration block itself: `deckSource` reaches `cardsOf`,
   which is declared further down and would be in its temporal dead zone up there. */
if(MIGRATED_SCOPE&&S.filters.topics.length&&S.filters.crits.length&&!deckSource(ALLTYPES).length){
  S.filters.topics=[]; save();
}
const coldStart=!Object.keys(S.srs).length&&!Object.keys(S.mcq).length;
renderOnboard();
nav(HASBRIEF()&&!HASRINGS()&&coldStart?'brief':'study');
</script>
<script>
/* ===== STUDY BUS v2 (hub ⚡ engine — see estate STUDY-ENGINE-SPEC.md) =====
   Copy-in block. Active only when the pack declares PACK.studybus; every
   tool made from this template inherits it for free. Bids the pack's due
   flash/saq CARDS onto the bus (the hub plays them in its own player),
   consumes the hub's grade write-back into this pack's SRS, and honours
   ?mode= / ?topic= deep links. */
(function(){
'use strict';
const here=location.origin+location.pathname;

if(PACK.studybus&&PACK.id){
  const APP='cram-'+PACK.id;

  // grades the hub player recorded for this pack since we last ran —
  // apply to our own SRS at the time the recall actually happened
  (function applyBusGrades(){
    const gk='studybus.grades.'+APP;
    let log=null; try{ log=JSON.parse(localStorage.getItem(gk)); }catch(e){}
    try{ localStorage.removeItem(gk); }catch(e){}
    if(!Array.isArray(log)||!log.length) return;
    const known=new Set(PACK.cards.map(c=>ckey(c)));
    log.forEach(function(ev){
      if(!ev||!known.has(ev.card)) return;      // card edited/removed since — drop
      const st=srsGet(ev.card), r=+ev.r||0;
      st.box = r===0?0 : r===1?st.box : Math.min(4, st.box+(r===3?2:1));
      st.due=(+ev.ts||Date.now())+IVL[st.box];
      st.seen++;
      S.srs[ev.card]=st;
    });
    save();
  })();

  const busCards=function(){
    // due first (most overdue leading), whole recall deck as fallback —
    // never let "nothing due" mean "nothing to cram".
    // Only RECALL types go on the bus: the hub's player understands flash/saq.
    const all=cardsOf(RECALL,'all').filter(inPool);
    const now=Date.now();
    const due=all.filter(c=>srsGet(c.key).due<=now);
    return (due.length?due:all).slice()
      .sort((a,b)=>srsGet(a.key).due-srsGet(b.key).due)
      .slice(0,20)
      .map(c=>c.type==='flash'
        ? {id:c.key,type:'flash',q:c.q,a:c.a}
        : {id:c.key,type:'saq',q:c.q,points:c.points,marks:c.marks||c.points.length,model:c.model||''});
  };
  const offers=function(){
    // evPerMin scales with how much of the deck is due — raw memory value
    // only; the hub multiplies in exam weight, urgency and hurdle boosts.
    // `inPool` so the hub's readiness bar counts the same cards the tool deals.
    const all=cardsOf(RECALL,'all').filter(inPool);
    const due=all.filter(c=>srsGet(c.key).due<=Date.now()).length;
    const frac=all.length?due/all.length:1;
    return [{ label:'🧠 '+(PACK.title||'Cram pack'),
      topic:PACK.studybus.topic||null, assess:PACK.studybus.assess||[],
      evPerMin:+(0.15+0.45*frac).toFixed(2),
      kind:'cards', cards:busCards(),
      counts:{due:due,total:all.length} }];
  };
  const pulse=function(){ try{ localStorage.setItem('studybus.pulse.'+APP,
    JSON.stringify({v:2,app:APP,name:PACK.title,url:here,ts:Date.now(),offers:offers()})); }catch(e){} };
  pulse();
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') pulse(); });
  addEventListener('pagehide',pulse);
}

/* deep links: land in the right view/topic */
const q=new URLSearchParams(location.search);
const tp=q.get('topic'), md=q.get('mode'), ty=q.get('type');
/* ?topic= and ?type= both land in the scope object, so a hub link can drop someone
   straight into "just the multichoice on the heart". Each REPLACES that dimension
   rather than adding to it — a link has to mean the same thing every time it is
   opened, whatever the reader happened to have narrowed to last session. */
if(tp&&PACK.topics.some(t=>t.id===tp)){ S.filters.topics=[tp]; save(); }
if(ty){ const ts=ty.split(',').filter(t=>ALLTYPES.includes(t)); if(ts.length){ S.filters.types=ts; save(); } }
/* learn/mcq/saq are kept here on purpose: nav() aliases them onto Study, so a hub
   link or bookmark written before the merge still lands somewhere real. */
if(md&&['brief','cram','study','learn','mcq','saq','cards','search','stats','audit'].includes(md)) nav(md);
else if(tp||ty) nav(VIEW);   // re-render so the scope change shows
})();
</script>
</body>
</html>
