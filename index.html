  $('#libBack').onclick=()=>{ S.libAt=null; save(); renderLibrary(); window.scrollTo({top:0}); };
  wireLibView(libFlagged);
  libWireAll($('#liblist'),live.map(x=>x.c));
  const cp=$('#flagCopy'); if(cp) cp.onclick=()=>copyText(flagsJSON(),cp);
  const dl=$('#flagDl');   if(dl) dl.onclick=()=>downloadText(flagsJSON(),`flags-${PACK.id}.json`);
  $$('[data-fdrop]').forEach(b=>b.onclick=()=>{ delete S.flags[b.dataset.fdrop]; save(); libFlagged(); });
}

/* ---- nav ----
   Three tabs are the tool: read it, practise it, sit it. Search, Progress and Sources
   are things you go and look for rather than things you do, so they live behind the
   ··· — a six-way choice on first contact is a tax paid by every user for three views
   most of them will open twice. */
let VIEW='study', CUR=null;
const view=$('#view');
/* WHICH VIEWS LIVE BEHIND THE ··· — read off the bar, not from a list beside it.
   The list said 'stats' long after Progress was promoted into the main bar, so opening
   Progress unfolded the overflow row for no reason, and a ringed pack that promotes
   Search would have had the same problem the other way. The DOM already knows. */
const SECOND=v=>[...document.querySelectorAll('#nav2 button')].some(b=>b.dataset.v===v&&!b.hidden);
const navBtns=()=>$$('#nav button[data-v], #nav2 button[data-v]');
function showMore(on){
  $('#nav2').classList.toggle('hidden',!on);
  $('#navMore').classList.toggle('on',on);
  $('#navMore').setAttribute('aria-expanded',String(on));
}
const VIEWS={brief:renderBrief,cram:renderCram,study:renderStudy,cards:renderLibrary,search:renderSearch,stats:renderStats,audit:renderAudit};
/* learn / mcq / saq were three tabs before the queues merged. The hub deep-links by
   mode and a reader may have bookmarked one, so they alias onto Study rather than
   landing on a blank view. */
const VIEWALIAS={learn:'study',mcq:'study',saq:'study'};
function nav(v){
  v=VIEWALIAS[v]||v;
  VIEW=v;
  navBtns().forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(SECOND(v)) showMore(true);               // never leave the active tab hidden
  VIEWS[v]();
  /* AFTER the view, not before: the round line under the bar reads `ringNow()`, and a
     view that changes the scope (drilling one point) has to have changed it already. */
  renderSpine();
}
navBtns().forEach(b=>b.onclick=()=>nav(b.dataset.v));
$('#navMore').onclick=()=>showMore($('#nav2').classList.contains('hidden'));

/* ---- first run --------------------------------------------------------------
   There was no onboarding at all: a cold reader met an error banner, eight tabs and
   two unexplained doors. This is ten seconds of plain language and then it is gone
   for good. Every number in it is read off the pack, so a new cram tool inherits it
   without anybody writing copy. */
function renderOnboard(){
  const slot=$('#onboard'); if(!slot) return;
  /* Gated on having CRITERIA, not on having a Brief. It used to be the latter, which
     meant a pack without one lost the exam date, the pass mark and the first-run
     orientation as well — punishing the reader for a property of the pack. */
  if(S.onboarded||!PACK.criteria||!PACK.criteria.length){ slot.innerHTML=''; return; }
  const cfg=Object.assign({auto:0,saq:0,minutes:0,pass:80},PACK.exam||{});
  const nQ=(cfg.auto||0)+(cfg.saq||0), d=examDate(), dl=daysLeft();
  /* COMPLETENESS IS A CLAIM, AND THE PACK HAS TO EARN IT — the engine cannot.
     This line used to read "There are N focus points the course says the test can ask
     you about. This tool has every one of them", with N counted from the pack's OWN
     criteria list. That is a tautology rendered as a guarantee, and on a narrow pack it
     lies: the Module 1 Terminology tool covered 3 of the course's 36 focus points and
     printed "There are 3 focus points … This tool has every one of them." True about
     itself, badly false about the paper. Only a pack that names the blueprint it is
     measured against may claim to cover it — PACK.blueprint.total. Anything else states
     its scope and makes no claim at all, so the failure mode of forgetting the field is
     an understated tool rather than an overstated one. */
  const bp=PACK.blueprint||null, nC=PACK.criteria.length,
        fp=n=>`${n} focus point${n===1?'':'s'}`;
  const cover=bp&&bp.total>nC
      ?`<p>This tool covers <b>${fp(nC)}</b> of the <b>${bp.total}</b> the course lists for this paper — one slice of the test, not the whole of it.</p>`
    :bp&&bp.total===nC
      ?`<p>There are <b>${fp(nC)}</b> the course says the test can ask you about. This tool has every one of them.</p>`
      :`<p>This tool drills <b>${fp(nC)}</b> from the course's assessment criteria.</p>`;
  const when=d?d.toLocaleDateString('en-NZ',{day:'numeric',month:'long'}):null;
  const facts=[cfg.minutes?`${cfg.minutes} minutes`:null,nQ?`${nQ} questions`:null,when?`on ${when}`:null].filter(Boolean).join(', ');
  slot.innerHTML=`<div class="onb">
    <h3>${esc(PACK.title)}</h3>
    <p>${facts?esc(facts.charAt(0).toUpperCase()+facts.slice(1))+'. ':''}${PASSTARGET()?passCaveat():`You need <b>${cfg.pass}%</b> to pass.`}</p>
    ${cover}
    <!-- This used to read "Start by reading the Brief. Then drill." — which stopped being
         true the moment ⚡ HELP ME CRAM became the loudest control on the same screen.
         A first-run panel that recommends one thing while the page shouts another is
         worse than no panel: the reader has to guess which one the tool means. Both are
         named, in the order they should be used, and the cram set is described by what
         it costs, because "12 cards" is the fact that makes it possible to start.
         The Brief half is dropped entirely when there is no Brief — naming a door that
         is not there is how a reader ends up on an empty tab deciding the tool is broken. -->
    ${HASRINGS()
      /* A RINGED PACK HAS ONE WAY IN, and the panel has to say the same thing the
         screen behind it says. There is no Brief to send anyone to and no separate cram
         button to choose between: the deck opens on Ring 0, which is one card per focus
         point and stops when they are locked. Naming a door that is not there is how a
         reader ends up on an empty tab deciding the tool is broken — and that is exactly
         what this paragraph did for one build after the tabs changed. */
      /* Named ROUND 1 rather than "the spine", and the bar it fills is named too. The
         reader is about to dismiss this panel and the words have to survive it — which
         is what the permanent ? and the line under the Spine Bar are for. */
      ?`<p><b>One way in.</b> The queue opens on <b>${ROUNDLAB(0)}</b> — ${esc(RINGS[0].sub)},
         and nothing else until every one is <b>locked</b>: answered right twice, in
         sittings an hour or more apart. About ${Math.round(nC*0.7)} minutes if you know it.</p>
       <p>The bar at the top is one segment per topic. Get one right and its segment
         <b>half-fills</b>; get it right again an hour later and it fills. Tap the bar for
         the full list, or <b>?</b> for what these words mean.</p>`
      :HASBRIEF()
      ?`<p><b>Two ways in.</b> <b>Read the Brief</b> if the lecture has gone fuzzy — it explains
         each focus point in plain prose. <b>⚡ Help me cram</b> if you would rather just start:
         ${SESSION_N()} cards, and it stops.</p>`
      :`<p><b>⚡ Help me cram</b> is the way in: ${SESSION_N()} cards, and it stops.</p>`}
    <button class="btn primary" id="onbGo">Got it${dl!=null&&dl>0?` — ${dl} day${dl===1?'':'s'} to go`:''}</button>
  </div>`;
  $('#onbGo').onclick=()=>{ S.onboarded=true; save(); slot.innerHTML=''; };
}
/* ============================ two doors ============================
   ONE dataset, two ways in. "Get me ready" lets the engine choose the
   queue; "I'll pick" hands the topics back. Neither locks anything, and
   a reduced queue always says so out loud.                            */
function cardWeak(c){
  if(isRecall(c)) return srsGet(c.key).box<=1;
  const m=S.mcq[c.key];
  return (!m||!m.t) ? true : (m.g/m.t)<0.6;      // never drilled counts as weak
}
/* Rank 0 is "highest-value unknown". Two things qualify, not one:
   - a focus point the course lists that no practice test covers, and
   - a question the LECTURER has set before, which is the strongest available
     predictor of what gets asked again.
   Never-practised-only was right when the pack had no captured questions. Once 195
   of the lecturer's own questions were harvested, that alone meant the opening queue
   was 18 cards of unsourced textbook content served ahead of every question actually
   set in the past. */
function cardRank(c,cm){
  const cr=cm[c.crit];
  /* A weak rail ranks with the lecturer's own questions, not behind them.

     It is not one of her questions and does not pretend to be — but ranked on tier
     alone every rail landed in band 1, behind 202 band-0 cards, so the first one
     appeared at position 107 of 300 and a normal session never reached one. A feature
     nobody is dealt is not a feature.

     It also earns the place: a rail is the chain fifteen separate facts hang off, so
     meeting it early is what makes the questions that follow cohere rather than
     arrive as trivia. The stride-merge by topic keeps them from clumping. */
  if(cardWeak(c)&&((cr&&cr.blind)||c.tier==='verbatim'||c.type==='rail')) return 0;
  if(cardWeak(c)) return 1;
  if(isRecall(c)&&srsGet(c.key).due<=Date.now()) return 2;
  return 3;
}

/* ================= the deck =================================================
   Cards are DEALT FROM AN ORDERED DECK, not drawn at random.

   What this replaces, and why. The old queue ranked cards 0-3 and then rendered
   only the single lowest rank present. On this pack that meant a cold user's Learn
   view held 69 of 288 cards and three whole topics — gas exchange, cardiac output,
   terminology — were unreachable, because a card only leaves rank 0 after two
   correct recalls and the pool was sampled at random. 356 of 587 cards were gated.
   On top of that, random-with-replacement needs ~333 draws to show a 69-card pool
   once, and repeats the card you just saw 1 time in 69.

   A deck fixes all of it at once:
     - EVERY card is in the deck. Rank sets ORDER, never membership.
     - No card repeats until the deck is exhausted, so coverage is guaranteed.
     - Topics are interleaved by even stride inside each rank band, so a big topic
       cannot bunch and a small one cannot starve.
     - A card you get wrong is spliced back in a few cards ahead, which is what
       makes it a cram tool rather than a reading order.
   The deck rebuilds and re-ranks when it runs out, or when the door, topic or
   focus scope changes.

   BODY-SYSTEM BLOCKS. Even stride across every topic was right about topic
   starvation and wrong about everything else: on hs2-test1 it dealt a perfect
   round-robin through all twelve topics, so fourteen consecutive cards ran gas
   exchange → terminology → vessels → control of breathing → blood pressure →
   heart anatomy → respiratory anatomy → immunity → … You never stay inside one
   system long enough to build anything, and a cram tool that hops systems every
   card is asking for twelve cold starts instead of one warm run.

   So a pack may declare `systems` — an ordered list — and give each topic a `sys`.
   The deck is then dealt one system at a time in that order, and stride-merging
   happens only among the topics INSIDE a system, where interleaving is right:
   heart anatomy and the cardiac cycle genuinely explain each other. Rank still
   orders cards within a topic, so the lecturer's own questions still lead — they
   now lead within their system rather than globally, which is what the door note
   has to say, and does.

   A pack that declares no systems keeps the old whole-pack stride exactly.      */
/* Even stride: a topic holding n of N cards is dealt every N/n slots, so every
   topic is spread across the whole deck whatever its size, and the largest topic
   cannot bunch at the tail the way plain round-robin leaves it. */
function strideMerge(groups,N){
  const out=[];
  for(const g of groups) g.forEach((c,i)=>out.push({c,pos:(i+0.5)*N/g.length}));
  return out.sort((a,b)=>a.pos-b.pos).map(x=>x.c);
}
function deckSource(types){
  /* One filter pass under both doors. The door decides the ORDER of what is dealt
     and, in "I'll pick", supplies a topic shortcut into the same scope object — it
     no longer owns a filter of its own. Whatever is narrowed stays narrowed when
     you change doors, and says so, rather than silently widening. */
  const all=cardsOf(types,'all').filter(inPool).filter(answerable);

    SPINEHELP=false; S.onboarded=false; save(); renderSpine(); renderOnboard(); window.scrollTo({top:0}); };
  wireBlueprint();
}
/* THE FIRST FIT IS NOT THE LAST WORD, and shipping as if it were is what made the very
   first version of this wrong: renderSpine runs before the layout has settled, measures
   a block narrower than it ends up, picks a shorter name than it needed to — and that
   choice then sticks for the whole session. Live, the lymphatic block settled at 74px
   with LYMPHATIC needing exactly 74, and the bar was showing LYMPH. Under-labelling, not
   clipping, so nothing looked broken; it was just quietly answering the reader's question
   with less than it had room for.

   So watch the row instead of guessing when it is final. A ResizeObserver fires on every
   width change from any cause — first layout, a scrollbar appearing, a phone rotating, a
   container changing — which is the whole set of things that can change the answer. It
   cannot loop: the labels have min-width:0 and clip, so writing text into them never
   changes the row's own width.

   Re-fits rather than re-renders, so a reader mid-answer keeps their card. Guarded on
   both globals because the build runs this script against a stub that has neither. */
function observeSpineLabels(){
  /* The next frame, unconditionally. This is the one that fixes the first-render case:
     by then the column has its real width and the scrollbar has decided whether it
     exists. Costs one no-op pass when the first fit was already right. */
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(fitSpineLabels);
  if(typeof ResizeObserver!=='function') return;
  const row=$('#spine .spinelabs'); if(!row||!row.getBoundingClientRect) return;
  if(!observeSpineLabels.ro) observeSpineLabels.ro=new ResizeObserver(()=>fitSpineLabels());
  observeSpineLabels.ro.disconnect();          // the row is replaced on every render
  observeSpineLabels.ro.observe(row);
}
/* AND the window events, whether or not ResizeObserver exists. This was written as an
   `else` to the observer and that was wrong: the preview pane this was verified in
   delivers no ResizeObserver callbacks at all — a fresh probe observer logged zero hits
   across a 343px→1400px change — so the `else` meant nothing re-fitted on resize and the
   bar kept a stale LYMPH at a width with room for LYMPHATIC.

   The lesson is not about that pane. It is that the fit has ONE job and three
   independent chances to do it, all idempotent and all cheap: a stale label is a
   silent wrong answer, and a redundant re-measure costs a few microseconds. */
if(typeof addEventListener==='function'){
  let _fitT=0;
  const refit=()=>{ clearTimeout(_fitT); _fitT=setTimeout(fitSpineLabels,120); };
  addEventListener('resize',refit);
  addEventListener('orientationchange',refit);
  addEventListener('load',fitSpineLabels);     // late images can add a scrollbar
}

/* In memory only — a deck is a sitting, not saved progress. */
const DECK={};
const deckKey=t=>Array.isArray(t)?t.join('+'):t;
/* Any change to the scope must rebuild the deck, or the reader keeps being dealt
   cards from the pool they just narrowed away from. The filters go in whole. */
const deckSig=()=>[S.door,bgOn(),HASRINGS()?ringNow():'',FILTDIMS.map(d=>S.filters[d].join(',')).join(';')].join('|');
/* Split out of nextCard so the cram session can look at the deck it is about to be
   dealt from without consuming a card off it. Same deck, same rebuild rule. */
function ensureDeck(types){
  const k=deckKey(types), sig=deckSig();
  let d=DECK[k];
  if(!d||d.sig!==sig||d.i>=d.cards.length) d=DECK[k]={cards:buildDeck(types),i:0,sig};
  return d;
}
/* A CARD LOCKED DURING THIS SITTING MUST NOT BE DEALT AGAIN, and the deck cannot be
   rebuilt to achieve it: the signature does not change when a card locks, and even if
   it did, rebuilding mid-sitting reshuffles the round-robin and re-deals cards the
   reader has just seen. So the lock is applied at the moment of dealing, and the
   exhausted deck is left to `ensureDeck` to rebuild — which filters the locked ones out
   properly. Without this the end of Ring 0 never arrives: the deck still holds 38 cards
   and the reader is dealt spine cards they have already locked, for ever. */
function nextCard(types){
  const skip=c=>HASRINGS()&&ringNow()!==null&&isLocked(c.key);
  for(let pass=0;pass<3;pass++){                 // deal · rebuild · confirm empty
    const d=ensureDeck(types);
    if(!d.cards.length) return null;
    while(d.i<d.cards.length){ const c=d.cards[d.i++]; if(!skip(c)) return c; }
  }
  return null;
}
/* A missed card comes back inside the same sitting rather than waiting a whole
   pass. Again lands sooner than Hard. */
function requeue(types,card,gap){
  const d=DECK[deckKey(types)];
  if(!d||!card) return;
  d.cards.splice(Math.min(d.i+gap,d.cards.length),0,card);
}
/* Composition of the current deck, for the door note. Reports, never filters.

   `weak` counts only cards the reader has ACTUALLY ATTEMPTED and is scoring badly
   on. cardWeak() deliberately treats never-attempted as weak — that is right for
   ORDERING, since an untouched card is exactly as unproven as a failed one — but it
   is wrong for a sentence. Reported raw it told a reader who had answered nothing
   that 356 cards were ones "you have been getting wrong", which is both false and
   the single most discouraging thing the tool could open with. */
function cardSeen(c){
  if(isRecall(c)) return srsGet(c.key).seen>0;
  const m=S.mcq[c.key];
  return !!(m&&m.t);
}
function deckStats(types){
  const cm={}; (PACK.criteria||[]).forEach(c=>cm[c.id]=c);
  const src=deckSource(types);
  /* Which system blocks this deck ACTUALLY contains. The note names them, and
     `systemBlocks()` is derived from the pack, not the pool — so with background
     reading switched off it would happily announce an order containing a block that
     has no cards left in it. Name what will be dealt. */
  const tops=new Set(src.map(c=>c.topic));
  const blocks=(systemBlocks()||[]).filter(b=>b.id!=='_rest'&&b.topics.some(t=>tops.has(t)));
  return {total:src.length, hot:src.filter(c=>cardRank(c,cm)===0).length,
          weak:src.filter(c=>cardRank(c,cm)===1&&cardSeen(c)).length, blocks};
}
/* per-topic readiness, or null when there is genuinely no data to report */
function topicReady(tid){
  /* Against the pool actually being studied. Counting demoted background cards here
     would report a topic as barely started because of cards the queue never deals. */
  const cs=PACK.cards.map(c=>({...c,key:ckey(c)})).filter(c=>c.topic===tid&&inPool(c));
  const rec=cs.filter(isRecall), acc=autoAcc(cs);
  const seen=rec.filter(c=>srsGet(c.key).seen>0).length;
  if(!seen&&!acc) return null;
  const parts=[];
  if(seen) parts.push(rec.filter(c=>srsGet(c.key).box>=2).length/rec.length);   // same null-is-not-zero rule as critMastery
  if(acc) parts.push(acc.pct/100);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):null;
}
/* The "I'll pick" door's topic chips. MULTI-SELECT now, and writing into the same
   `filters.topics` the panel below edits — one piece of state with two ways to reach
   it, rather than two filters that could disagree. Tapping a second topic adds it
   instead of replacing it, which is what everyone tried to do with the old row. */
function chipRow(cb){
  const anyData=PACK.topics.some(t=>topicReady(t.id)!=null);
  const sel=S.filters.topics;
  /* SCOPED to this row, and it has to be. The old wiring was `$$('.chip')`, which
     was safe when the chips were the only chips on the page — the filter panel now
     renders chips too, and a blanket selector would rebind every one of them to the
     topic handler. `[data-t]` alone is no better: the true/false runner marks its T
     and F buttons `data-t="0"`, so a global sweep would silently replace answering a
     tfset card with switching topics, under the one door where both are on screen.
     Wire what you rendered, from the node you rendered it into. */
  const html=`<div class="chips" id="topicChips"><button class="chip ${sel.length?'':'on'}" data-t="_all">✨ All topics</button>${
    PACK.topics.map(t=>{ const r=topicReady(t.id);
      return `<button class="chip ${sel.includes(t.id)?'on':''}" data-t="${t.id}">${t.icon} ${esc(t.name)}${r!=null?`<span class="pc">${r}%</span>`:''}</button>`;
    }).join('')}</div>${sel.length>1?`<div class="doornote">Showing <b>${sel.length}</b> topics together. Tap a lit chip to drop it.</div>`:''}${
    anyData?'':`<div class="doornote">No attempts yet — readiness percentages appear here once you have actually drilled something.</div>`}`;
  setTimeout(()=>$$('#topicChips [data-t]').forEach(c=>c.onclick=()=>{
    if(c.dataset.t==='_all'){ S.filters.topics=[]; save(); } else filtToggle('topics',c.dataset.t);
    cb();
  }),0);
  return html;
}
/* The door note has to describe the deck the reader is actually about to be dealt.
   When the pack blocks by body system, "the most useful lead" is no longer true of
   the whole deck — they lead INSIDE each system — and a note that keeps saying it
   globally is telling a small lie about the one thing the reader is trusting. */
function deckNote(P){
  /* Built as a list, not a chain of ternaries, because either half can be zero: a
     cold reader has no wrong answers and a reader who has mastered every past-quiz
     card has no hot ones. Joining with "then" only when both are present keeps
     "the most useful come first: then the 12 you have been getting wrong" — which
     the ternary version produced — off the screen. */
  const parts=[];
  if(P.hot)  parts.push(`the <b>${P.hot}</b> that have either been asked on a past quiz or cover parts of the course no practice test touches`);
  if(P.weak) parts.push(`the <b>${P.weak}</b> you have been getting wrong`);
  const useful=parts.join(', then ');
  /* "Nothing is held back" is true of the DECK and, when a background pool is sitting
     out, false of the pack. Printed unqualified it contradicted the row directly
     beneath it, which exists to say that 346 cards are held back. So the claim narrows
     to the set it is actually about and `bgRow` keeps ownership of the rest. */
  const held=hasBG()&&!S.bg;
  const all=held?' in that set':'';
  const named=(P.blocks||[]).map(x=>`<b>${esc(x.name)}</b>`);
  /* THE SAME TRAP THE BACKGROUND SWITCH SPRANG, one filter along. "All N cards are
     in the rotation … nothing is held back" is a sentence about an UNFILTERED deck,
     and printed above a bar listing four active filters it is simply false — every
     word of it individually true of the N cards left, and the claim it makes is not.
     So a narrowed deck gets its own sentence, and neither "all" nor "nothing is held
     back" appears in it. */
  if(filtOn()){
    return `<div class="doornote"><b>${P.total}</b> card${P.total===1?'':'s'} match what you have narrowed to${
      P.total?', and the rotation deals every one of them before repeating any':''}.${
      useful?` Most useful first: ${useful}.`:''} The rest of the pack is still there — clear a filter above to bring it back.</div>`;
  }
  if(named.length>1){
    return `<div class="doornote">All <b>${P.total}</b> cards are in the rotation, worked through in course order — ${
      named.join(', then ')}.${useful?` Inside each block the most useful come first: ${useful}.`:''} Nothing${all} is held back.</div>`;
  }
  return `<div class="doornote">All <b>${P.total}</b> cards are in the rotation — the order just puts the most useful first.${
    useful?` It leads with ${useful}.`:''} Nothing${all} is held back.</div>`;
}
/* The background-reading switch. Renders under BOTH doors, states both counts either
   way, and never hides what it is doing — the whole point is that a reader can see
   there is more and reach it in one tap. */
function bgRow(types){
  if(!hasBG()) return '';
  const all=cardsOf(types,'all');
  const bg=all.filter(c=>c.bg).length, core=all.length-bg;
  if(!bg) return '';
  /* Careful with the wording here. "Background reading" is already the BADGE on every
     `textbook`-tier card, and 17 of those are in the queue because they are the only
     cards their focus point has. Calling the demoted set "the background reading" put
     that badge on a card sitting directly under a line saying background reading was
     excluded. So the set is described by WHY it is out — it repeats ground the
     lecturer's own questions already cover — and the badge keeps its meaning. */
  /* "Showing N cards" was true when this was the last word on the size of the queue.
     It is not any more: with filters on, the bar above states a smaller number, and
     two counts on one screen both claiming to be what you are seeing is the exact
     shape of the bug this row was written to avoid. So it now describes the POOL it
     owns — what the queue draws from — and leaves the queue's own count to the bar. */
  return S.bg
    ? `<div class="bgrow"><span>Drawing from all <b>${all.length}</b> cards, including the <b>${bg}</b> that go back over ground the course's own questions already cover.</span>
         <button class="btn ghost" id="bgTog">− Just the ${core} the course has asked about</button></div>`
    : `<div class="bgrow"><span>Drawing from the <b>${core}</b> cards the course has set questions on, plus the ones covering focus points no practice test touches. The other <b>${bg}</b> go back over that same ground in more general terms — they are still in the Brief and in Search.</span>
         <button class="btn ghost" id="bgTog">+ Add the other ${bg} cards</button></div>`;
}
/* Delegated, not wired per render, for the same reason #scopeClr is: every other
   post-render binding in this file attaches on a setTimeout and is documented as racy,
   and a lost binding HERE leaves the reader inside the reduced pool with no way to
   reach the other cards — which is a lock, and the two-doors rule forbids one.
   Delegation cannot come unbound. */
document.addEventListener('click',e=>{
  if(!e.target.closest('#bgTog')) return;
  S.bg=!S.bg; save(); nav(VIEW);
});
/* ---- the narrow-the-queue surface -------------------------------------------
   Dimensions are derived from the pack, never declared, so a pack with no focus
   points and no tiers simply gets three of them and no configuration. An option
   that matches nothing is not offered — except when it is already selected, because
   a chip that disappears while it is still filtering the queue is a lock with extra
   steps. The bar below the doors lists what is on whatever the panel is doing. */
const TIERFILT=['verbatim','taught','textbook','unverified'];
function filtDims(types){
  const all=cardsOf(types,'all').filter(inPool).filter(answerable);
  const mk=(id,lab,note,opts)=>({id,lab,note,opts:opts
    .map(o=>({...o,n:all.filter(c=>o.pred(c)&&passFilters(c,id)).length}))
    .filter(o=>o.n||S.filters[id].includes(o.id))});
  const ds=[
    mk('topics','Topic','',PACK.topics.map(t=>({id:t.id,lab:`${t.icon} ${t.name}`,pred:c=>c.topic===t.id}))),
    mk('types','Question type','The form the question takes — the same split the real paper has.',
       ALLTYPES.map(t=>({id:t,lab:TYPELABEL[t],pred:c=>c.type===t}))),
  ];
  if(PACK.cards.some(c=>c.tier))
    ds.push(mk('tiers','Where the card came from','',TIERFILT.map(t=>({id:t,lab:PROV[t].lab,pred:c=>provOf(c)===t}))
      .concat([{id:'_none',lab:'No source recorded',pred:c=>!provOf(c)}])));
  if((PACK.criteria||[]).length)
    ds.push(mk('crits','Focus point','The course’s own published list.',
      PACK.criteria.map(cr=>({id:cr.id,lab:cr.name||cr.id,pred:c=>c.crit===cr.id||(c.alsoCrit||[]).includes(cr.id)}))));
  ds.push(mk('status','How you are doing on it','Worked out from your own answers, so it moves as you go.',
    STATUS.map(s=>({id:s.id,lab:s.lab,hint:s.hint,pred:c=>cardStatus(c).includes(s.id)}))));
  return ds.filter(d=>d.opts.length);
}
/* A panel is a moment, not a preference — it opens where you are and is gone next

   later is just chrome. */
let FPANEL=false;
const filtLabel=(dim,id)=>{
  if(dim==='topics') return topicName(id);
  if(dim==='types')  return TYPELABEL[id]||id;
  if(dim==='tiers')  return id==='_none'?'No source recorded':(PROV[id]?PROV[id].lab:id);
  if(dim==='crits')  return critName(id);
  const s=STATUS.find(x=>x.id===id); return s?s.lab:id;
};
function filterUI(cb,types){
  const n=deckSource(types).length, on=filtOn();
  const pills=!on?'':`<div class="fpills">${FILTDIMS.map(d=>S.filters[d].map(id=>
      `<button class="fpill" data-fx="off" data-fd="${d}" data-fv="${esc(id)}" title="Stop filtering by this">${esc(filtLabel(d,id))}<span>✕</span></button>`).join('')).join('')}
    <button class="fpill clr" data-fx="clear">Clear all filters</button></div>`;
  /* Counted the same way the deck is built, so the number and the deal cannot drift. */
  const nRing=(HASRINGS()&&ringNow()!==null)?buildRingDeck(types,ringNow()).length:0;
  const bar=`<div class="filtbar">
      <button class="btn ghost${FPANEL?' open':''}" data-fx="panel" aria-expanded="${FPANEL}">🔎 Rep only… ${on?`<span class="fn">${filtCount()}</span>`:''}</button>
      <!-- NOT "whole pack — 344 cards". The pack is 345; one is damaged at source and
           never dealt, and All cards says 345 two taps away. Stating the queue's own
           number and calling it the pack is how a tool ends up with two card counts
           that are each true and cannot be reconciled from the screen. It says what it
           is: nothing narrowed, and this many in the queue. -->
      <!-- WITH RINGS ON, "in the queue" MEANS THE RING. The unringed number is the whole
           pool, which is true of the scope and false of what will be dealt next — and it
           sat one line under a bar reading "38 left in this ring". Two card counts on one
           screen that cannot be reconciled is the thing this note was written to avoid. -->
      <span class="fnote">${HASRINGS()&&ringNow()!==null
        ? `${on?`<b>${nRing}</b> of <b>${n}</b>`:`<b>${nRing}</b>`} in ${ROUNDLAB(ringNow())}${on?', after your filters':''}`
        : on?`<b>${n}</b> card${n===1?'':'s'} in the queue`:`nothing narrowed — <b>${n}</b> in the queue`}</span>
    </div>${pills}`;
  if(!FPANEL) return bar;
  const dims=filtDims(types);
  return bar+`<div class="filtpanel">
    <p class="fintro">Pick as many as you like. Inside a row they add up (<b>multichoice <i>or</i> matching</b>); across rows they narrow (<b>multichoice, <i>and</i> on the heart</b>). The number on each is how many cards it leaves you once everything else you have picked is applied.</p>
    ${dims.map(d=>`<div class="filtrow">
      <div class="fhead"><b>${esc(d.lab)}</b>${S.filters[d.id].length?`<button class="fclr" data-fx="clrdim" data-fd="${d.id}">clear</button>`:''}</div>
      ${d.note?`<div class="fsub">${d.note}</div>`:''}
      <div class="chips">${d.opts.map(o=>`<button class="chip${S.filters[d.id].includes(o.id)?' on':''}" data-fx="tog" data-fd="${d.id}" data-fv="${esc(o.id)}"${o.hint?` title="${esc(o.hint)}"`:''}>${esc(o.lab)}<span class="pc">${o.n}</span></button>`).join('')}</div>
    </div>`).join('')}
    <p class="fintro last">This narrows the <b>queue</b> only. The Brief, Search, All cards and your Progress keep counting the whole pack.</p>
  </div>`;
}
/* Delegated, every control of it, for the reason #bgTog and the old #scopeClr are:
   these buttons are the only route out of a narrowed queue, and every other
   post-render binding in this file attaches on a setTimeout that a fast tab switch
   can beat. A filter you cannot turn off is a lock. */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fx]'); if(!b) return;
  const fx=b.dataset.fx;
  if(fx==='panel') FPANEL=!FPANEL;
  else if(fx==='clear'){ filtClear(); }
  else if(fx==='clrdim'){ S.filters[b.dataset.fd]=[]; save(); }
  else if(fx==='off'||fx==='tog') filtToggle(b.dataset.fd,b.dataset.fv);

});
/* `readyNote` lets a view describe its own "Get me ready" behaviour. The Brief
   orders the focus points rather than drawing a card queue, so the card-count note
   would be meaningless there. */
function gate(cb,types,readyNote){
  /* ── THE DOORS GO WHEN THE RINGS ARRIVE ──────────────────────────────────────
     They are an ORDERING choice — "decide for me" against "I'll pick a topic" — and a
     ringed pack has already decided: breadth across focus points first, and the ring
     bar says so in a line. Leaving them up put two contradicting explanations of the
     same queue on one screen, the door note announcing "all 414 cards, worked through
     in course order" directly under a bar reading "38 left in this ring". The reader
     has to guess which one is true, which is the failure the note itself was rewritten
     once to fix.

     The SCOPE row stays. "Rep only…" narrows which cards are in play, not what order
     they come in, and it is orthogonal to the rings — a reader who wants only her
     questions still gets them ring by ring. */
  if(HASRINGS()&&readyNote===undefined) return filterUI(cb,types);
  const P=(S.door==='ready'&&readyNote===undefined)?deckStats(types):null;
  /* The filter surface sits between the doors and the note, not after it, because
     the note now describes a deck the filters have already cut — "clear a filter
     above" has to be pointing at something above it. */
  const html=`<div class="doors">
      <button class="door ${S.door==='ready'?'on':''}" data-d="ready">🎯 Get me ready</button>
      <button class="door ${S.door==='pick'?'on':''}" data-d="pick">🗂 I'll pick</button>
      <button class="iconbtn" id="doorWhy" title="What the difference is">?</button>
    </div>
    <div id="doorHelp"></div>
    ${readyNote===undefined?filterUI(cb,types):''}
    ${S.door!=='ready'?'':readyNote!==undefined?readyNote:P?deckNote(P):''}`;
  setTimeout(()=>{
    // Pre-existing race: this fires a tick after render, and switching tabs quickly
    // replaces the view before it runs, so the elements are gone. Guard rather than throw.
    if(!$('#doorWhy')) return;
    $$('.door').forEach(b=>b.onclick=()=>{ S.door=b.dataset.d; save(); cb(); });
    $('#doorWhy').onclick=()=>{
      const h=$('#doorHelp');
      h.innerHTML = h.innerHTML ? '' : `<div class="doorhelp">
        <p><b>Both doors hold exactly the same cards.</b> The only difference is who
        decides what you see next.</p>
        ${hasBG()?`<p>Both are also showing the same set — the switch below, for how
        much of the pack is in the queue, sits outside this choice and applies to
        either door.</p>`:''}
        <p><b>🔎 Rep only…</b> sits outside this choice too. It cuts the queue down to
        exactly what you want to rep — one question type, one topic, the ones you keep
        getting wrong, or any combination — and stays on until you clear it, under
        either door. Whatever is on is listed under it and each one comes off in a tap.</p>
        <p><b>🎯 Get me ready</b> decides for you. You still get through every card${
          systemBlocks()?`, working through the course in its own order — one system
        finished before the next one starts. Inside each block it leads`:` —
        it just leads`} with the ones that have come up on a past quiz, and the parts of
        the course no practice test covers. Then the ones you keep getting wrong.</p>
        <p><b>🗂 I'll pick</b> hands you the topics and gets out of the way.</p>
        <p>Either way you will not meet the same card twice until you have been through
        the whole set — except the ones you get wrong, which come back a few cards later
        on purpose.</p>
        ${PACK.doorNote?`<p>${PACK.doorNote}</p>`:''}
        ${PACK.sources?`<p style="border-top:1px solid var(--line);padding-top:9px;margin-top:9px"><b>Where this content comes from.</b> ${PACK.sources}</p>`:''}</div>`;
    };
  },0);   // chip wiring is chipRow's own job
  /* Only on a card-queue view. The Brief passes a `readyNote` and shows every focus
     point and every fact under both doors by design — offering to "add" there would
     imply something was missing from it, which is the opposite of true. */
  return html+(S.door==='pick'?chipRow(cb):'')+(readyNote===undefined?bgRow(types):'');
}

/* ============================== Brief ==============================
   The exposition layer. Every other view asks a question; this is the only
   one that explains anything, and without it Learn is asking a reader to
   retrieve facts they were never given a chance to encode.

   It is DERIVED, not authored. The teaching material is already in the pack:
   flash answers written in teaching order underneath named criteria. This
   view simply renders them as prose instead of as questions.            */
/* A LIST OF CRITERIA IS NOT A BRIEF. This view is derived from flash/saq cards (see
   critProse below), so a pack made of nothing but machine-marked cards declares its
   criteria, renders one empty stub per criterion, and `nav()` at the bottom of this
   file sends every cold reader straight to them. That shipped: the Module 1 Terminology
   tool — 63 multichoice cards, no flash, no saq — opened on a tab reading "No written
   summary for this one yet" three times over, directly under an onboarding panel
   telling the reader to start by reading it. The tab is earned by having prose to put
   in it, not by having headings to put it under. */
let _hasbrief=null;
const HASBRIEF=()=>{
  if(_hasbrief===null) _hasbrief=!!(PACK.criteria&&PACK.criteria.length)
    &&PACK.criteria.some(c=>critProse(c.id).length);
  return _hasbrief;
};
S.read=S.read||{};                 // critId -> timestamp. Additive: no migration needed.
/* cardKey -> {g,t}: marking points you ticked, out of the total. The SRS box alone
   cannot carry this — it records how WELL you recalled something, not how many marks
   you took — and the mark projection needs the written half in marks, like the paper.
   Additive, so an existing save picks it up empty and fills as you go. */
S.saq=S.saq||{};

/* Cards never change at runtime, so the key/criterion joins are computed once.
   Without this the Brief recomputes ckey() ~67k times per render on a 587-card
   pack, which is visible on a phone. */
let _ALL=null;
const allCards=()=>_ALL||(_ALL=PACK.cards.map((c,i)=>({...c,key:ckey(c),idx:i})));
const _ccache={}, _tcache={};
function critCards(id){
  if(!_ccache[id]) _ccache[id]=allCards().filter(c=>c.crit===id||(c.alsoCrit||[]).includes(id));
  return _ccache[id];
}
/* A criterion's home topic is whichever topic most of its cards sit in. Criteria
   routinely straddle topics (19 of hs2-test1's 38 do), so this is a filter hint
   only — the Brief always renders in blueprint order and never regroups. */
function critTopic(id){
  if(_tcache[id]===undefined){
    const n={}; critCards(id).forEach(c=>n[c.topic]=(n[c.topic]||0)+1);
    const top=Object.entries(n).sort((a,b)=>b[1]-a[1])[0];
    _tcache[id]=top?top[0]:null;
  }
  return _tcache[id];
}
/* Prose comes from flash answers, in pack order. A criterion with no flash card
   at all — hs2-test1's case studies are 14 SAQs and nothing else — falls back to
   its SAQ marking points, which are the model answer and read fine as prose. */
function critProse(id){
  const cs=critCards(id), fl=cs.filter(c=>c.type==='flash');
  return fl.length?fl:cs.filter(c=>c.type==='saq');
}
/* Null means "no data", and that is a different thing from zero.
   The recall half only counts once there IS recall history. Without that guard any
   focus point holding a flash card reports 0% the moment the tool opens, so one
   nobody has touched is indistinguishable from one attempted and failed — the Brief's
   "not drilled yet" never appeared, and the readiness readout called untouched
   material "your weakest so far". */
/* Measured over the cards the reader is actually DEALT, not every card filed under the
   focus point. Nine of hs2-test1's focus points are more than 70% background reading —
   resp-10 is 13 of 14 — so counting the demoted cards would peg them near zero forever
   and park them permanently at the top of "where the next half hour goes", pointing the
   reader at work the queue was never going to give them. */
function critMastery(id){
  const cs=critCards(id).filter(inPool).filter(answerable); if(!cs.length) return null;
  const rec=cs.filter(isRecall), a=autoAcc(cs), parts=[];
  if(rec.some(c=>srsGet(c.key).seen>0)) parts.push(rec.filter(c=>srsGet(c.key).box>=2).length/rec.length);
  if(a) parts.push(a.pct/100);
  return parts.length?parts.reduce((x,y)=>x+y,0)/parts.length:null;
}
/* Get me ready SORTS the blueprint; it never hides part of it. That is deliberate:
   the card queue's priority tiers are a hard filter, and on this pack that starves
   three topics to zero. Ranking here changes the order and nothing else. */
function critRank(cr){
  const read=!!S.read[cr.id], m=critMastery(cr.id);
  if(cr.blind&&!read) return 0;
  if(!read&&(m==null||m<0.6)) return 1;
  if(!read) return 2;
  return 3;
}
/* THIN COVERAGE, SAID OUT LOUD.
   A pack that ships only material sourced back to the course cannot top a focus point
   up by authoring — so where the course itself is thin, the tool is thin, and the
   reader has to be told which is which. Without this the two are indistinguishable:
   two cards on carbon dioxide transport reads as "this barely matters" when it
   actually means "this is everything she has ever asked about it".

   Declared by the pack (PACK.thin), never inferred here — the same rule as `counts`
   and `scope` on the study bus. A pack with no `thin` renders nothing. */
function thinNote(id){
  const t=(PACK.thin||[]).find(x=>x.id===id);
  if(!t) return '';
  return `<div class="thinnote">⚠️ <b>Thin ground.</b> ${t.n===1?'This is the only card':`These are the only ${t.n} cards`} in the pack on this focus point — it is on the published list, but there is little in the course material to build from. Everything here is still ${esc(PACK.lecturer||'the lecturer')}'s; there is just not much of it. Worth reading around.</div>`;
}
function factHTML(c){
  const body=c.type==='flash'
    ? `<div class="facta">${proseHTML(c.a)}</div>`
    : `<ul class="factpts">${(c.points||[]).map(p=>`<li>${p}</li>`).join('')}</ul>`;
  return `<div class="fact"><div class="factq">${c.q}${provHTML(c)}</div>${body}${figHTML(c)}<div class="provslot"></div></div>`;
}

function renderBrief(){
  const all=PACK.criteria||[];
  const pos={}; all.forEach((c,i)=>pos[c.id]=i);
  /* Also on the Brief, because a cold reader lands HERE, and the Brief is a long page:
     someone who scrolls it and closes the tab has read without ever retrieving. */
  const G=cramCTA()+gate(renderBrief,RECALL,`<div class="doornote">Everything is here under either door — <b>Get me ready</b> only changes the <b>order</b>, putting the parts no practice test covers, and the parts you are weakest on, first. Nothing is hidden.</div>`);
  setTimeout(wireCramCTA,0);

  let list=all.slice();
  if(S.door==='ready') list.sort((a,b)=>critRank(a)-critRank(b)||pos[a.id]-pos[b.id]);
  else if(S.filters.topics.length) list=list.filter(c=>S.filters.topics.includes(critTopic(c.id)));

  const nRead=all.filter(c=>S.read[c.id]).length;
  const tiers={};
  list.forEach(cr=>critProse(cr.id).forEach(c=>{ if(c.tier) tiers[c.tier]=(tiers[c.tier]||0)+1; }));
  const nProse=Object.values(tiers).reduce((a,b)=>a+b,0);

  view.innerHTML=G+`
    <div class="brfbar"><b id="brfProg">${nRead} of ${all.length} read</b>
      <span class="bar"><i id="brfProgBar" style="width:${all.length?nRead/all.length*100:0}%"></i></span></div>
    <div class="legend">
      <b>Read this before you drill.</b> One section per focus point, in the order the course
      publishes them. Read a section, mark it read, then hit <b>▸ Drill this</b> to be
      questioned on just that one.
      ${nProse?`<br/><br/>Each fact says where it came from. <b>📄 From a past quiz</b> is the one
      to watch for — that fact has already been asked${tiers.verbatim?` (${tiers.verbatim} of the ${nProse} below)`:''}.
      ${tiers.textbook?`Most of the rest is <b>background reading</b>: standard physiology put here so the
      examinable facts have something to sit on, cross-checked against the module hub. It is unlikely
      to come back at you word for word — it is what makes the examinable parts make sense. Tap any
      badge to see the source.`:'Tap any badge to see the source.'}`:''}
    </div>
    ${list.length?list.map(cr=>{
      const prose=critProse(cr.id), cs=critCards(cr.id), read=!!S.read[cr.id];
      const tp=critTopic(cr.id), m=critMastery(cr.id);
      return `<div class="brf${read?' read':''}" id="brf-${cr.id}" data-crit="${cr.id}">
        <div class="brfhead"><span class="cn">${pos[cr.id]+1}/${all.length}</span>
          <h3>${esc(cr.name||cr.id)}</h3>${cr.blind?`<span class="blindtag">never practised</span>`:''}</div>
        <div class="brfsub">${tp?esc(topicName(tp))+' · ':''}${cs.length} card${cs.length===1?'':'s'} · ${
          m!=null?`${Math.round(m*100)}% mastered`:'not drilled yet'}</div>
        ${thinNote(cr.id)}
        ${prose.length?prose.map(factHTML).join('')
          :`<div class="hinttxt">No written summary for this one yet — go straight to drilling it.</div>`}
        <div class="brfact">
          <button class="btn ghost" data-read="${cr.id}">${read?'✓ Read':'Mark as read'}</button>
          <button class="btn primary" data-drill="${cr.id}">▸ Drill this</button>
        </div></div>`;
    }).join('')
    :`<div class="empty">No focus points in this topic.</div>`}`;

  /* Ticking "read" repaints in place — re-rendering 38 sections would throw away
     the reader's scroll position, which on a long page is the whole experience. */
  $$('[data-read]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.read, on=!S.read[id];
    if(on) S.read[id]=Date.now(); else delete S.read[id];
    save();
    b.textContent=on?'✓ Read':'Mark as read';
    const blk=view.querySelector(`.brf[data-crit="${id}"]`); if(blk) blk.classList.toggle('read',on);
    const n=all.filter(c=>S.read[c.id]).length;
    const pr=$('#brfProg'), pb=$('#brfProgBar');
    if(pr) pr.textContent=`${n} of ${all.length} read`;
    if(pb) pb.style.width=(all.length?n/all.length*100:0)+'%';
  });
  $$('[data-drill]').forEach(b=>b.onclick=()=>{ drillCrit(b.dataset.drill); nav('study'); window.scrollTo({top:0}); });
}

/* ---- criterion scope, set by the Brief's ▸ Drill this ----
   This used to be its own banner with its own clear button, because it was its own
   one-off filter. It is now just the `crits` dimension of the scope object, so the
   announcement and the one-tap clear come from the same pill row as everything else
   and there is one place a reader has to look to see what is narrowing their queue.
   The rule it was built for is unchanged: a filter the reader cannot see is a lock,
   and the house rule is that we never lock. */
function drillCrit(id){
  /* Clear a topic filter that would hide the thing just asked for. Two filters that
     intersect to nothing is the one dead end this surface can produce, and arriving
     at "0 cards match" straight off a ▸ Drill this button reads as the button being
     broken. The pill row shows what changed, so it is visible rather than silent. */
  const tp=critTopic(id);
  if(S.filters.topics.length&&tp&&!S.filters.topics.includes(tp)) S.filters.topics=[];
  S.filters.crits=[id]; save();
}
/* "→ Read the full explanation" — the return leg of ▸ Drill this. Delegated for the
   same reason: this is the one route out of a wrong answer and into the prose, and a
   racy per-render binding would silently drop it.

   The topic filter is cleared FIRST when it would hide the section being asked for.
   Landing in a Brief that does not contain the thing the reader just clicked is worse
   than the extra reset, and the topic chips sit right there showing what changed, so
   it is visible rather than silent. The focus scope is left alone — they are likely
   to go back to drilling it. */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-brief]'); if(!b) return;
  const id=b.dataset.brief;
  const tp=critTopic(id);
  if(S.filters.topics.length&&tp&&!S.filters.topics.includes(tp)){ S.filters.topics=[]; save(); }
  nav('brief');
  const el=document.getElementById('brf-'+id);
  if(el){ el.scrollIntoView({block:'start',behavior:'smooth'}); el.classList.add('lit'); setTimeout(()=>el.classList.remove('lit'),1800); }
  else window.scrollTo({top:0});
});

/* ============================== Study ==============================
   ONE queue holding every card the pack has, dealt from one deck.

   This replaces Learn, Drill and Written. Those three split the pack by how a card
   is MARKED — you grade yourself, the machine grades you, or you grade against
   marking points — which is a fact about the code, not about studying. What the
   reader got for it:

     · no screen could state an honest card count. Drill holds only the
       machine-marked types, so on hs2-test1 it announced "all 300 cards" of a
       586-card pack while the Sources view said 586. Both were true. Neither
       was reconcilable from the screen.
     · every written question was in TWO tabs, because Learn's card set is
       flash + saq and Written's is saq. 44 cards, listed twice, silently.
     · three separate decks meant three separate passes through three separate
       slices, and no single place that could say "you have been through it".

   One deck fixes all three. A card still renders in its own form — a flashcard
   flips, a written answer reveals its marking points, a machine-marked card gets
   answered and marked — but that is now an INTERACTION the card chooses, not a
   destination the reader has to choose first.                                  */
/* ---- what is left of the study-screen ring bar: the OFFERS ----
   It used to carry the progress claim as well — "Focus point 7 of 38 locked · Ring 0"
   — and the Spine Bar in the shell now says that better, on every screen, with the
   half state drawn. Two copies of one number is how they end up disagreeing, so this
   one goes and the bar keeps only what it alone can do: hand the reader a way out.

   THE ESCAPE HATCH IS NOT THE SECOND THING A STRANGER SEES. "Deal me anything" above
   the very first card reads as *this thing you have not started is skippable*, which is
   an exit offered before the entrance. It is never removed — a hard lock is against
   house policy ([[two-doors-pattern]]) — it just waits until there is something to
   escape from. */
const ESCAPEAFTER=5;                 // cards answered before the way out is offered
const answeredN=()=>allCards().filter(inPool).filter(cardSeen).length;
function ringHeadHTML(){
  if(!HASRINGS()) return '';
  if(ringNow()===null){
    const id=(S.filters.crits||[])[0], cr=(PACK.criteria||[]).find(c=>c.id===id);
    return `<div class="ringbar">
      <div class="ringsub">${cr?`Every card on <b>${esc(cr.name||cr.id)}</b>, hardest first — not just the part of it in the round you were on.`
        :'Every card in scope, outside the rounds.'}</div>
      <div class="ringsub2"><button class="btn ghost" id="ringBack">Back to the rounds</button></div>
    </div>`;
  }
  const n=ringNow(), escaped=S.ring==='any'&&ringOpen()===0, left0=ringProgress(0).left;
  const skip=n===0&&!escaped&&answeredN()>=ESCAPEAFTER;
  if(!escaped&&!skip) return '';
  return `<div class="ringbar">
      ${escaped?`<div class="ringwarn">You asked to skip ahead, so this is <b>${ROUNDLAB(2)}</b> — ${
        ROUNDLAB(0)} is <b>not</b> locked yet. ${left0} topic${left0===1?'':'s'} still ${
        left0===1?'has a lead card':'have lead cards'} you have not locked. <button class="btn ghost" id="ringBack">Back to ${ROUNDLAB(0)}</button></div>`
      :`<div class="ringsub2"><button class="btn ghost" id="ringAny">Skip ahead to ${ROUNDLAB(2)} →</button>
         <span class="ringsub" style="display:block;margin-top:5px">${ROUNDLAB(0)} is not locked yet — you can come back to it any time.</span></div>`}
    </div>`;
}
function wireRingBar(){
  const a=$('#ringAny'); if(a&&a.addEventListener) a.onclick=()=>{ S.ring='any'; save(); renderStudy(); };
  const b=$('#ringBack'); if(b&&b.addEventListener) b.onclick=()=>{ S.ring=0; if(S.filters.crits.length) S.filters=FILT0(); save(); renderStudy(); };
  const n=$('#ringNext'); if(n&&n.addEventListener) n.onclick=()=>{ S.ring=ringOpen(); save(); renderStudy(); };
}
/* The end of a ring is a real screen, not an empty queue. It says what was locked, and
   it is the only place the next ring is offered. */
function ringDoneHTML(){
  const n=ringNow(), open=ringOpen(), tot=(PACK.criteria||[]).length;
  const more=open>n||RINGS[open]&&open!==n;
  return `<div class="card ringdone">
      <h3>${ROUNDLAB(n)} locked — ${esc(RINGS[n].sub)}</h3>
      <p>${n===0
        ? `You have now answered a question on <b>every one of the ${tot} topics</b> the test is allowed to ask about — each of them twice, in sittings an hour or more apart.`
        : `Every card in this round is locked.`}</p>
      <p class="ringsub">Topics locked: <b>${pointsLocked()} of ${tot}</b>.</p>
      ${more?`<div class="btnrow"><button class="btn primary" id="ringNext">Start ${ROUNDLAB(open)} — ${esc(RINGS[open].sub)}</button></div>`
            :`<p class="ringsub">That is the whole pack. Nothing is left unlocked.</p>`}
    </div>`;
}
function renderStudy(){
  /* The cram button rides ABOVE the doors on purpose. Study opens by asking the reader
     to choose a door and then read a note about deck composition — which is the right
     screen for someone who has decided to work, and the wrong one for someone deciding
     whether to. The first thing on the page should be the thing that needs no decision. */
  const G=(HASRINGS()?'':cramCTA())+ringHeadHTML()+gate(renderStudy,ALLTYPES);
  setTimeout(wireCramCTA,0);
  setTimeout(wireRingBar,0);
  CUR=nextCard(ALLTYPES);
  /* With rings on, an empty deck is not an empty pool — it is a ring finished, and it
     gets a screen that says so. Only fall through to the filter dead-end below when
     the reader has genuinely filtered everything away. */
  if(!CUR&&HASRINGS()&&ringNow()!==null&&!filtOn()){ view.innerHTML=G+ringDoneHTML(); setTimeout(wireRingBar,0); return; }
  /* An empty queue used to say "No cards in this topic yet", which was true of the
     one filter that existed then and is a dead end now: five dimensions can
     intersect to nothing, and the reader has to be told WHICH combination did it and
     handed the way out in the same breath. */
  if(!CUR){ view.innerHTML=G+`<div class="empty">${filtOn()
      ? `${filtCount()>1?`Nothing matches all <b>${filtCount()}</b> of those filters at once. Drop one above, or`:`Nothing matches that filter right now —`} <button class="btn ghost" data-fx="clear" style="margin-left:6px">clear ${filtCount()>1?'them all':'it'}</button>`
      : 'No cards here yet.'}</div>`; return; }
  const c=CUR, tot=cardMarks(c), head=cardHeadHTML(c);
  if(c.type==='rail')     studyRail(G,head,c);
  else if(c.type==='flash')studyFlash(G,head,c);
  else if(c.type==='saq') studyWritten(G,head,c);
  else                    studyAuto(G,head,c,tot);
}

/* ════════ THE CARD AS THE READER MEETS IT — one renderer, two callers ════════
   `cardHeadHTML` and `faceHTML` are what a card looks like at the moment you are
   being tested on it: the meta row, the question, the figure, and then the thing you
   actually interact with — options, blanks, dropdowns, a half-hidden chain.

   They are FUNCTIONS rather than markup living inside renderStudy because All cards
   now shows every card exactly as the queue deals it, and "exactly" cannot survive
   two implementations. A second renderer written to match this one is a copy that
   drifts the first time either side is touched, and the drift is invisible: both
   pages look plausible, and the browse view quietly stops being evidence of what the
   reader will meet. Same rule as porting a surface between projects — copy it, do
   not describe it. Here we can do better than copy: there is one of it.

   A flashcard's "1 mark" is an artefact of cardMarks defaulting, not something the
   paper awards, so it is the one type that shows no mark count.

   The flag button rides the card itself because this is where a broken card is
   actually met. Sending someone to All cards to find the one they are looking at is
   how a report never gets filed. */
/* ── ONE SENTENCE INSTEAD OF FIVE CHIPS ──────────────────────────────────────
   The head used to read `🫀 HEART ANATOMY & FLOW · 5 MARKS · BACKGROUND READING ·
   WRITTEN ANSWER · ⚑`. That is five pieces of DATA about the card and nowhere a
   statement of why it is in front of you or what it buys you on the day. Worse,
   BACKGROUND READING shouts a verdict at a reader who has no way of knowing whether it
   is a good thing or a bad one.

   So: one muted sentence — what kind of question this is, which topic, and where that
   topic sits in the published list. The source phrase is STILL the control that opens
   the full provenance panel: the same `data-prov` button wearing prose instead of a
   chip, so nothing about the sourcing disclosure is lost and nothing that wires it has
   to change.

   Marks and ⚑ stay. One is what the question is worth; the other is how a reader tells
   us the card is wrong. The type label goes — every card announces its own type in the
   next breath ("Show answer", "Reveal marking points", a set of options). */
const REASONLEAD={
  verbatim:  `One of ${LECTS} own exam questions`,
  taught:    `Straight from ${LECTS} lecture material`,
  textbook:  `Background reading, written for this pack`,
  unverified:`A card whose source nobody has checked`,
};
function reasonHTML(c){
  const t=provOf(c);
  const lead=t?REASONLEAD[t]:(c.type==='rail'?'A chain to rebuild from memory':'From this pack');
  const bits=[t?`<button class="prov ln ${t}" data-prov="1" data-ck="${c.key||ckey(c)}" aria-expanded="false">${esc(lead)}</button>`
               :`<span>${esc(lead)}</span>`];
  const crits=PACK.criteria||[], i=crits.findIndex(x=>x.id===c.crit);
  if(i>=0){ bits.push(`<b>${esc(crits[i].name||crits[i].id)}</b>`); bits.push(`topic ${i+1} of ${crits.length}`); }
  else if(c.topic) bits.push(esc(topicName(c.topic)));
  return `<span class="reason">${bits.join(' · ')}</span>`;
}
/* WHAT "BACKGROUND READING" ACTUALLY MEANS, said instead of shouted.
   NOTE — this is narrower than §6 of the cold-start spec, deliberately. That proposed
   "She has never set a question on this topic", which the data does not support for
   every textbook card: a textbook-tier card can sit on a topic the lecturer HAS set
   questions on. The claim about the topic is only made where the pack declares the
   topic blind; otherwise the claim is about this card, which is the part that is true. */
function reasonNoteHTML(c){
  if(provOf(c)!=='textbook') return '';
  const cr=(PACK.criteria||[]).find(x=>x.id===c.crit);
  return `<div class="reasonnote">Not ${LECTS} own material — written for this pack so the examinable
    facts have something to sit on.${cr&&cr.blind
      ? ` <b>Nothing in the practice material touches this topic at all</b>, so there is nothing closer to the real paper to give you.`
      : ` The test is unlikely to ask it in these words.`}</div>`;
}
function cardHeadHTML(c){
  const tot=cardMarks(c);
  return `
      <div class="creason">${reasonHTML(c)}<span class="cmend">${
        c.type==='flash'?'':`<span class="tag">${tot} mark${tot>1?'s':''}</span>`}${flagBtnHTML(c.key)}</span></div>
      ${reasonNoteHTML(c)}
      <div class="q">${c.type==='rail'?esc(c.name||'Rebuild this chain'):c.q}</div>${origHTML(c)}<div class="provslot"></div><div class="flagslot"></div>
      ${figHTML(c)}`;
}
/* The one place "SAQ" is glossed. A student does meet the abbreviation in the course,
   so hiding it entirely would be its own confusion — but they should meet it here,
   next to the plain words, rather than as a tab name. */
const SAQHINT=`<div class="hinttxt">A <b>written</b> question — what the course calls an <b>SAQ</b>. Say or write your full answer first, then reveal the marking points and mark yourself honestly.</div>`;
const railAskHTML=item=>`<div class="railhead"><span class="rung r${item.lvl}">${
  ['','Fill the gap','Name the link','Carry it on','From the seed'][item.lvl]}</span><span class="rask">${item.ask}</span></div>`;
function faceHTML(c,r,item){
  switch(c.type){
    case 'rail':  return railAskHTML(item)+railHTML(c,item,false);
    case 'flash': return '';                 // the question IS the whole face
    case 'saq':   return SAQHINT;
    default:      return runnerHTML(r);
  }
}

/* Self-graded recall, shared by flashcards and (after scoring) written answers. */
const RATEROW=`<div class="rate">
      <button class="r1" data-r="0">✗ Again</button>
      <button class="r2" data-r="1">Hard</button>
      <button class="r3" data-r="2">Good</button>
      <button class="r4" data-r="3">Easy</button>
    </div>`;
/* WHERE "NEXT" GOES. The four card runners below are shared by Study and the cram
   session, and they used to call renderStudy by name — which, dealt inside a session,
   silently threw the reader back to the unbounded queue halfway through their set and
   lost the count. One indirection instead of a parameter on all four: the runners ask
   where they are, and the session gets to tick its counter on the way past.
   `studyish` is the two views a card can be dealt in; the Enter-key handlers test it
   for the same reason. */
const studyish=()=>VIEW==='study'||VIEW==='cram';
function afterCard(){
  if(VIEW==='cram'){ sessDone(); renderCram(); window.scrollTo({top:0}); }
  else renderStudy();
}
function wireRate(c){
  $$('.rate button').forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    srsRate(c.key,r);
    /* Good and Easy are the reader saying they had it; Again and Hard are not. On a
       self-graded card the reader IS the marker, so their verdict is what the lock
       counts — anything else would be the tool second-guessing the only person who
       can see the answer they gave. */
    lockMark(c.key,r>=2);
    if(r<=1) requeue(ALLTYPES,c,r===0?4:10);   // Again comes back sooner than Hard
    afterCard();
  });
}

/* ---- what that answer bought, in the reader's own vocabulary ----
   Rendered wherever a card has a step between being marked and being left, which is
   every machine-marked card and every written one. Self-graded cards (flash, rail)
   advance straight off the rate row and have no such step; for them the Spine Bar
   moving is the whole feedback, and the dwell version is Phase C of the cold-start
   spec, where the card-flip and the session path arrive together. */
const LOCKDIAL={
  half:   {v:'◐ 1 of 2', on:true,  n:'Come back in an hour, get it right once more, and this one locks.'},
  locked: {v:'● Locked', on:true,  n:'Right twice, in sittings an hour or more apart. That is the whole claim this tool makes.'},
  tooSoon:{v:'◐ 1 of 2', on:false, n:'Still inside the hour since the last correct answer, so this one did not count. Recalling it twice in five minutes proves nothing the first time did not.'},
  lost:   {v:'○ 0 of 2', on:false, n:'Back to the start on this card — it comes round again shortly. Nothing else you have locked is affected.'},
};
function lockReadoutHTML(c,out){
  const d=LOCKDIAL[out]; if(!d) return '';
  const t=spineTally(), cr=(PACK.criteria||[]).find(x=>x.id===c.crit);
  /* THE SECOND DIAL ANSWERS "so what". On a lead card that is the topic itself moving
     towards locked; on any other card the honest answer is the round, not the topic —
     locking a non-lead card does not lock its topic and must never look as though it
     did. */
  const lead=cr&&(PACK.spine||{})[cr.id]===c.key;
  const n=ringNow();
  let k2,v2,n2;
  if(lead){ k2='Topic'; v2=esc(cr.name||cr.id);
    n2=`<b>${t.locked}</b> of ${t.tot} topics locked${t.half?` · ${t.half} half-way`:''}`; }
  else if(n===null){ k2='Topics'; v2=`${t.locked} of ${t.tot} locked`;
    n2='This card is not its topic’s lead card, so it does not lock the topic.'; }
  else { const p=ringProgress(n); k2=ROUNDLAB(n); v2=`${p.done} of ${p.total} locked`;
    n2=`${esc(RINGS[n].sub)} · <b>${p.left}</b> to go`; }
  return `<div class="earned">
      <div class="dial"><span class="k">Lock</span><span class="v${d.on?' on':''}">${d.v}</span><span class="n">${d.n}</span></div>
      <div class="dial"><span class="k">${esc(k2)}</span><span class="v">${v2}</span><span class="n">${n2}</span></div>
    </div>`;
}

/* ---- flashcard: recall it, flip it, grade yourself ---- */
/* ══════════════ THE RAIL — progressive reconstruction ══════════════
   Ported from gigastudyapp/lib/store/drill.js (buildDrillItem). A rail is a run of
   labelled relations — bead —verb→ bead —verb→ bead — and you rebuild it from memory.

   Every other card here is a string with a hole at the end. A rail is a STRUCTURE with
   holes in it, which is why it cannot decay into the wall of text this pack spent a
   rebuild removing, and why it tests what an exam actually asks: not "what is oncotic
   pressure" but "what follows from what".

   THE LADDER, and the one place it deviates from Giga. Giga grades each CONNECTION
   separately — the connection is its atom of memory — and derives the rung from the
   weakest edge in the chain. That needs per-edge SRS, a storage schema this engine does
   not have and would have to migrate every saved record to gain. Here the whole rail is
   one card with one SRS record, and the rung comes off its own Leitner box:

     box 0     →  one bead blanked            (recognise the step)
     box 1     →  one verb hidden             (name the relationship, the harder half)
     box 2-3   →  rebuild from the midpoint   (carry it on)
     box MAXBOX→  rebuild from the seed alone (the whole thing, from one concept)

   Derived from MAXBOX, never hardcoded. Written against fixed thresholds first, the
   top rung sat above a box the SRS cannot reach and was dead code in a shipped build.

   Coarser than Giga, and honest about it: a 6-link rail is graded as one unit, so a
   reader who nails five links and misses one grades the lot down. For a cram tool with
   a fixed date that is the right trade — it re-queues the whole run, which is what you
   want the week before a test. If this ever needs to be per-edge, the change is a
   storage migration, not a rewrite of this function.

   WHICH bead or verb is hidden is derived from the card key and the box, not random:
   the same rail at the same box hides the same thing, so a second look is the same
   question rather than a new one, and the reader can tell whether they have improved. */
function railRung(box){ return box>=MAXBOX?4:box>=2?3:box>=1?2:1; }
function railItem(c,box){
  const n=c.verbs.length, lvl=railRung(box);
  // a 1-link rail cannot be "rebuilt"; cap it where there is still something to hide
  const eff=n<2?Math.min(lvl,2):lvl;
  let h=5381; for(const ch of (c.key||'')) h=((h<<5)+h+ch.charCodeAt(0))|0;
  const pick=Math.abs(h)%n;
  if(eff===1) return {lvl:1,hideBeads:[pick+1],hideVerbs:[],ask:'Name the missing concept.'};
  if(eff===2) return {lvl:2,hideBeads:[],hideVerbs:[pick],ask:'Name the missing relationship — what does one do to the other?'};
  if(eff===3){ const mid=Math.max(1,Math.floor(n/2));
    return {lvl:3,hideBeads:Array.from({length:n-mid},(_,i)=>mid+1+i),hideVerbs:Array.from({length:n-mid},(_,i)=>mid+i),
            ask:'Carry it on — rebuild the rest of the chain from where it stops.'}; }
  return {lvl:4,hideBeads:Array.from({length:n},(_,i)=>i+1),hideVerbs:Array.from({length:n},(_,i)=>i),
          ask:'Rebuild the whole chain from the first concept alone.'};
}
function railHTML(c,item,reveal){
  const parts=[];
  for(let i=0;i<c.beads.length;i++){
    const hidB=!reveal&&item.hideBeads.includes(i);
    parts.push(`<div class="bead${hidB?' hid':''}${reveal&&item.hideBeads.includes(i)?' was':''}">${hidB?'?':esc(c.beads[i])}</div>`);
    if(i<c.verbs.length){
      const hidV=!reveal&&item.hideVerbs.includes(i);
      parts.push(`<div class="vrb${hidV?' hid':''}${reveal&&item.hideVerbs.includes(i)?' was':''}"><span class="ar">↓</span>${hidV?'?':esc(c.verbs[i])}</div>`);
    }
  }
  return `<div class="rail">${parts.join('')}</div>`;
}
function studyRail(G,head,c){
  const box=srsGet(c.key).box||0, item=railItem(c,box);
  view.innerHTML=G+`<div class="card">${head}
      ${faceHTML(c,null,item)}
      <div id="ansZone"><div class="btnrow"><button class="btn primary" id="flip">Show the chain ↵</button></div></div>
    </div>`;
  const flip=()=>{
    $('#ansZone').innerHTML=`<div class="answer"><div class="lab">The whole chain</div>${railHTML(c,item,true)}${srcHTML(c)}</div>`+RATEROW;
    wireRate(c);
  };
  $('#flip').onclick=flip;
  document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#flip')) flip(); };
}
function studyFlash(G,head,c){
  view.innerHTML=G+`<div class="card">${head}${faceHTML(c,null)}
      <div id="ansZone"><div class="btnrow"><button class="btn primary" id="flip">Show answer ↵</button></div></div>
    </div>`;
  const flip=()=>{
    $('#ansZone').innerHTML=`<div class="answer"><div class="lab">Answer</div><div class="txt">${proseHTML(c.a)}</div>${srcHTML(c)}</div>`+RATEROW;
    wireRate(c);
  };
  $('#flip').onclick=flip;
  document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#flip')) flip(); };
}

/* ---- written answer: say it, reveal the marking points, tick honestly ---- */
function studyWritten(G,head,c){
  view.innerHTML=G+`<div class="card">${head}${faceHTML(c,null)}
      <div id="ansZone"><div class="btnrow"><button class="btn primary" id="flip">Reveal marking points ↵</button></div></div>
    </div>`;
  const reveal=()=>{
    $('#ansZone').innerHTML=`
      <div class="answer"><div class="lab">Tick every point you got</div>
      <ul class="points" id="pts">${c.points.map((p,i)=>`<li data-i="${i}"><span class="n">${i+1}</span><span>${p}</span></li>`).join('')}</ul>
      ${c.model?`<div class="why">💡 ${c.model}</div>`:''}${srcHTML(c)}
      <div id="lockslot"></div>
      <div class="btnrow"><button class="btn primary" id="done">Score it</button></div></div>`;
    $$('#pts li').forEach(li=>li.onclick=()=>li.classList.toggle('got'));
    $('#done').onclick=()=>{
      const got=$$('#pts li.got').length, tot=c.points.length;
      const pct=got/tot;
      const sm=S.saq[c.key]||{g:0,t:0}; sm.g+=got; sm.t+=tot; S.saq[c.key]=sm;
      srsRate(c.key, pct>=1?3 : pct>=0.8?2 : pct>=0.5?1 : 0);   // srsRate saves
      /* A WRITTEN ANSWER COULD NOT LOCK — and two of this pack's 38 lead cards are
         written ones, so Round 1 could never be completed and Round 2 could never open
         through the door that is supposed to open it. Every other runner called
         lockMark; this one was missed. The threshold is the same one the self-graded
         rate row already uses: Good or better, which srsRate scores at 0.8 of the
         marking points. Gated in build.mjs so it cannot go missing again. */
      const lk=lockMark(c.key, pct>=0.8);
      if(pct<0.8) requeue(ALLTYPES,c,pct>=0.5?10:4);
      const ls=$('#lockslot'); if(ls) ls.innerHTML=lockReadoutHTML(c,lk);
      $('#done').outerHTML=`<div class="why" style="flex:1">Scored <b>${got}/${tot}</b> — ${pct>=0.8?'strong ✅':pct>=0.5?'getting there — this one comes back soon':'this one goes back to the front of the queue 🔁'}</div><button class="btn primary" id="next">Next ↵</button>`;
      $('#next').onclick=afterCard;
      document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#next')) afterCard(); };
    };
  };
  $('#flip').onclick=reveal;
  document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#flip')) reveal(); };
}

/* ---- machine-marked: mcq / order / cloze / tfset / match ---- */
function studyAuto(G,head,c,tot){
  const r=makeRunner(c);
  view.innerHTML=G+`<div class="card">${head}
      <div id="body">${faceHTML(c,r)}</div>
      <div id="fb">${c.type==='mcq'?'':`<div class="btnrow"><button class="btn primary" id="submit" disabled>Check answer ↵</button></div>`}</div>
    </div>`;
  const refresh=()=>{
    if(c.type==='order'){ $('#body').innerHTML=runnerHTML(r); wireRunner($('#body'),r,refresh); }
    const sb=$('#submit'); if(sb) sb.disabled=!runnerDone(r);
    if(c.type==='mcq'&&runnerDone(r)) grade();
  };
  const grade=()=>{
    r.rev=true;
    const {got}=markAuto(c,r.resp), ok=got===tot;
    $('#body').innerHTML=runnerHTML(r);
    const m=S.mcq[c.key]||{a:0,c:0}; m.a++; if(ok)m.c++;
    m.g=(m.g||0)+got; m.t=(m.t||0)+tot; S.mcq[c.key]=m; save();
    /* FULL marks or it does not count. A cloze with ten blanks and nine right is a
       card the reader cannot yet answer, and locking it would put a focus point in the
       "done" column on the strength of a near miss. */
    const lk=lockMark(c.key,ok);
    if(!ok) requeue(ALLTYPES,c,got?10:4);      // partly right waits longer than fully wrong
    $('#fb').innerHTML=feedbackHTML(c,r.resp,`${ok?'✅':got?'➖':'❌'} <b>${got} / ${tot} mark${tot>1?'s':''}.</b> `)+srcHTML(c)+
      lockReadoutHTML(c,lk)+
      `<div class="btnrow"><button class="btn primary" id="next">Next ↵</button></div>`;
    $('#next').onclick=afterCard;
    document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#next')) afterCard(); };
  };
  wireRunner($('#body'),r,refresh);
  if($('#submit')) $('#submit').onclick=grade;
  document.onkeydown=e=>{ if(studyish()&&e.key==='Enter'&&$('#submit')&&!$('#submit').disabled) grade(); };
}

/* ═══════════════ TYPED RECALL — the matcher ═══════════════════════════════════
   Producing a term from memory is strictly harder than picking it out of four, and it
   is the harder thing that predicts whether you still have it in a week. So where a
   card's answer is a short term, we ask for it typed BEFORE showing any options.

   This only works if the marker is fair, and "fair" here is a specific claim: it must
   never mark a reader wrong for knowing the thing. A reader marked wrong for a spelling
   they would have recognised instantly stops typing and starts tapping, and the feature
   is gone. Equally it must not accept a wrong term, or it teaches one.

   Between those sits the NEAR verdict, which is the whole design: right idea, shown the
   correct spelling, credited. The reader is never punished for prose and never left
   believing a misspelling was the word.

   NORMALISATION IS SYMMETRIC — both the typed text and the key go through exactly the
   same pipeline, so the folds do not have to be linguistically correct, only consistent.
   `ae`→`e` mangles "aerobic" into "erobic" on both sides and still matches. That is why
   this is a fold and not a dictionary. (The one that matters: the course writes
   "haemoglobin" and half the textbooks write "hemoglobin". A pack has already shipped a
   criteria rule that missed the British spelling for months, which is this bug wearing
   a different hat.) */
/* Kept SHORT on purpose. The first cut also stripped his/her/its/at/in/on, which ate
   the proper noun in "Bundle of His" and left the key as the bare word "bundle" —
   contained in half the conduction-system distractors. A stopword list on anatomical
   terms is a liability: articles and "and"/"of" are safe, pronouns and prepositions
   are not. */
const STOPW=/\b(the|a|an|of|and)\b/g;
function normAns(s){
  return String(s==null?'':s)
    .replace(/<[^>]*>/g,' ')                       // options may carry <b>…</b>
    .replace(/&[a-z]+;|&#\d+;/gi,' ')
    .toLowerCase()
    .replace(/[‘’ʼ]/g,"'")
    .replace(/[^a-z0-9\s'-]/g,' ')                 // punctuation, brackets, symbols
    .replace(/['-]/g,'')                           // "o'clock", "well-known" join up
    .replace(STOPW,' ')
    .replace(/\s+/g,' ').trim();
}
/* Spelling fold, applied AFTER normAns. Order matters: the plural strip runs last so
   it sees already-folded stems. Words of 3 letters or fewer are never de-pluralised —
   "gas" must not become "ga". */
function foldSpell(s){
  return s.replace(/ae|oe/g,'e')
          .replace(/is(e|ed|es|ing)\b/g,'iz$1')
          .replace(/ys(e|ed|es|ing)\b/g,'yz$1')
          .replace(/([a-z]{2,})ies\b/g,'$1y')          // capillaries → capillary
          .replace(/([a-z]{2,}(?:s|x|z|ch|sh))es\b/g,'$1')  // reflexes → reflex
          .replace(/\B([a-z]{3,})s\b/g,'$1')           // veins → vein; never "gas" → "ga"
          .replace(/\s+/g,' ').trim();
}
const foldKey=s=>foldSpell(normAns(s));
/* Levenshtein, iterative, single row. Bounded inputs (short terms) so no cap needed. */
function lev(a,b){
  if(a===b) return 0;
  if(!a.length||!b.length) return Math.max(a.length,b.length);
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
/* How far off still counts as "you knew it, you mistyped it". Scaled by length, because
   one wrong letter in a 4-letter word is a different word and one wrong letter in
   "atelectasis" is a thumb. */
const nearTol=n=>n<=4?0:n<=7?1:n<=12?2:3;
/* Accepted forms of the key. A Canvas option often carries a gloss the reader should
   not have to reproduce — "Left Anterior Descending artery {LAD}" — so the gloss and
   the ungossed stem are BOTH accepted, and so is the bare abbreviation. */
function keyForms(correct){
  const raw=String(correct==null?'':correct).replace(/<[^>]*>/g,' ');
  const forms=[raw];
  const inner=raw.match(/[({[]([^)}\]]+)[)}\]]/g)||[];
  inner.forEach(x=>forms.push(x.replace(/^[({[]|[)}\]]$/g,'')));
  forms.push(raw.replace(/[({[][^)}\]]*[)}\]]/g,' '));
  return [...new Set(forms.map(foldKey).filter(Boolean))];
}
/* Verdict: 'hit' | 'near' | 'miss'. `wrongs` are the card's own distractors — if the
   typed text lands closer to one of those than to the key, it is a MISS whatever the
   edit distance says. Without that guard, "hypertension" typed against a key of
   "hypotension" scores distance 1 and gets credited as a near-miss for the exact
   opposite of the right answer. */
function matchAnswer(input,correct,wrongs){
  const t=foldKey(input);
  if(!t) return 'miss';
  const forms=keyForms(correct);
  if(!forms.length) return 'miss';
  const wforms=(wrongs||[]).map(w=>foldKey(w)).filter(Boolean);
  /* THE DISTRACTOR TEST RUNS FIRST, and it has to. Ordered the other way, containment
     credited the reader for typing the card's own wrong answer whenever the distractor
     was the key with a qualifier bolted on — "Parasympathetic nervous system" contains
     "sympathetic nervous system", "Non-ciliated columnar epithelia" contains the
