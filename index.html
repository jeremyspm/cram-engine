<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#161719"/>
<title>Cram Engine — Example Pack</title>
<style>
/* ── Estate palette. Every value is lifted from hub/index.html:15-53, which took
   them from Giga's Liquid theme: neutral surfaces and one indigo accent, in both
   themes. Per the house rule this takes the hub's PALETTE and MATERIAL only —
   never its chrome. The cram tool keeps its own shape. ── */
:root{
  --bg:#161719; --bg2:#161719; --card:#1c1c1f; --card2:#242427;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.15);
  --tx:#f2f2f6; --tx2:rgba(255,255,255,.56); --tx3:rgba(255,255,255,.34);
  --acc:#6366F1; --acc2:#565AE6;
  --acc-tx:#818CF8;                 /* the accent as TEXT — #6366F1 on the card is 3.8:1, this is 5.7:1 */
  --acc-soft:rgba(99,102,241,.16);
  --good:#32D74B; --hard:#FF9F0A; --bad:#FF453A;
  --onGood:#04120b; --onBad:#2b0604;   /* text on a FILLED good/bad chip: 10.0:1 and 5.5:1 */
  --shadow:0 14px 36px rgba(0,0,0,.16);
  /* `--r` is material and comes from the hub. `--maxw` is SHAPE and does not.
     The hub's 620px is right for a link directory; this tool renders ported
     anatomical figures, and 12 of hs2-test1's rasters are 1100px wide. At 620 they
     land at 50% scale — against 63% here before, and 68% in hs2-module1, which is
     where they were checked for legibility and which they are copied from byte for
     byte. Taking the hub's measure halved a labelled diagram. Palette and material,
     never chrome or shape. */
  --r:14px; --maxw:760px;
}
html[data-theme="light"]{
  --bg:#eceef3; --bg2:#eceef3; --card:#ffffff; --card2:#f4f5f7;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.14);
  --tx:#16161a; --tx2:rgba(0,0,0,.52); --tx3:rgba(0,0,0,.34);
  --acc:#4F46E5; --acc2:#4138CF; --acc-tx:#4F46E5;
  --acc-soft:rgba(79,70,229,.12);
  --good:#12833A; --hard:#A35C00; --bad:#C62A20;
  --onGood:#ffffff; --onBad:#ffffff;   /* the light semantics are dark FILLS, so the text on them flips */
  --shadow:0 14px 36px rgba(20,24,40,.10);
}
/* Derived, and derived on purpose. Two traps live here:
   - `--miss` is this engine's name for the house `--bad`. It appears all over the
     stylesheet (.opt.wrong / .slot.wrong / .tfrow.wrong / .timer.low) and in the
     result hero, so it is ALIASED rather than blind-renamed.
   - `--gGood/--gHard/--gMiss` used to be hand-mixed washes baked from the OLD
     accents. Carried across a palette change they would have left every
     correct/incorrect state wearing a colour from a dead theme. They are now mixed
     from the live token, so they can never drift again. */
:root{
  --miss:var(--bad);
  --gGood:color-mix(in srgb,var(--good) 15%,transparent);
  --gHard:color-mix(in srgb,var(--hard) 15%,transparent);
  --gMiss:color-mix(in srgb,var(--bad)  15%,transparent);
  --bGood:color-mix(in srgb,var(--good) 45%,transparent);
  --bHard:color-mix(in srgb,var(--hard) 45%,transparent);
  --bMiss:color-mix(in srgb,var(--bad)  45%,transparent);
  --gAcc:var(--acc-soft);
  --bAcc:color-mix(in srgb,var(--acc) 40%,transparent);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--tx);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:14px 16px 120px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.hidden{display:none !important}
b{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px}
/* Days-left. Nothing else in the header does as much for urgency, and it costs
   one pack field. Only rendered when the pack declares PACK.exam.date. */
.dleft{flex:0 0 auto;font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:6px 11px;border-radius:20px;background:var(--acc-soft);border:1px solid var(--bAcc);color:var(--acc-tx);white-space:nowrap}
.dleft.soon{background:var(--gHard);border-color:var(--bHard);color:var(--hard)}
.dleft.now{background:var(--gMiss);border-color:var(--bMiss);color:var(--bad)}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2);transition:.15s}
.iconbtn:hover{border-color:var(--line2);color:var(--tx)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:8px;font-size:12.5px;color:var(--tx2);font-weight:600;white-space:nowrap;transition:.12s}
.seg button.on{background:var(--acc);color:#fff}
.seg button:not(.on):hover{color:var(--tx);background:var(--card2)}
.controls{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px;max-width:100%}
#navMore{font-size:15px;line-height:1;letter-spacing:1px;padding:7px 13px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx2);transition:.12s}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 20px;position:relative;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
/* ---- the reason row: prose, not chips (see cardHeadHTML) ----
   `min-width:0` on the prose column or a long topic name pushes the card past the
   viewport at 375px, taking the page with it. */
.creason{display:flex;align-items:flex-start;gap:8px;margin-bottom:11px;min-width:0}
.reason{min-width:0;font-size:11.5px;line-height:1.55;color:var(--tx3)}
.reason b{color:var(--tx2);font-weight:700}
/* The source phrase is the same `data-prov` button as the old chip, restyled as a
   dotted-underlined phrase so it reads as part of the sentence and still looks
   pressable. Colour still carries the tier. */
.prov.ln{display:inline;background:none;border:0;padding:0;border-radius:0;font-size:11.5px;
  font-weight:700;text-transform:none;letter-spacing:0;
  text-decoration:underline dotted;text-underline-offset:2px}
.prov.ln.verbatim{color:var(--good)}
.prov.ln.taught{color:var(--acc-tx)}
.prov.ln.textbook{color:var(--tx3);font-weight:600}
.prov.ln.unverified{color:var(--bad)}
.reasonnote{font-size:11.5px;line-height:1.55;color:var(--tx3);background:var(--card2);
  border-radius:8px;padding:8px 10px;margin:0 0 12px}
.reasonnote b{color:var(--tx2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.tag.acc{background:var(--acc-soft);color:var(--acc-tx);border-color:var(--bAcc)}
.tag.right{margin-left:auto;color:var(--tx3);border-color:var(--line)}
/* ---- where this came from (packs that declare card.tier) ---- */
.prov{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
/* The badge scale runs QUIET → LOUD, and it is deliberately not the scale you would
   guess. "Background reading" fires on 61% of hs2-test1's cards; at full alarm
   strength on two cards in three it stopped being a warning and became a texture
   that taught the reader to distrust the whole tool — and it was never a defect in
   the first place, just standard physiology that happens not to be in the slides.
   So it is grey and silent, the RARE and valuable signal gets the strong colour,
   and real alarm is reserved for the one tier that means nobody has checked this. */
.prov.verbatim{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:var(--good);font-weight:800}
.prov.taught{background:var(--acc-soft);color:var(--acc-tx);border-color:var(--bAcc)}
.prov.textbook{background:none;color:var(--tx3);border-color:var(--line2);font-weight:600}
.prov.unverified{background:var(--gMiss);color:var(--bad);border-color:var(--bMiss)}
.provdet{margin:10px 0 0;padding:11px 13px;border:1px solid var(--line2);border-left:3px solid var(--line2);border-radius:9px;background:var(--card2);font-size:12.5px;line-height:1.55;color:var(--tx2)}
.provdet b{color:var(--tx)}
.provdet .qt{display:block;margin-top:6px;padding:8px 10px;border-radius:7px;background:var(--bg2);color:var(--tx);font-style:italic}
.provdet .loc{display:block;margin-top:5px;font-size:11.5px;color:var(--tx3)}
.auditrow{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.auditrow .n{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx3);min-width:34px}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:2px 0 4px}
.marks{font-size:12.5px;color:var(--tx3);margin:4px 0 0}
.answer{margin-top:16px;border-top:1px dashed var(--line2);padding-top:16px;animation:pop .22s ease}
.answer .lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:8px}
.answer .txt{font-size:16px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;line-height:1.45;transition:.15s;width:100%}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.opt.right{background:var(--gGood);border-color:var(--bGood)}
.opt.right .k{background:var(--good);color:var(--onGood);border-color:var(--good)}
.opt.wrong{background:var(--gMiss);border-color:var(--bMiss)}
.opt.wrong .k{background:var(--miss);color:var(--onBad);border-color:var(--miss)}
.opt.picked{outline:2px solid var(--acc)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;color:var(--tx2);line-height:1.5}
.why b{color:var(--acc-tx)}
.whyx{display:block;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.wlink{display:block;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--acc-tx);text-align:left;padding:0;line-height:1.45}
.wlink:hover{text-decoration:underline}
/* ---- interactive card types: order / cloze / tfset / match ---- */
.seq{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.slot{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.4;min-height:44px;text-align:left;width:100%;color:inherit;transition:.15s}
.slot .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.slot .s{flex:1;min-width:0}
.slot.full{border-style:solid}
.slot.full:hover{border-color:var(--acc)}
.slot.right{background:var(--gGood);border-color:var(--bGood);border-style:solid}
.slot.right .n{background:var(--good);color:var(--onGood);border-color:var(--good)}
.slot.wrong{background:var(--gMiss);border-color:var(--bMiss);border-style:solid}
.slot.wrong .n{background:var(--miss);color:var(--onBad);border-color:var(--miss)}
.slot .ph{color:var(--tx3);font-style:italic;font-size:13.5px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.bank button{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13.5px;line-height:1.35;text-align:left;max-width:100%;transition:.12s}
.bank button:hover:not(:disabled){border-color:var(--acc)}
.bank button:disabled{opacity:.3;cursor:default}
.clozebody{margin-top:14px;font-size:15.5px;line-height:2.1}
/* Segmented long passages: each chunk is its own bounded block, so a 400-word item
   reads as a short list instead of a wall. Purely presentational — see runnerHTML. */
.clozebody.seg{line-height:1.95}
.clozebody.seg .clozeseg{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:9px}
.clozebody.seg .clozeseg:last-child{margin-bottom:0}
.clozeprog{margin-top:11px;font-size:12.5px;color:var(--tx3);text-align:right;font-variant-numeric:tabular-nums}
.blanksel{background:var(--card2);border:1px solid var(--acc);border-radius:7px;color:var(--tx);font:inherit;font-size:14px;padding:4px 6px;margin:2px 1px;max-width:100%}
.blanksel:disabled{opacity:1}
.blanksel.right{border-color:var(--good);background:var(--gGood)}
.blanksel.wrong{border-color:var(--miss);background:var(--gMiss)}
.tfrow{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.45}
.tfrow .s{flex:1;min-width:0}
.tfbtns{display:flex;gap:5px;flex:0 0 auto}
.tfbtns button{width:38px;padding:8px 0;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-weight:800;font-size:12.5px;color:var(--tx2);transition:.12s}
.tfbtns button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tfrow.right{background:var(--gGood);border-color:var(--bGood)}
.tfrow.wrong{background:var(--gMiss);border-color:var(--bMiss)}
.tfrow .av{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--tx3)}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.mrow .l{flex:1 1 150px;min-width:0;line-height:1.4}
.mrow select{flex:1 1 170px;min-width:0}
.mrow.right{background:var(--gGood);border-color:var(--bGood)}
.mrow.wrong{background:var(--gMiss);border-color:var(--bMiss)}
.mfix{flex:1 1 100%;font-size:12.5px;color:var(--tx2);padding-top:2px}
.figwrap{margin:15px 0 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fdfdfd}
.figwrap img,.figwrap svg{display:block;width:100%;height:auto}
.figcap{font-size:12px;color:var(--tx3);padding:7px 11px;background:var(--card2);border-top:1px solid var(--line);line-height:1.45}
.srcline{margin-top:10px;font-size:11.5px;color:var(--tx3);line-height:1.5}
.points{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.45;cursor:pointer;transition:.15s}
.points li .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2);margin-top:1px}
.points li.got{background:var(--gGood);border-color:var(--bGood)}
.points li.got .n{background:var(--good);color:var(--onGood);border-color:var(--good)}
.hinttxt{font-size:12.5px;color:var(--tx3);margin-top:10px;font-style:italic}
.btnrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:800;letter-spacing:.3px;transition:.12s;flex:1}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--acc)}
.rate{display:flex;gap:8px;margin-top:16px}
.rate button{flex:1;padding:12px 6px;border-radius:11px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:var(--card2);transition:.12s}
.rate .r1:hover{background:var(--gMiss);border-color:var(--miss);color:var(--miss)}
.rate .r2:hover{background:var(--gHard);border-color:var(--hard);color:var(--hard)}
.rate .r3:hover{background:var(--gGood);border-color:var(--good);color:var(--good)}
.rate .r4:hover{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-tx)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.topbar .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700}
.tprog{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.timer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--miss)}
.setup h3{margin:0 0 4px;font-size:18px}
.setup p{margin:0 0 14px;color:var(--tx2);font-size:13.5px}
.bigstart{width:100%;margin-top:8px;padding:15px;border-radius:12px;color:#fff;font-size:16px;font-weight:900;letter-spacing:.5px;background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 8px 24px var(--bAcc)}
.bigstart:hover{filter:brightness(1.1)}
.result-hero{border-radius:var(--r);padding:26px 20px;text-align:center;margin-bottom:14px;border:1px solid var(--line);animation:pop .3s ease}
.result-hero.pass{background:linear-gradient(160deg,var(--gGood),transparent);border-color:var(--bGood)}
.result-hero.fail{background:linear-gradient(160deg,var(--gMiss),transparent);border-color:var(--bMiss)}
.result-hero .big{font-size:40px;font-weight:900;letter-spacing:-1px}
.result-hero.pass .big{color:var(--good)}
.result-hero.fail .big{color:var(--miss)}
.result-hero .sub{font-size:14px;color:var(--tx2);margin-top:4px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.rev .rhead{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.45}
.rev .rhead .ic{flex:0 0 auto;margin-top:1px}
.rev .rhead .qq{flex:1;color:var(--tx2)}
.rev .rbody{padding:0 14px 13px}
.search input{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:13px 15px;color:var(--tx);font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:9px;font-size:14px;line-height:1.5}
.sres .st{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--acc);margin-bottom:3px}
.sres .sa{color:var(--tx2);margin-top:5px;font-size:13.5px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.catstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.catstat .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px}
.catstat .top .m{margin-left:auto;font-size:12px;font-weight:800;color:var(--tx3)}
.catstat .bar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden}
.catstat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.catstat .sub{font-size:12px;color:var(--tx3);margin-top:5px}
.histrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:7px;color:var(--tx2)}
.histrow .sc{font-weight:800;font-size:14px;color:var(--tx)}
.histrow .pf{margin-left:auto;font-weight:800;font-size:11.5px}
.histrow .pf.p{color:var(--good)} .histrow .pf.f{color:var(--miss)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin:20px 0 9px}
.danger{color:var(--miss);border-color:var(--bMiss) !important}
.packwarn{background:var(--gHard);border:1px solid var(--bHard);border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:12px;color:var(--tx)}
/* ---- Brief: the exposition layer (packs that declare PACK.criteria) ---- */
.brfbar{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.brfbar .bar{flex:1;height:7px;border-radius:5px;background:var(--card2);overflow:hidden;min-width:40px}
.brfbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.brfbar b{color:var(--tx);white-space:nowrap}
.legend{font-size:12.5px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:12px;line-height:1.6}
.legend b{color:var(--tx)}
/* First-run panel. Shown once, above the Brief, then never again. */
.onb{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:16px 17px 14px;margin-bottom:14px;font-size:14.5px;line-height:1.62;color:var(--tx2)}
.onb h3{margin:0 0 8px;font-size:18px;line-height:1.3;color:var(--tx)}
.onb p{margin:0 0 9px}
.onb b{color:var(--tx)}
.onb .btn{width:100%;margin-top:5px}
.brf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 17px 15px;margin-bottom:11px;scroll-margin-top:12px}
.brf.lit{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.brf.read{border-color:var(--bGood)}
.brfhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.brfhead .cn{font-size:11px;font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.brfhead h3{margin:0;font-size:17px;line-height:1.35;flex:1 1 200px;min-width:0}
.blindtag{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--gHard);color:var(--hard);border:1px solid var(--bHard);flex:0 0 auto}
.brfsub{font-size:11.5px;color:var(--tx3);margin-bottom:11px;line-height:1.5}
.fact{padding:11px 0;border-top:1px solid var(--line)}
.fact:first-of-type{border-top:none;padding-top:3px}
.factq{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:5px;line-height:1.45}
.factq .prov{margin-left:7px;vertical-align:middle;padding:2px 6px;font-size:9.5px}
/* The Brief used to need a local override muting the textbook badge, because the
   card views rendered it as an alarm. It is quiet everywhere now, so the override
   is gone rather than duplicated — one badge, one appearance, all eight views. */
.facta{font-size:14.5px;line-height:1.65;color:var(--tx2)}
.facta b{color:var(--tx)}
.factpts{margin:5px 0 0;padding-left:19px;font-size:14px;line-height:1.6;color:var(--tx2)}
.factpts li{margin-bottom:3px}
.fact .figwrap{margin:11px 0 0}
.brfact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.brfact .btn{flex:1 1 132px;padding:11px 14px;font-size:13.5px}
/* ---- narrowing the queue -----------------------------------------------------
   The bar wraps rather than shrinks: at 375px a row holding a button, a count and a
   clear-all has no business trying to stay on one line, and the count is the part
   that must never be truncated. `.fpills` is the announcement — it is deliberately
   loud (accent border, own row) because it is the only thing standing between a
   reader and a queue that is quietly missing four fifths of the pack. */
.filtbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filtbar .btn{flex:0 0 auto;padding:9px 13px;font-size:13px;font-weight:700}
.filtbar .btn.open{border-color:var(--acc);color:var(--tx)}
.filtbar .fn{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:20px;background:var(--acc);color:#fff;font-size:11px;font-weight:800}
.filtbar .fnote{font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.filtbar .fnote b{color:var(--tx)}
.fpills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fpill{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:20px;
  background:var(--acc-soft);border:1px solid var(--bAcc);color:var(--acc-tx);font-size:12px;font-weight:700;line-height:1.3;text-align:left}
.fpill span{font-size:11px;opacity:.8}
.fpill:hover{border-color:var(--acc);color:var(--tx)}
.fpill.clr{background:none;border-color:var(--line2);color:var(--tx2)}
.filtpanel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px 6px;margin-bottom:12px}
.filtpanel .fintro{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--tx2)}
.filtpanel .fintro.last{margin:2px 0 8px;padding-top:10px;border-top:1px solid var(--line);color:var(--tx3)}
.filtpanel .fintro b{color:var(--tx)}
.filtrow{margin-bottom:12px}
.filtrow .fhead{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;font-size:13px;color:var(--tx)}
.filtrow .fclr{font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px}
.filtrow .fclr:hover{color:var(--bad)}
.filtrow .fsub{font-size:12px;color:var(--tx3);margin-bottom:7px;line-height:1.45}
.filtrow .chips{margin-bottom:0}
/* ---- two doors ---- */
.doors{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.door{flex:1;padding:12px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:800;color:var(--tx2);line-height:1.3;transition:.14s}
.door:hover{border-color:var(--line2);color:var(--tx)}
.door.on{background:var(--acc);border-color:var(--acc);color:#fff}
.doors .iconbtn{flex:0 0 auto;width:42px;height:auto;font-weight:800}
.doornote{font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
/* Thin coverage. Warm border rather than the error red — this is an honest statement
   about the course material, not a fault in the tool. */
.thinnote{font-size:12.5px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--hard);border-radius:9px;padding:9px 12px;margin:10px 0;line-height:1.5}
/* The background-reading switch. Column-stacked so the button never gets squeezed to a
   sliver on a 375px screen, and the button is full-width there for the same reason. */
.bgrow{display:flex;flex-direction:column;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--tx2);
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
.bgrow .btn{flex:0 0 auto;align-self:stretch;text-align:center}
@media(min-width:560px){.bgrow{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
  .bgrow .btn{align-self:auto}}
.doorhelp{font-size:13px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:12px;line-height:1.6}
.doorhelp b{color:var(--tx)}
.doorhelp p{margin:0 0 8px}
.doorhelp p:last-child{margin-bottom:0}
.chip .pc{font-size:11px;font-weight:800;opacity:.75;margin-left:5px}
/* ---- All cards + flagging ----------------------------------------------------
   Study deals you ONE card and decides which one. This is the other direction:
   every card in the pack, sitting still, grouped, readable straight through.

   It exists because a 586-card pack is unauditable from inside a queue — you
   cannot check a card you have not been dealt, and the person best placed to
   notice a broken answer key is whoever is reading it at the time. So browsing
   and flagging are deliberately the SAME screen, and the flag button also rides
   along on the study card, because the moment you spot a
   bad card is the moment it is in front of you. */
.libgrp{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;color:var(--tx);font-size:14.5px;font-weight:600;line-height:1.4;transition:.12s}
.libgrp:hover{border-color:var(--line2)}
.libgrp .nm{min-width:0}
.libgrp .n{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.libgrp .fl{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--gHard);color:var(--hard);border:1px solid var(--bHard);white-space:nowrap}
.libgrp.flagsgrp{border-color:var(--bHard);background:var(--gHard)}
.libhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.libhead .btn{flex:0 0 auto;padding:9px 14px;font-size:13px}
/* The view switch is the page's own segmented control, so it inherits `.seg` whole
   and only takes a margin. Full-width at phone size: three labels at 12.5px wrap to
   two lines inside a shrink-to-fit box and the middle one lands under the first. */
.libseg{margin:12px 0 0;width:100%}
.libseg button{flex:1 1 0;min-width:0;text-align:center}
.libnote{margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--tx2);background:var(--card2);
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:10px 12px}
.libnote b{color:var(--tx)}
/* AS TESTED. The card wears the study card's own classes — .creason, .q, .opts, .seq,
   .tfrow — because it IS the study card's markup, so almost nothing is needed here.
   `.q` is dialled back only in size: at 19px in a list of sixty it stops reading as a
   list. Everything that carries meaning (the mark count, the option lettering, the
   right/wrong colouring) is untouched, because changing it would make this view a
   lookalike instead of the thing itself. */
.libcard.test{padding:16px 16px 14px}
.libcard.test .q{font-size:16.5px;margin-bottom:2px}
.libcard.test .creason{margin-bottom:11px}
.libcard.test .tface{margin-top:11px}
.libcard.test .tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.libcard.test .tbtns .btn{flex:1 1 150px;padding:10px 13px;font-size:13px}
.libcard.test .tans:not(:empty){margin-top:12px}
.libcard.test .tres{font-size:13.5px;line-height:1.5;color:var(--tx2);margin-bottom:8px}
.libcard.test .tres b{color:var(--tx)}
.libcard.test .liba{border-top:none;padding-top:0}
.libcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:9px}
.libcard.flagged{border-color:var(--bHard);box-shadow:0 0 0 2px var(--gHard)}
.libmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.libmeta .flagbtn{margin-left:auto}
.libq{font-size:15px;font-weight:650;line-height:1.5;color:var(--tx)}
.liba{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:14px;line-height:1.6;color:var(--tx2);overflow-wrap:anywhere}
.liba b{color:var(--tx)}
.liba .lb{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.libwhy{margin-top:8px;font-size:13px;line-height:1.55;color:var(--tx3)}
/* The original question, behind a disclosure. Quiet by default — it is provenance, not
   the thing being studied — but full contrast once opened, because the whole point is
   that it can actually be read and checked. */
/* One part of a long answer. Real separation, and a leading bold reads as the little
   heading it was always written to be. `.run` is the marker for that; the space above
   is larger than the space inside, so the eye groups each part correctly. */
/* ── the rail ──────────────────────────────────────────────────────────────
   A vertical line of stations, because it has to work at 375px and a horizontal
   metro line does not — the bead labels here are whole clauses, not station names. */
.railhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.rung{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;
  background:var(--gAcc,var(--card2));color:var(--acc);border:1px solid var(--bAcc);flex:0 0 auto}
.rung.r3,.rung.r4{background:var(--gHard);color:var(--hard);border-color:var(--bHard)}
.rask{font-size:13px;color:var(--tx2);line-height:1.5}
.rail{display:flex;flex-direction:column;gap:0;margin:4px 0 2px}
.bead{position:relative;font-size:14.5px;font-weight:700;color:var(--tx);line-height:1.45;
  padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.vrb{position:relative;font-size:12.5px;color:var(--tx2);line-height:1.4;padding:5px 12px 5px 8px;
  display:flex;align-items:center;gap:6px;font-style:italic}
.vrb .ar{color:var(--tx3);font-style:normal;font-weight:800}
/* A hidden bead or verb is a hole to fill, so it reads as an empty slot rather than as
   redacted text — dashed, dimmed, and the same height as what will replace it. */
.bead.hid,.vrb.hid{color:var(--tx3);border:1px dashed var(--line2);background:transparent;font-style:normal}
.vrb.hid{border-radius:8px;font-weight:700}
/* On reveal, the parts that WERE hidden are marked, so you can see at a glance which
   ones you were actually being asked for. */
.bead.was{border-color:var(--bAcc);background:var(--gAcc,var(--card2))}
.vrb.was{color:var(--acc);font-weight:700}
.pblk{margin:0}
.pblk+.pblk{margin-top:13px}
.pblk.run>b:first-child{display:block;margin-bottom:3px;color:var(--tx);font-weight:800;letter-spacing:.005em}
.damaged{margin-top:9px;font-size:12.5px;line-height:1.55;color:var(--tx2);background:var(--gHard);
  border:1px solid var(--bHard);border-radius:9px;padding:9px 12px}
.damaged .dm2{display:block;margin-top:5px;color:var(--tx3);font-size:11.5px}
.qorig{margin-top:8px}
.qorig>summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--tx3);list-style:none;
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
  background:var(--card2);border:1px solid var(--line)}
.qorig>summary::-webkit-details-marker{display:none}
.qorig>summary::before{content:"↩";font-size:11px}
.qorig>summary:hover{color:var(--tx2)}
.qorig[open]>summary{margin-bottom:7px}
.qorig .qo{font-size:13px;line-height:1.6;color:var(--tx2);white-space:pre-wrap;overflow-wrap:anywhere;
  padding:9px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--line2)}
.qorig .qon{font-size:11.5px;line-height:1.5;color:var(--tx3);margin-top:6px;font-style:italic}
/* Full choice sets in All cards / Search. The key is legible at a glance and the
   distractors stay readable rather than decorative — the point is to be able to judge
   whether the key beats them, which needs both at proper contrast. */
.optl{display:flex;gap:7px;align-items:flex-start;padding:2px 0;color:var(--tx3)}
.optl.ok{color:var(--tx);font-weight:700}
.optl .mk{flex:0 0 auto;width:12px;text-align:center;color:var(--tx3)}
.optl.ok .mk{color:var(--good)}
.optset{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px;padding-top:7px;border-top:1px dotted var(--line2)}
.optset .bn{flex:0 0 auto;font-size:10px;font-weight:800;min-width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:5px;background:var(--card2);color:var(--tx3);border:1px solid var(--line)}
.optset .opt{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--tx3);border:1px solid var(--line)}
.optset .opt.ok{background:var(--gGood);color:var(--good);border-color:var(--bGood);font-weight:750}
.optset .dl{font-size:11px;color:var(--tx3);font-style:italic}
.libcard .figwrap{margin-top:10px}
.libstale{margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--hard)}
/* The flag control. Quiet until it has been used — an outline button that turns
   into a warning chip — for the same reason the source badges are quiet: a loud
   affordance on every one of 586 cards is a texture, not a signal. */
.flagbtn{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:6px;
  border:1px solid var(--line2);background:none;color:var(--tx3);font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:.12s}
.flagbtn:hover{color:var(--tx);border-color:var(--tx3)}
.flagbtn.on{background:var(--gHard);color:var(--hard);border-color:var(--bHard);font-weight:800}
.flagpanel{margin-top:11px;padding:12px 13px;border:1px solid var(--bHard);border-radius:10px;background:var(--gHard);font-size:13px;line-height:1.55;color:var(--tx2);animation:pop .18s ease}
.flagpanel b{color:var(--tx)}
.flagpanel .chips{margin:9px 0 0}
/* `:not(.on)` is load-bearing. The panel sits on a --gHard wash, so an unselected
   chip needs a card-coloured fill to read at all — but `.flagpanel .chip` and
   `.chip.on` are both two classes, so the later rule was winning and repainting the
   SELECTED chip card-coloured while it kept `color:#fff`. White on white: in the
   light theme the reason you had just picked vanished. */
.flagpanel .chip:not(.on){background:var(--card)}
.flagpanel textarea{width:100%;margin-top:9px;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;
  color:var(--tx);font:inherit;font-size:13.5px;line-height:1.5;outline:none;resize:vertical;min-height:62px}
.flagpanel textarea:focus{border-color:var(--acc)}
.flagpanel .btnrow{margin-top:10px}
.flagpanel .btn{padding:10px 15px;font-size:13.5px}
.flagpanel .btn:disabled{opacity:.5;cursor:default}
.flagpanel .note{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--tx2)}
.revflag{margin-top:12px}
/* The type label and the flag button travel as one right-aligned unit. Two separate
   `margin-left:auto` items in the same wrapping row split the free space between
   them, which at 375px dropped the flag onto a line of its own, hard left, reading
   as a stray tag rather than a button. */
.cmend{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:8px}
.empty{color:var(--tx3);text-align:center;padding:40px 10px;font-size:14px}
/* ---- THE SPINE BAR — one segment per focus point, and the lock drawn --------
   The mechanic already existed in S.lock and nothing on screen showed it: a card
   locks on the SECOND correct answer an hour later, so a reader's entire first
   sitting moved no number at all. This is the fix, and it is a redraw of state that
   was already there — no score, no points, nothing invented.

   Four states, and the middle one is the whole reason this exists: HALF fills on the
   very first correct answer, ten seconds in. It also teaches the hour rule without a
   paragraph — a bar of half-fills means come back later.

   375px arithmetic: 375 − 32 padding = 343. 38 segments, 2px inside a system block,
   7px between blocks. `flex:1 1 0` + `min-width:0` everywhere is what makes that a
   floor rather than a hope: the segments shrink, they never push the page wide.
   Opaque, not glass — it is read, not looked through ([[house-design-system]]). */
.spinewrap{position:sticky;top:0;z-index:30;background:var(--bg);min-height:58px;
  padding:9px 0 10px;margin:0 0 10px;border-bottom:1px solid var(--line)}
.spinetop{display:flex;align-items:baseline;gap:8px;min-width:0;margin-bottom:7px}
.spinetop .n{font-size:13px;font-weight:700;color:var(--tx2);min-width:0;line-height:1.35}
.spinetop .n b{color:var(--acc-tx);font-weight:800}
.spinetop .d{font-size:11.5px;color:var(--tx3);white-space:nowrap;flex:0 0 auto}
.spineq{margin-left:auto;flex:0 0 auto;width:21px;height:21px;padding:0;border-radius:50%;
  border:1px solid var(--line2);background:var(--card);color:var(--tx3);
  font:inherit;font-size:12px;font-weight:800;line-height:1;cursor:pointer;align-self:center}
.spineq:hover,.spineq.on{color:var(--acc-tx);border-color:var(--acc)}
/* The block labels ride the SAME flex proportions as the bar, so a label sits over its
   own segments. Which text a block gets is MEASURED at render time — see
   fitSpineLabels — not guessed from how many focus points it holds. The guess it
   replaces ("narrower than a fifth of the bar gets no text") was written to keep
   "LYMPHATIC & IMMUNITY" out of 36px, and it did: it also left the third body system
   as an unlabelled run of segments beside two named ones, which is the one thing a
   block label exists to prevent. Clipping is still not allowed — a block that cannot
   hold even its short code gets its gap and nothing, and the expanded list names it. */
.spinelabs{display:flex;gap:7px;min-width:0;margin-bottom:4px}
.spinelab{min-width:0;overflow:hidden;white-space:nowrap;font-size:8.5px;font-weight:800;
  letter-spacing:.7px;text-transform:uppercase;color:var(--tx3)}
/* The last resort before a block goes nameless. At 375px the lymphatic block is 34px
   and its short code is 36px — two pixels are the whole difference between a named
   block and an anonymous one, and buying them back with tracking and half a point of
   size is worth more than the uniformity it costs. Applied per block, by the fit. */
.spinelab.tight{font-size:8px;letter-spacing:.2px}
.spinebar{display:flex;gap:7px;width:100%;min-width:0;background:none;border:0;padding:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.spinegrp{display:flex;gap:2px;min-width:0}
.sseg{flex:1 1 0;min-width:0;height:15px;border-radius:3px;position:relative;overflow:hidden;
  background:var(--line);opacity:.5;transition:opacity .3s,background .3s,box-shadow .4s}
.sseg i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--acc);opacity:.55;
  transition:height .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
/* SEEN is an OUTLINE, not a slightly paler fill. At 6.6px wide two flat greys ten
   percent apart are the same grey, and the difference between "never touched" and
   "started" is one the reader has to be able to read at a glance. */
.sseg.seen{opacity:1;background:none;box-shadow:inset 0 0 0 1.5px var(--line2)}
.sseg.half,.sseg.locked{opacity:1;background:var(--line2)}
.sseg.half i{height:50%}
.sseg.locked i{height:100%;opacity:1}
.sseg.locked{box-shadow:0 0 0 1px var(--bAcc),0 0 8px -2px var(--acc)}
.spinesub{font-size:11.5px;color:var(--tx3);margin-top:7px;line-height:1.45;min-width:0}
.spinesub b{color:var(--tx2);font-weight:700}
/* The expanded list is the blueprint, in place. It is the SAME rows Progress renders —
   one renderer, so the two surfaces cannot drift apart. */
.spineopen{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;margin:0 0 12px}
.spineopen h4{margin:0 0 3px;font-size:13px}
.spinehelp{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:12px;padding:13px 15px;margin:0 0 12px;font-size:13px;line-height:1.6;color:var(--tx2)}
.spinehelp dl{margin:9px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;align-items:baseline}
.spinehelp dt{font-weight:800;color:var(--tx);white-space:nowrap;font-size:12.5px}
.spinehelp dd{margin:0;font-size:12.5px;color:var(--tx3);min-width:0}
@media (prefers-reduced-motion:reduce){ .sseg,.sseg i{transition:none} }
/* ---- the reward dial: what that answer actually bought ----------------------
   In spirit from Giga's EarnedReadout (components/studio/DrillView.jsx:246, css :818):
   dials that DWELL after a grade, before you advance. "Answer → mark → next card" had
   no punctuation at all, and the one thing worth punctuating is the only claim the
   tool makes.

   HONEST BY CONSTRUCTION. It reports whatever lockMark actually returned, including
   "that did not count yet" — Giga's own rule, that a reward fires only when something
   really advanced, because a celebration over nothing discredits every other signal.
   Stacked at phone width; two columns only when there is room for two. */
.earned{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;margin:11px 0 0;
  padding:11px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--card2)}
@media (min-width:520px){ .earned{grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:9px 18px} }
.earned .dial{min-width:0}
.earned .k{display:block;font-size:9.5px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.earned .v{display:block;font-size:14px;font-weight:800;color:var(--tx);line-height:1.3}
.earned .v.on{color:var(--acc-tx)}
.earned .n{display:block;font-size:11.5px;color:var(--tx3);line-height:1.45;margin-top:3px}
.earned .n b{color:var(--tx2)}
/* ---- the ring bar: the one progress claim the tool makes ----
   Opaque, not glass: it sits still and is read, and nothing moves behind it.
   min-width:0 on the flex child because the ring line wraps at 375px and a long
   focus-point name would otherwise push the whole bar wider than the viewport. */
.ringbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 12px;min-width:0}
.ringline{font-size:14px;color:var(--tx);line-height:1.45}
.ringline b{color:var(--acc-tx)}
.ringsub{font-size:12.5px;color:var(--tx3);margin-top:3px;line-height:1.5}
.ringsub2{margin-top:9px}
.ringwarn{margin-top:9px;font-size:12.5px;line-height:1.55;color:var(--tx2);background:var(--gHard);border:1px solid var(--bHard);border-radius:9px;padding:9px 11px}
.ringwarn .btn{margin-top:7px}
.ringdone h3{margin:0 0 8px}
.ringdone p{font-size:14px;line-height:1.6;color:var(--tx2);margin:0 0 10px}
/* ---- the blueprint list ----
   `minmax(0,1fr)` on the text column, or a long focus-point name pushes the row wider
   than the card at 375px and takes the page with it. */
.bplist{display:flex;flex-direction:column;gap:2px}
.bprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:9px 8px;
  color:var(--tx);font:inherit;cursor:pointer}
.bprow:hover{background:var(--card2)}
.bpmark{width:20px;text-align:center;font-size:14px;color:var(--tx3)}
/* The same four states as a Spine Bar segment, and the same colour language: indigo
   means earned. HALF used to be folded into "started", which is precisely the state
   the reader most needs to see. */
.bprow.locked .bpmark{color:var(--good)}
.bprow.half .bpmark{color:var(--acc-tx)}
.bprow.seen .bpmark{color:var(--tx3)}
.bptx{min-width:0}
.bptx b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.bpsub{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px}
.bpgo{font-size:11.5px;color:var(--acc-tx);opacity:0;flex:0 0 auto}
.bprow:hover .bpgo{opacity:1}
@media (max-width:520px){ .bpgo{display:none} }
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--tx3)}

/* ================= the cram session ==================================
   Deliberately the loudest thing on the page. Every other control here asks the
   reader to make a decision first — which door, which topic, which filter — and a
   reader who has not opened the tool in four days does not want a decision, they
   want a start. This is the one control that needs no choice made before it works. */
.bigcram{display:block;width:100%;padding:20px 18px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  font-size:18px;font-weight:900;letter-spacing:.4px;line-height:1.25;
  box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 32%,transparent);
  margin-bottom:14px;transition:.14s;text-align:center}
.bigcram:hover{transform:translateY(-1px);box-shadow:0 14px 32px color-mix(in srgb,var(--acc) 40%,transparent)}
.bigcram small{display:block;font-size:12.5px;font-weight:600;opacity:.86;margin-top:5px;letter-spacing:0}

/* PIPS, NOT A PERCENTAGE BAR. You can count twelve dots and see the end of the
   thing; a bar at 25% invites the question "25% of what?", which is the question
   this whole view exists to stop being asked. */
.sessbar{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:var(--tx2)}
.pips{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.pips i{width:100%;max-width:16px;height:6px;border-radius:3px;background:var(--card2);
  border:1px solid var(--line);flex:1 1 8px;transition:.2s}
.pips i.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent}
.pips i.now{background:var(--acc-soft);border-color:var(--acc)}
.sessbar b{color:var(--tx);white-space:nowrap}
.sessbar .sx{margin-left:auto;font-size:11.5px;color:var(--tx3);background:none;border:none;
  text-decoration:underline;cursor:pointer;padding:0}
.sessbar .sx:hover{color:var(--tx2)}

/* Typed recall. The input is big because this gets used with thumbs. */
.tin{width:100%;padding:15px 16px;border-radius:13px;background:var(--card2);
  border:2px solid var(--line2);color:var(--tx);font-size:17px;font-weight:600;
  font-family:inherit;transition:.14s;margin-top:14px}
.tin:focus{outline:none;border-color:var(--acc);background:var(--card)}
.tin::placeholder{color:var(--tx3);font-weight:500}
.tin.hit{border-color:var(--good)} .tin.near{border-color:var(--hard)} .tin.miss{border-color:var(--miss)}
.tinhint{font-size:12px;color:var(--tx3);margin-top:8px;font-style:italic}
.tverdict{margin-top:13px;padding:12px 14px;border-radius:11px;font-size:14px;line-height:1.5;border:1px solid var(--line)}
.tverdict.hit{background:var(--gGood);border-color:var(--good);color:var(--tx)}
.tverdict.near{background:var(--gHard);border-color:var(--hard);color:var(--tx)}
.tverdict.miss{background:var(--gMiss);border-color:var(--miss);color:var(--tx)}
.tverdict b{font-weight:800}
.tovr{background:none;border:none;color:var(--tx3);font-size:12px;text-decoration:underline;
  cursor:pointer;padding:0;margin-top:9px;display:inline-block}
.tovr:hover{color:var(--tx2)}
.tblanks{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.tblanks label{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);
  font-weight:700;margin-bottom:5px;display:block}
.tblanks .tin{margin-top:0}

.sessdone{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:28px 24px;text-align:center;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.sessdone h3{font-size:22px;font-weight:900;margin-bottom:8px}
.sessdone p{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:8px}
.sessdone .tally{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.sessdone .tally div{background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:10px 14px;min-width:84px}
.sessdone .tally b{display:block;font-size:21px;font-weight:900;color:var(--tx)}
.sessdone .tally span{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="iconbtn" href="https://jeremyspm.github.io/" title="Back to the hub" style="width:auto;padding:0 13px;gap:5px;font-size:13px;font-weight:700;text-decoration:none">← Hub</a>
    <div class="brand"><b id="hTitle">Cram Engine</b><span id="hSub">content pack</span></div>
    <span class="dleft" id="hDays" hidden></span>
    <button class="iconbtn" id="btnTheme" title="Theme">◐</button>
  </header>
  <!-- THE SPINE BAR. It lives in the SHELL, not in a view, for one reason: the whole
       point of it is that it never goes away. A progress claim that only exists on the
       screen you were already looking at is the bug this element was built to fix.
       Two elements, not one: the bar is sticky and the expanded list is not, because a
       sticky element cannot be taller than the viewport without eating the page. -->
  <div id="spine" class="spinewrap" hidden></div>
  <div id="spineopen"></div>
  <div id="packwarn"></div>
  <div id="onboard"></div>
  <div class="controls">
    <!-- Three primary tabs is the whole tool: read it, practise it, sit it.
         Learn, Drill and Written used to be three of these, and the line between
         them was HOW a card gets marked — self-graded, machine-graded, or graded
         off marking points. That is an implementation detail wearing a navigation
         label, and it cost the reader twice: no screen could state one honest card
         count (Drill could only ever say "300" of a 586-card pack), and every
         written question appeared in two tabs at once, because Learn holds saq too.
         Search, Progress and Sources are things you go looking for, not things you
         do, so they stay behind the ···. -->
    <div class="seg" id="nav">
      <button data-v="brief" id="navBrief" hidden>Brief</button>
      <!-- Cram is Study with a fence around it: the same deck, the same order, cut off
           at a finishable number. It is a tab as well as a button because the button is
           how you START one and this is how you get back to one you left half-done.
           A RINGED PACK HIDES IT: Ring 0 already is a bounded, finishable set with an
           end screen, and two competing "start a short session" controls on one page is
           the thing the rebuild exists to remove. -->
      <button data-v="cram" id="navCram">Cram</button>
      <button data-v="study" class="on">Study</button>
      <!-- Mock test used to sit here. Progress is promoted into the bar in its place:
           it is now the only place a mark is reported, so it should not be behind ···. -->
      <button data-v="stats">Progress</button>
      <!-- Promoted out of ··· by a ringed pack, which wants exactly three tabs. -->
      <button data-v="search" id="navSearch" hidden>Search</button>
      <button id="navMore" title="More" aria-expanded="false" aria-controls="nav2">···</button>
    </div>
    <div class="seg hidden" id="nav2">
      <button data-v="cards">All cards</button>
      <button data-v="search" id="navSearch2">Search</button>
      <button data-v="audit" id="navAudit" hidden>Sources</button>
    </div>
  </div>
  <div id="view"></div>
  <div class="foot">Works offline, no account needed · sign in via the hub to sync your progress across devices</div>
</div>

<!-- Optional cloud sync: dormant unless signed in at jeremyspm.github.io. Fully offline-first without it.
     Copied into every tool made from this template, so new cram tools sync for free. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://jeremyspm.github.io/cloud/config.js"></script>
<script src="https://jeremyspm.github.io/cloud/cloud.js"></script>
<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  CONTENT PACK — replace everything between START and END to      ║
   ║  make a new cram tool. Schema: see README.md / PACK-SCHEMA.md    ║
   ╚══════════════════════════════════════════════════════════════════╝ */
/* ===== CONTENT PACK START ===== */
const PACK = {
  id: 'example-vitals',              // UNIQUE per tool — namespaces saved progress
  title: 'Vital Signs — Example Pack',
  subtitle: 'Cram Engine demo',
  // OPTIONAL — who teaches this course. The ENGINE never carries a name and never
  // carries a pronoun: it says "the lecturer" when this is absent, and uses the name
  // when it is present. Do not put a pronoun here; a shared template that assumes a
  // lecturer's gender is wrong for the next course by construction.
  lecturer: 'Dr Rangi',
  // Describes the REAL sitting. Nothing simulates the paper any more (the mock test
  // was removed — see "Mock test: REMOVED" below), but this is still load-bearing:
  // `auto`/`saq`/`minutes` are quoted in the first-run panel, and `auto`/`saq`/`mix`
  // feed paperWeights(), which is how the Progress projection weights the written and
  // machine-marked halves the way the real paper weights its marks.
  // OPTIONAL `date` (YYYY-MM-DD) puts a days-left counter in the header and feeds
  // the first-run panel. Omit it and both simply do not render.
  // `pass` is the benchmark. Set `passIsTarget:true` when the course does NOT publish
  // a pass mark — the engine then calls it a target and says so, instead of telling a
  // student they need a score the course has never asked for.
  exam: { auto: 6, saq: 1, minutes: 10, pass: 80, date: '2026-12-01',
          mix:{ mcq:.40, cloze:.20, match:.15, tfset:.15, order:.10 } },
  // OPTIONAL — enrols this tool in the hub's ⚡ Study engine. Point at ids
  // from the hub's deadlines.js and the hub can schedule this pack into
  // one-press sessions. Omit entirely to stay off the study bus.
  // studybus: { topic:'hs2-m1', assess:['hs2-t1','hs2-final'] },
  topics: [
    { id:'obs',  name:'Observations', icon:'🩺' },
    { id:'resp', name:'Respiratory',  icon:'🫁' },
  ],
  // OPTIONAL — the published assessment criteria this pack covers. The KEY stays
  // `criteria` because every pack and every build script already speaks it; the
  // student never meets the word, and every rendered string calls them FOCUS POINTS,
  // which is what the course's own document calls them.
  // Declaring them switches on the BRIEF view (cards grouped under each one and
  // rendered as readable prose) and the build-time coverage check. A card names one
  // with `crit:`. They may straddle topics — obs-1 below does — and the Brief copes.
  criteria: [
    { id:'obs-1',  name:'Normal adult vital sign ranges' },
    { id:'obs-2',  name:'Recognising and escalating deterioration' },
    { id:'resp-1', name:'Respiratory assessment and breathing patterns' },
  ],
  cards: [
    // ---- flashcards (type:'flash') ----
    // Flash ANSWERS are what the Brief renders as prose, so write them in teaching
    // order under each criterion — the Brief reads them top to bottom.
    { type:'flash', topic:'obs', crit:'obs-1', q:'Normal adult resting heart rate range?', a:'<b>60–100 beats per minute.</b> Below 60 = bradycardia, above 100 = tachycardia.' },
    { type:'flash', topic:'obs', crit:'obs-1', q:'Normal adult oral temperature range?', a:'Approximately <b>36.5–37.5 °C</b>. Above ~38.0 °C is generally considered febrile.' },
    { type:'flash', topic:'resp', crit:'obs-1', q:'Normal adult respiratory rate at rest?', a:'<b>12–20 breaths per minute.</b> RR is the most sensitive early indicator of deterioration.' },
    { type:'flash', topic:'resp', crit:'obs-1', q:'Normal SpO₂ range for a healthy adult?', a:'<b>95–100%</b> on room air (target may be 88–92% in some COPD patients per local policy).' },
    { type:'flash', topic:'obs', crit:'obs-2', q:'Which vital sign changes earliest in clinical deterioration, and why?', a:'<b>Respiratory rate.</b> It rises early because the body compensates for hypoxia and acidosis by increasing ventilation, long before the blood pressure moves. A <b>falling blood pressure is a late sign</b> — by the time it drops, compensation has already failed.' },
    // ---- MCQs (type:'mcq', correct = index into options) ----
    { type:'mcq', topic:'obs', crit:'obs-1', q:'An adult has a resting heart rate of 48 bpm. This is best described as:',
      options:['Tachycardia','Bradycardia','Normal sinus rate','Asystole'], correct:1,
      why:'Below 60 bpm at rest = <b>bradycardia</b>. Tachycardia is above 100 bpm.' },
    { type:'mcq', topic:'obs', crit:'obs-2', q:'Which vital sign change is often the EARLIEST indicator of clinical deterioration?',
      options:['Blood pressure fall','Temperature spike','Respiratory rate rise','Pupil dilation'], correct:2,
      why:'<b>Respiratory rate</b> rises early in deterioration; BP often falls late (compensated shock).' },
    { type:'mcq', topic:'obs', crit:'obs-1', q:'A blood pressure of 88/54 mmHg in an adult is best described as:',
      options:['Hypertensive','Normotensive','Hypotensive','A normal paediatric value only'], correct:2,
      why:'Systolic under ~90 mmHg is generally <b>hypotensive</b> in adults — assess the patient, not just the number.' },
    { type:'mcq', topic:'resp', crit:'obs-2', q:'Which SpO₂ reading on room air most warrants escalation in a previously well adult?',
      options:['98%','96%','95%','89%'], correct:3,
      why:'<b>89%</b> is below the normal 95–100% range and needs prompt assessment and escalation.' },
    { type:'mcq', topic:'resp', crit:'resp-1', q:'A respiratory rate of 26 breaths/min in a resting adult is:',
      options:['Bradypnoea','Within normal limits','Tachypnoea','Apnoea'], correct:2,
      why:'Above 20 breaths/min = <b>tachypnoea</b> — a red flag worth escalating.' },
    // ---- put in order (type:'order') — steps authored in the CORRECT sequence.
    //      Marks = one per step landed in the right slot. ----
    { type:'order', topic:'resp', crit:'resp-1', q:'Place the steps of a standard adult respiratory assessment in order.',
      steps:['Wash hands and introduce yourself','Position the patient upright and expose the chest',
             'Count respirations for a full 60 seconds without telling them','Note depth, rhythm and effort',
             'Document the rate and escalate if outside 12–20'],
      why:'Counting <b>without announcing it</b> matters — awareness changes the rate you are trying to measure.' },

    // ---- fill the blanks (type:'cloze') — .text carries [[1]] … [[n]].
    //      Marks = one per blank. ----
    { type:'cloze', topic:'obs', crit:'obs-2', q:'Complete the passage on escalating a deteriorating patient.',
      text:'A rising respiratory rate is an [[1]] sign of deterioration, while a falling blood pressure is usually a [[2]] one, because the body [[3]] for blood loss before the pressure drops.',
      blanks:[ {options:['early','irrelevant','late'],correct:0},
               {options:['early','late','harmless'],correct:1},
               {options:['compensates','stops perfusing','overcorrects'],correct:0} ],
      why:'This is why <b>respiratory rate</b> is the single most useful early observation.' },

    // ---- true / false set (type:'tfset') — ONE mark for the whole set unless
    //      you pass partial:true. That's how the real Canvas paper scores them. ----
    { type:'tfset', topic:'obs', crit:'obs-1', q:'Are the following statements about adult vital signs true or false?',
      statements:[ {s:'A resting heart rate of 55 bpm in an adult is bradycardic.',v:true},
                   {s:'A systolic blood pressure of 85 mmHg is within normal adult limits.',v:false},
                   {s:'Respiratory rate is usually the last vital sign to change in deterioration.',v:false} ],
      why:'All three have to be right to score the mark — that is the real marking rule.' },

    // ---- matching (type:'match') — right-hand values must be unique;
    //      distractors are extra wrong options. Marks = one per pair. ----
    { type:'match', topic:'resp', crit:'resp-1', q:'Match each breathing pattern to its correct term.',
      pairs:[ ['Respiratory rate above 20/min','Tachypnoea'],
              ['Respiratory rate below 12/min','Bradypnoea'],
              ['Absence of breathing','Apnoea'],
              ['Normal, unlaboured breathing','Eupnoea'] ],
      distractors:['Dyspnoea','Orthopnoea'] },

    // ---- marked short-answer (type:'saq', points = marking points) ----
    { type:'saq', topic:'obs', crit:'obs-1', q:'List the five core vital signs routinely measured in adult patients. (5 marks)', marks:5,
      points:['Temperature','Pulse / heart rate','Respiratory rate','Blood pressure','Oxygen saturation (SpO₂)'],
      model:'Many frameworks add pain as the "6th vital sign" and level of consciousness on EWS charts.' },
    // resp-1 has no flash card, so the Brief falls back to this SAQ's marking points.
    { type:'saq', topic:'resp', crit:'resp-1', q:'Give five observable signs of increased work of breathing. (5 marks)', marks:5,
      points:['Use of accessory muscles','Nasal flaring','Intercostal / subcostal recession','Tripod positioning','Inability to speak in full sentences'],
      model:'Also acceptable: audible wheeze/stridor, pursed-lip breathing, paradoxical breathing.' },
  ],
  glossary: [
    { term:'Bradycardia', def:'Resting heart rate below 60 bpm in an adult.' },
    { term:'Tachypnoea', def:'Respiratory rate above 20 breaths per minute in a resting adult.' },
    { term:'Hypoxaemia', def:'Abnormally low level of oxygen in the blood (low SpO₂ / PaO₂).' },
  ],
};
/* ===== CONTENT PACK END ===== */

'use strict';
/* ============================ engine ============================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* Stable per-card progress key: hash of type + question + a signature of the card's
   OWN content. Reordering cards is safe; editing a question or its answers resets
   just that card's progress.

   The content signature is not decoration. Harvested questions share generic stems —
   hs2-test1 has nine true/false sets all asking "Are the following true or false?"
   and ten cloze cards all titled "Complete the passage. (MODULE 1)". Keyed on the
   question alone, all ten collapsed onto ONE progress record: answering one marked
   the other nine answered, corrupted their accuracy, and lifted all ten out of the
   priority order together. 32 of 587 cards were affected. */
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'k'+(h>>>0).toString(36); }
function csig(c){
  return strip([c.a,c.text,(c.options||[]).join('~'),(c.statements||[]).map(s=>s.s).join('~'),
    (c.pairs||[]).map(p=>p.join('>')).join('~'),(c.steps||[]).join('~'),(c.points||[]).join('~'),
    /* A rail has no `q` and no answer — its identity IS its chain. Both beads and verbs
       go in, so re-labelling a relationship resets that rail's progress, which is right:
       the thing being remembered has changed. */
    (c.beads||[]).join('~'),(c.verbs||[]).join('~')]
    .filter(Boolean).join('|'));
}
function ckey(c){ return hash(c.type+'|'+strip(c.q||c.name||'')+'|'+csig(c)); }
const ckeyLegacy=c=>hash(c.type+'|'+strip(c.q));   // v2 keys, for migration only

/* ---- card taxonomy ----
   AUTO   = machine-marked; live in the Drill view
   RECALL = you grade yourself; live in Learn on the Leitner SRS          */
/* The top Leitner box. Declared HERE, with the other taxonomy constants, and not
   next to srsRate where it is used — validatePack() runs at module init and the rail
   ladder's reachability assertion reads it, so a declaration further down the file put
   it in the temporal dead zone and threw "Cannot access 'MAXBOX' before initialization"
   before a single card rendered. The build's parse check cannot see that: the file is
   syntactically perfect and dies at run time. Load the built page before believing it.

   It is named at all because the ladder has to map four rungs onto this range, and the
   two were written apart: the ladder first used thresholds of 2/4/6 against a box that
   stops at 4, so its hardest rung could never be reached by any reader. */
const MAXBOX=4;
const AUTO=['mcq','order','cloze','tfset','match'];
/* `rail` is RECALL, not AUTO: you rebuild it from memory and grade yourself, exactly
   like a flashcard. It is deliberately not machine-marked — the answer is a chain of
   ideas, and string-matching a reader's reconstruction against the authored wording
   would fail them for saying the same thing differently. */
const RECALL=['flash','saq','rail'];
const ALLTYPES=AUTO.concat(RECALL);
const isAuto=c=>AUTO.includes(c.type), isRecall=c=>RECALL.includes(c.type);
const TYPELABEL={mcq:'multichoice',order:'put in order',cloze:'fill the blanks',tfset:'true / false',match:'matching',saq:'written answer',flash:'flashcard',rail:'rebuild the chain'};

/* marks per card — mirrors how the real Canvas paper scores each type:
   ordering and cloze pay per correct position/blank, matching per pair,
   but a true/false SET is one single mark for getting the whole set right. */
function cardMarks(c){
  if(c.marks) return c.marks;
  switch(c.type){
    case 'order': return (c.steps||[]).length;
    case 'cloze': return (c.blanks||[]).length;
    case 'match': return (c.pairs||[]).length;
    case 'tfset': return c.partial?(c.statements||[]).length:1;
    case 'saq':   return (c.points||[]).length;
    default:      return 1;
  }
}

/* ---- pack validation (surface content-authoring mistakes loudly) ---- */
function validatePack(p){
  const errs=[];
  if(!p.id) errs.push('PACK.id missing');
  if(!p.topics||!p.topics.length) errs.push('PACK.topics empty');
  const tids=new Set((p.topics||[]).map(t=>t.id));
  const cids=new Set((p.criteria||[]).map(c=>c.id));
  (p.cards||[]).forEach((c,i)=>{
    const at=`card ${i} (${c.type||'?'})`;
    if(!tids.has(c.topic)) errs.push(`${at}: unknown topic "${c.topic}"`);
    /* A rail carries no question — it is a chain to rebuild, headed by its route name. */
    if(!c.q&&c.type!=='rail') errs.push(`${at}: no question`);
    if(c.crit&&cids.size&&!cids.has(c.crit)) errs.push(`${at}: unknown criterion "${c.crit}"`);
    if(!ALLTYPES.includes(c.type)){ errs.push(`${at}: unknown type "${c.type}"`); return; }
    if(c.type==='mcq'&&(!c.options||c.options.length<2||c.options.length>6||c.correct==null||c.options[c.correct]==null)) errs.push(`${at}: mcq needs 2–6 options and a valid correct index`);
    if(c.type==='flash'&&!c.a) errs.push(`${at}: flash has no answer`);
    if(c.type==='rail'){
      /* Every rung must be reachable by some box the SRS can actually produce. This
         caught the ladder shipping with its hardest rung above MAXBOX, where no reader
         could ever have seen it — a silent third of the feature missing. Checked once,
         on the first rail only, because it is a property of the ladder not the card. */
      if(!errs.__rungChecked){
        errs.__rungChecked=1;
        const reach=new Set(); for(let b=0;b<=MAXBOX;b++) reach.add(railRung(b));
        for(const want of [1,2,3,4]) if(!reach.has(want))
          errs.push(`rail ladder: rung ${want} is unreachable — no Leitner box from 0 to ${MAXBOX} produces it`);
      }
      const nb=(c.beads||[]).length, nv=(c.verbs||[]).length;
      if(nb<2) errs.push(`${at}: rail needs at least 2 beads`);
      /* n beads and n-1 verbs, always. Any other shape means the chain was assembled
         wrong and the renderer would silently drop or invent a step. */
      else if(nv!==nb-1) errs.push(`${at}: rail has ${nb} beads but ${nv} verbs — needs exactly ${nb-1}`);
      if((c.beads||[]).some(b=>!String(b||'').trim())) errs.push(`${at}: rail has an empty bead`);
      if((c.verbs||[]).some(v=>!String(v||'').trim())) errs.push(`${at}: rail has an empty relationship`);
    }
    if(c.type==='saq'&&(!c.points||!c.points.length)) errs.push(`${at}: saq has no marking points`);
    if(c.type==='order'){
      if(!c.steps||c.steps.length<3) errs.push(`${at}: order needs at least 3 steps, in the CORRECT sequence`);
    }
    if(c.type==='cloze'){
      if(!c.text) errs.push(`${at}: cloze needs a .text containing [[1]] … [[n]]`);
      if(!c.blanks||!c.blanks.length) errs.push(`${at}: cloze has no blanks`);
      (c.blanks||[]).forEach((b,k)=>{
        if(!b.options||b.options.length<2) errs.push(`${at}: blank ${k+1} needs 2+ options`);
        if(b.correct==null||b.options&&b.options[b.correct]==null) errs.push(`${at}: blank ${k+1} has no valid correct index`);
        const tok='[['+(k+1)+']]';
        if(c.text&&c.text.split(tok).length!==2) errs.push(`${at}: .text must contain ${tok} exactly once`);
      });
    }
    if(c.type==='tfset'){
      if(!c.statements||c.statements.length<2) errs.push(`${at}: tfset needs 2+ statements`);
      (c.statements||[]).forEach((s,k)=>{ if(!s.s) errs.push(`${at}: statement ${k+1} has no text`);
        if(typeof s.v!=='boolean') errs.push(`${at}: statement ${k+1} needs v:true or v:false`); });
    }
    if(c.type==='match'){
      if(!c.pairs||c.pairs.length<2) errs.push(`${at}: match needs 2+ pairs`);
      (c.pairs||[]).forEach((pr,k)=>{ if(!Array.isArray(pr)||pr.length!==2||!pr[0]||!pr[1]) errs.push(`${at}: pair ${k+1} must be [left, right]`); });
      // two prompts MAY share an answer (the runner de-duplicates the dropdown),
      // but a distractor that equals a real answer would be unanswerable
      const rights=(c.pairs||[]).map(pr=>pr&&pr[1]);
      ((c.distractors)||[]).forEach(d=>{ if(rights.includes(d)) errs.push(`${at}: distractor "${strip(d).slice(0,30)}" duplicates a real answer`); });
    }
  });
  errs.push(...validateCoverage(p));
  return errs;
}

/* ---- criterion coverage: prove the pack covers the published blueprint ----
   Optional. A pack with no PACK.criteria simply skips this.               */
function validateCoverage(p){
  if(!p.criteria||!p.criteria.length) return [];
  const errs=[];
  const thin=new Set((p.thin||[]).map(t=>t.id));
  p.criteria.forEach(cr=>{
    /* A card that ALSO covers this focus point counts toward it — the Brief already
       files it under both. Counting only `crit` here made the engine disagree with
       build.mjs, which has always counted both: the build could pass while the page
       reported a failure, which is precisely the split that let a self-warning ship. */
    const cs=(p.cards||[]).filter(c=>c.crit===cr.id||(c.alsoCrit||[]).includes(cr.id));
    /* EMPTY is the only authoring error left here. The card floor used to live in this
       function too, and it was the thing that kept twelve focus points topped up with
       cards written for no reason but to clear it. A pack that ships only sourced
       material cannot clear a floor by authoring, so being under it is a fact to
       DECLARE (PACK.thin, rendered in the Brief) and not an error to report.
       build.mjs holds the matching rule. */
    if(!cs.length) errs.push(`focus point "${cr.name||cr.id}" has no cards at all`);
    /* The declaration must be true. A pack claiming thin coverage on a focus point that
       is not in PACK.thin, or the reverse, means the two went out of sync in the
       generator and the reader is being told the wrong thing. */
    else if(thin.has(cr.id)!==((p.thin||[]).some(t=>t.id===cr.id&&t.n===cs.length)))
      errs.push(`focus point "${cr.name||cr.id}" is declared thin at a count that does not match its ${cs.length} cards`);
  });
  return errs;
}
/* Where validation failures go — and, more to the point, where they do not.

   These are AUTHORING errors phrased in authoring vocabulary, and they used to be the
   very first thing a cold reader saw: a build-time lint result rendered into the
   production page, telling a student in four words of jargon that the tool has
   problems with itself. Whatever that did for our integrity, what it did for theirs
   was make the thing look broken before they had read a single card.

   So the student never sees it and the author always does. `?dev=1` puts the banner
   back, the console carries it either way, the Sources view lists it for anyone who
   goes looking, and build.mjs now fails the build outright so a pack with errors in
   it does not reach a reader at all. Nothing is hidden; it has simply stopped being
   shouted at the person who cannot act on it. */
const DEV=new URLSearchParams(location.search).get('dev')==='1';
const packErrs=validatePack(PACK);
if(packErrs.length){
  console.warn(`[cram-engine] ${packErrs.length} content-pack issue(s). Open with ?dev=1 to see them in the page.\n  `+packErrs.join('\n  '));
  if(DEV) $('#packwarn').innerHTML=`<div class="packwarn">🔧 <b>Author view — ${packErrs.length} content-pack issue${packErrs.length===1?'':'s'}:</b> ${packErrs.map(esc).join(' · ')}</div>`;
}

/* ---- state ---- */
/* THE SCOPE OBJECT. Every way the reader can narrow the queue lives in one place,
   as five independent lists that are ANDed together (and ORed inside each list).

   It replaces `S.topic` (one topic at a time) and `S.crit` (one focus point, set by
   the Brief), which were two hand-rolled filters with two different shapes, two
   different clear buttons and no way to combine them — you could not ask for "the
   multichoice questions on the heart" at all, which is the thing a reader actually
   wants the night before a paper. Both migrate in below.

   Declared HERE, above `load()`'s first call, for the MAXBOX reason: a const used
   during module init and declared further down the file is a temporal-dead-zone
   throw that no parse check can see. */
const FILTDIMS=['topics','types','tiers','crits','status'];
const FILT0=()=>({topics:[],types:[],tiers:[],crits:[],status:[]});
const KEY='cramengine.'+PACK.id;
let S=load();
if(window.Cloud) Cloud.sync([KEY]);   // syncs this pack's progress across devices when signed in; no-op otherwise
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.srs) return migrate(s); }catch(e){}
  /* `flags` lives in the same blob as progress on purpose: Cloud.sync already carries
     this key, so a card flagged on a phone mid-revision is waiting on the laptop that
     can actually fix it. No new storage, no new sync path. */
  /* `exams:[]` used to sit here, holding the mock-test score history. The view is gone;
     the key is deliberately NOT migrated away, because a saved blob from before this
     build still carries it and dropping it on load would be a destructive write to a
     Cloud.sync'd record for no gain. It is simply never read again. */
  return {v:3,theme:'dark',topic:'all',door:'ready',bg:false,srs:{},mcq:{},read:{},saq:{},
          flags:{},libGroup:'topic',libAt:null,libAns:true,filters:FILT0(),libView:'read'};
}
/* v1 keyed progress by card index · v2 by a hash of the question · v3 adds the
   card's content signature so cards sharing a question stem stop sharing a record. */
function migrate(s){
  if(s.v===3) return s;
  if(!s.v||s.v<2){
    const remap=o=>{ const out={}; for(const k in o){
      if(/^\d+$/.test(k)){ const c=PACK.cards[+k]; if(c) out[ckeyLegacy(c)]=o[k]; }
      else out[k]=o[k]; } return out; };
    s.srs=remap(s.srs||{}); s.mcq=remap(s.mcq||{});
  }
  /* Where a v2 key belonged to exactly one card its record moves across. Where
     several cards shared it the record is DROPPED, not copied onto all of them —
     copying would silently mark up to nine never-seen cards as mastered, which is
     the opposite of what a cram tool should do with an uncertainty. */
  const owners={};
  PACK.cards.forEach(c=>{ const k=ckeyLegacy(c); (owners[k]=owners[k]||[]).push(c); });
  const lift=o=>{ const out={}; for(const k in o){
    const own=owners[k];
    if(own){ if(own.length===1) out[ckey(own[0])]=o[k]; }
